name: One-time chatbot mobile position fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix chatbot mobile floating position'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix chatbot launcher and status dot positioning
        shell: python
        run: |
          from pathlib import Path
          p = Path('ai-chatbot/public/widget.js')
          s = p.read_text(encoding='utf-8')
          old = "launcher.style.cssText=`width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#0a1e3a,#123c70);"
          new = "launcher.style.cssText=`position:relative;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#0a1e3a,#123c70);"
          if old not in s:
              raise SystemExit('launcher style target not found')
          s = s.replace(old, new, 1)
          old_css = "@media(max-width:520px){#shh-chatbot-container{right:8px!important;left:auto!important;bottom:8px!important;top:auto!important;width:calc(100vw - 16px)!important}#shh-chatbot-container>div{width:100%!important;height:60vh!important;max-height:60vh!important;min-height:0!important;border-radius:22px!important;margin-bottom:0!important}}"
          new_css = "@media(max-width:520px){#shh-chatbot-container{right:8px!important;left:auto!important;bottom:8px!important;top:auto!important;width:62px!important;height:62px!important}#shh-chatbot-container>div{position:fixed!important;right:8px!important;bottom:8px!important;width:calc(100vw - 16px)!important;height:60vh!important;max-height:60vh!important;min-height:0!important;border-radius:22px!important;margin-bottom:0!important}}"
          if old_css not in s:
              raise SystemExit('mobile css target not found')
          s = s.replace(old_css, new_css, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'StudentHubHelp'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-chatbot/public/widget.js
          git commit -m 'Fix chatbot mobile floating position'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/one-time-chatbot-mobile-position-fix.yml
          git add .github/workflows/one-time-chatbot-mobile-position-fix.yml
          git commit -m 'Remove one-time chatbot mobile position workflow'
          git push
