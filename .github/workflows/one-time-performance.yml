name: One Time Performance Optimization

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-performance.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Split admin view bundles safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/src/App.tsx')
          s = p.read_text(encoding='utf-8')

          old = "import React, {\n  useState,\n  useEffect,\n  useCallback,\n  useMemo,\n} from 'react';"
          new = "import React, {\n  useState,\n  useEffect,\n  useCallback,\n  useMemo,\n  Suspense,\n  lazy,\n} from 'react';"
          if old not in s:
              raise SystemExit('React import marker not found')
          s = s.replace(old, new, 1)

          replacements = {
            "import { OverviewView } from './components/OverviewView';": "const OverviewView = lazy(() => import('./components/OverviewView').then((m) => ({ default: m.OverviewView })));",
            "import { AnalyticsView } from './components/AnalyticsView';": "const AnalyticsView = lazy(() => import('./components/AnalyticsView').then((m) => ({ default: m.AnalyticsView })));",
            "import { UserManagementView } from './components/UserManagementView';": "const UserManagementView = lazy(() => import('./components/UserManagementView').then((m) => ({ default: m.UserManagementView })));",
            "import { PropertiesView } from './components/PropertiesView';": "const PropertiesView = lazy(() => import('./components/PropertiesView').then((m) => ({ default: m.PropertiesView })));",
            "import { UnverifiedPropertiesView } from './components/UnverifiedPropertiesView';": "const UnverifiedPropertiesView = lazy(() => import('./components/UnverifiedPropertiesView').then((m) => ({ default: m.UnverifiedPropertiesView })));",
            "import { PlatformControlViews } from './components/PlatformControlViews';": "const PlatformControlViews = lazy(() => import('./components/PlatformControlViews').then((m) => ({ default: m.PlatformControlViews })));",
            "import { IntelligenceViews } from './components/IntelligenceViews';": "const IntelligenceViews = lazy(() => import('./components/IntelligenceViews').then((m) => ({ default: m.IntelligenceViews })));",
          }
          for old_line, new_line in replacements.items():
              if old_line not in s:
                  raise SystemExit(f'Missing import marker: {old_line}')
              s = s.replace(old_line, new_line, 1)

          marker = '<main className="flex-1 p-6 md:p-8 max-w-7xl w-full mx-auto pb-20">'
          if marker not in s:
              raise SystemExit('Main marker not found')
          s = s.replace(marker, marker + "\n          <Suspense fallback={<div className=\"min-h-[240px] flex items-center justify-center text-xs text-slate-400\">Loading section…</div>}>", 1)

          end_marker = '        </main>'
          if end_marker not in s:
              raise SystemExit('Main closing marker not found')
          s = s.replace(end_marker, '          </Suspense>\n        </main>', 1)

          p.write_text(s, encoding='utf-8')
          print('Admin route-level view splitting applied')
          PY

      - name: Commit source optimization and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/src/App.tsx
          git rm .github/workflows/one-time-performance.yml
          git commit -m "Optimize admin loading with route-level code splitting [skip ci]"
          git push
