name: Build AI Chatbot

on:
  push:
    branches:
      - main
    paths:
      - 'ai-chatbot/src/**'
      - 'ai-chatbot/public/**'
      - 'ai-chatbot/package.json'
      - 'ai-chatbot/vite.config.ts'
      - 'ai-chatbot/index.html'
      - 'ai-chatbot/tsconfig.json'
      - '.github/workflows/ai-chatbot-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ai-chatbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-chatbot/package.json
      - name: Install dependencies
        working-directory: ai-chatbot
        run: npm install
      - name: Repair source and authentication compatibility
        run: |
          python3 -c 'from pathlib import Path; import re; p=Path("ai-chatbot/src/components/ChatWidget.tsx"); s=p.read_text(encoding="utf-8"); pattern=r";\s*\{properties\.length\s*>\s*0\s*&&\s*\(\s*<div className=[\"\\\x27]space-y-3[\"\\\x27]>\s*\{properties\.map\(renderPropertyCard\)\}\s*</div>\s*\)\}"; fixed,count=re.subn(pattern,";",s,count=1); p.write_text(fixed,encoding="utf-8") if count else None; print("ChatWidget repaired" if count else "ChatWidget already clean")'
          python3 -c 'from pathlib import Path; p=Path("ai-chatbot/src/components/BudgetPlannerCard.tsx"); s=p.read_text(encoding="utf-8"); a=s.find("  // Compute live items based on current sliderBudget"); b=s.find("  const items = calculateItems(sliderBudget);"); r="\n".join(["  // Use only live budget items returned by the API; never invent prices.","  const calculateItems = (_target: number): BudgetBreakdownItem[] => {","    const source = Array.isArray(initialPlan.items) ? initialPlan.items : [];","    return source","      .filter((item) => item && Number.isFinite(Number(item.amount)) && Number(item.amount) >= 0)","      .map((item) => ({","        category: item.category,","        label: item.label,","        amount: Number(item.amount),","        note: item.note,","      }));","  };",""]) + "\n"; p.write_text(s[:a]+r+s[b:],encoding="utf-8") if a != -1 and b != -1 and a < b else None; print("BudgetPlanner repaired" if a != -1 and b != -1 and a < b else "BudgetPlanner already clean")'
          sed -i "s#const defaultPublicKey = .*#const defaultPublicKey = 'sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFhT';#" ai-chatbot/public/widget.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-chatbot/src/components/ChatWidget.tsx')
          s=p.read_text(encoding='utf-8')
          old="${isExpanded?'w-[min(760px,calc(100vw-2rem))] h-[min(760px,calc(100vh-2rem))]':'w-[min(380px,62vw)] h-[min(640px,calc(100vh-90px))] sm:w-[380px] sm:h-[640px]'}"
          new="${isExpanded?'w-[min(760px,calc(100vw-2rem))] h-[min(760px,calc(100vh-2rem))]':'w-[min(340px,calc(100vw-72px))] h-[min(600px,calc(100vh-120px))] sm:w-[380px] sm:h-[640px]'}"
          if old not in s:
              raise SystemExit('Expected React chatbot sizing class was not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('React chatbot sizing updated')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-chatbot/src/components/ChatWidget.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('className="flex items-center gap-3 min-w-0"','className="flex items-center gap-2 min-w-0"',1)
          s=s.replace('className="w-12 h-12 rounded-2xl bg-amber-400','className="w-10 h-10 rounded-xl bg-amber-400',1)
          s=s.replace('className="font-extrabold text-base"','className="font-extrabold text-sm truncate"',1)
          s=s.replace('className="flex-1 h-11 rounded-xl border border-slate-200 px-3 text-sm outline-none','className="min-w-0 flex-1 h-11 rounded-xl border border-slate-200 px-2.5 text-sm outline-none',1)
          p.write_text(s,encoding='utf-8')
          print('Mobile content spacing hardened')
          PY
      - name: Compact responsive chatbot panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai-chatbot/public/widget.js')
          s = p.read_text(encoding='utf-8')
          old = "#shh-chatbot-container button:hover{filter:brightness(1.04)}@media(max-width:520px){#shh-chatbot-container{right:12px!important;left:auto!important;bottom:12px!important}#shh-chatbot-container>div{width:62vw!important;max-width:320px!important;height:min(600px,calc(100vh - 110px))!important;border-radius:20px!important}}@media(min-width:521px) and (max-width:900px){#shh-chatbot-container{right:16px!important;left:auto!important;bottom:16px!important}#shh-chatbot-container>div{width:min(380px,46vw)!important;height:min(640px,calc(100vh - 100px))!important}}@media(min-width:901px){#shh-chatbot-container>div{width:380px!important;height:min(660px,calc(100vh - 90px))!important}}"
          new = "#shh-chatbot-container button:hover{filter:brightness(1.04)}@media(max-width:520px){#shh-chatbot-container{right:12px!important;left:auto!important;bottom:12px!important}#shh-chatbot-container>div{width:min(340px,calc(100vw - 72px))!important;max-width:340px!important;height:min(600px,calc(100vh - 120px))!important;border-radius:20px!important;min-width:0!important}#shh-chatbot-container input{min-width:0!important;width:100%!important}}@media(min-width:521px) and (max-width:900px){#shh-chatbot-container{right:16px!important;left:auto!important;bottom:16px!important}#shh-chatbot-container>div{width:min(380px,46vw)!important;height:min(640px,calc(100vh - 100px))!important}}@media(min-width:901px){#shh-chatbot-container>div{width:380px!important;height:min(660px,calc(100vh - 90px))!important}}"
          if old not in s:
              raise SystemExit('Expected public widget responsive CSS block was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Public widget sizing updated')
          PY
      - name: Restore Vite source entry
        run: |
          cat > ai-chatbot/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>StudentHubHelp AI Chatbot & CRM System</title>
              <meta name="description" content="StudentHubHelp AI chatbot with live property search, budget planning, comparison, voice support and lead capture." />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF
      - name: Build AI chatbot
        working-directory: ai-chatbot
        env:
          VITE_CHAT_API_URL: https://idurlccrarznnnqixxsd.supabase.co/functions/v1/studenthubhelp-chat
        run: |
          export VITE_SUPABASE_ANON_KEY="$(python3 -c 'import re; from pathlib import Path; s=Path("public/widget.js").read_text(encoding="utf-8"); m=re.search(r"defaultPublicKey\s*=\s*[\x22\x27]([^\x22\x27]+)[\x22\x27]",s); print(m.group(1) if m else "")')"
          npx vite build
      - name: Publish production build into ai-chatbot
        run: |
          rm -rf /tmp/ai-chatbot-build
          mkdir -p /tmp/ai-chatbot-build
          cp -r ai-chatbot/dist/. /tmp/ai-chatbot-build/
          rm -rf ai-chatbot/assets
          cp -r /tmp/ai-chatbot-build/assets ai-chatbot/
          cp /tmp/ai-chatbot-build/index.html ai-chatbot/
      - name: Commit production build and source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot
          git diff --cached --quiet || git commit -m "Fix mobile chatbot text clipping [skip ci]"
          git push
