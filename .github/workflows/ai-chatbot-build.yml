name: Build AI Chatbot

on:
  push:
    branches:
      - main
    paths:
      - 'ai-chatbot/src/**'
      - 'ai-chatbot/public/**'
      - 'ai-chatbot/package.json'
      - 'ai-chatbot/vite.config.ts'
      - 'ai-chatbot/index.html'
      - 'ai-chatbot/tsconfig.json'
      - '.github/workflows/ai-chatbot-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ai-chatbot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-chatbot/package.json

      - name: Install dependencies
        working-directory: ai-chatbot
        run: npm install

      - name: Repair accidental JSX insertion in ChatWidget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ai-chatbot/src/components/ChatWidget.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = r';\s*\{properties\.length\s*>\s*0\s*&&\s*\(\s*<div className=["\\\']space-y-3["\\\']>\s*\{properties\.map\(renderPropertyCard\)\}\s*</div>\s*\)\}'
          fixed, count = re.subn(pattern, ';', s, count=1)
          if count:
              p.write_text(fixed, encoding='utf-8')
              print('Removed accidental JSX insertion from ChatWidget.tsx')
          else:
              print('No accidental JSX insertion found')
          PY

      - name: Build AI chatbot
        working-directory: ai-chatbot
        env:
          VITE_CHAT_API_URL: https://idurlccrarznnnqixxsd.supabase.co/functions/v1/studenthubhelp-chat
        run: |
          export VITE_SUPABASE_ANON_KEY="$(python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('public/widget.js').read_text(encoding='utf-8')
          m = re.search(r"defaultPublicKey\\s*=\\s*['\"]([^'\"]+)['\"]", s)
          print(m.group(1) if m else '')
          PY
          )"
          npx vite build

      - name: Publish production build into ai-chatbot
        run: |
          rm -rf /tmp/ai-chatbot-build
          mkdir -p /tmp/ai-chatbot-build
          cp -r ai-chatbot/dist/. /tmp/ai-chatbot-build/
          rm -rf ai-chatbot/assets
          cp -r /tmp/ai-chatbot-build/assets ai-chatbot/
          cp /tmp/ai-chatbot-build/index.html ai-chatbot/

      - name: Commit production build and source repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot
          git diff --cached --quiet || git commit -m "Build AI chatbot and fix ChatWidget source [skip ci]"
          git push
