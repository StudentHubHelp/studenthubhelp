name: Fix Property Listings Filters v2

on:
  push:
    paths:
      - '.github/workflows/fix-properties-filters-v2.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only PropertiesView filter logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin/src/components/PropertiesView.tsx')
          text = path.read_text(encoding='utf-8')

          start = text.find('      const areaQuery = areaFilter.trim().toLowerCase();')
          end_marker = '      return matchesCat && matchesArea && matchesStatus && matchesVerified && matchesFeatured && matchesOwner;'
          end = text.find(end_marker, start)

          if start < 0 or end < 0:
              raise SystemExit('Target filter block not found; no changes made.')

          end += len(end_marker)

          replacement = '''      const areaQuery = areaFilter.trim().toLowerCase();
      const ownerQuery = ownerFilter.trim().toLowerCase();
      const ownerPhoneQuery = ownerFilter.replace(/\\D/g, '');

      const textMatches = (value: unknown, query: string) =>
        !query || String(value ?? '').trim().toLowerCase().includes(query);

      const matchesArea = !areaQuery || [
        p.city,
        p.area,
        p.address,
        p.pincode,
      ].some((value) => textMatches(value, areaQuery));

      const matchesStatus =
        !statusFilter || propStatus(p) === statusFilter.trim().toLowerCase();

      const matchesVerified =
        !verifiedFilter ||
        (verifiedFilter === 'true' && propVerified(p)) ||
        (verifiedFilter === 'false' && !propVerified(p));

      const matchesFeatured =
        !featuredFilter ||
        (featuredFilter === 'true' && propFeatured(p)) ||
        (featuredFilter === 'false' && !propFeatured(p));

      const matchesOwner = !ownerQuery ||
        textMatches(p.owner_name, ownerQuery) ||
        textMatches(p.name, ownerQuery) ||
        textMatches(p.email, ownerQuery) ||
        textMatches(p.id, ownerQuery) ||
        (!!ownerPhoneQuery && String(p.phone ?? '').replace(/\\D/g, '').includes(ownerPhoneQuery));

      return matchesCat && matchesArea && matchesStatus && matchesVerified && matchesFeatured && matchesOwner;'''

          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          print('PropertiesView filter logic patched.')
          PY

      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/src/components/PropertiesView.tsx
          git commit -m "Fix All Property Listings filter logic"
          git push
          git rm .github/workflows/fix-properties-filters-v2.yml
          git commit -m "Remove temporary filter workflow v2"
          git push
