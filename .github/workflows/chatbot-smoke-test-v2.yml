name: Chatbot Live Smoke Test V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatbot-smoke-test-v2.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare endpoint credentials
        run: |
          echo "API=https://idurlccrarznnnqixxsd.supabase.co/functions/v1/studenthubhelp-chat" >> "$GITHUB_ENV"
          KEY=$(python3 - <<'PY'
          import re
          s=open('ai-chatbot/public/widget.js',encoding='utf-8').read()
          print(re.search(r"defaultPublicKey\\s*=\\s*['\"]([^'\"]+)",s).group(1))
          PY
          )
          echo "KEY=$KEY" >> "$GITHUB_ENV"
      - name: Test Sikar budget
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$API" -X POST -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --data '{"message":"sikar me rhne ka hr mhine ka kharcha lgbg kitna hoga","sessionId":"smoke-sikar-budget-v3"}' -o /tmp/a.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/a.json'))
          assert x.get('grounded') is True, x
          assert isinstance(x.get('budgetPlan'), dict), x
          assert isinstance(x.get('recommendations'), list), x
          print('Sikar budget PASS')
          PY
      - name: Test Sikar hostel
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$API" -X POST -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --data '{"message":"Sikar me active boys hostel dikhao","sessionId":"smoke-sikar-hostel-v3"}' -o /tmp/b.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/b.json'))
          assert x.get('grounded') is True, x
          assert all(p.get('type')=='hostel' for p in x.get('recommendations',[])), x
          print('Sikar hostel PASS', len(x.get('recommendations',[])))
          PY
      - name: Test Jaipur fallback
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$API" -X POST -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --data '{"message":"jaipur me ik mhine ka kharcha kitna hoga","sessionId":"smoke-jaipur-budget-v3"}' -o /tmp/c.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/c.json'))
          assert x.get('grounded') is True, x
          bp=x.get('budgetPlan') or {}
          assert bp.get('city')=='Jaipur', x
          assert bp.get('dataQuality',{}).get('estimatedCategories'), x
          print('Jaipur fallback PASS', bp.get('totalEstimated'))
          PY
