name: Fix suspension visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-suspension-visibility.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply suspension visibility guards
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          finder_tables = {
              'pg-finder.html': 'hostels',
              'tiffin-finder.html': 'tiffins',
              'library-finder.html': 'libraries',
              'cafe-finder.html': 'cafes',
              'bookstore-finder.html': 'bookstores',
          }

          for filename, table in finder_tables.items():
              p = Path(filename)
              if not p.exists():
                  print(f'SKIP missing {filename}')
                  continue
              s = p.read_text(encoding='utf-8')
              pat = re.compile(r'(\.from\(\s*[\"\']' + re.escape(table) + r'[\"\']\s*\))')
              m = pat.search(s)
              if not m:
                  print(f'NO QUERY FOUND {filename}')
                  continue
              window = s[m.start():m.start()+220]
              if re.search(r'\.eq\(\s*[\"\']status[\"\']\s*,\s*[\"\']active[\"\']\s*\)', window):
                  print(f'ALREADY GUARDED {filename}')
                  continue
              s = s[:m.end()] + '.eq("status","active")' + s[m.end():]
              p.write_text(s, encoding='utf-8')
              changed.append(filename)
              print(f'UPDATED {filename}')

          p = Path('property-details.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              pat = re.compile(r'(\.eq\(\s*lookupField\s*,\s*lookupValue\s*\))')
              m = pat.search(s)
              if m:
                  window = s[m.start():m.start()+180]
                  if not re.search(r'\.eq\(\s*[\"\']status[\"\']\s*,\s*[\"\']active[\"\']\s*\)', window):
                      s = s[:m.end()] + '.eq("status","active")' + s[m.end():]
                      p.write_text(s, encoding='utf-8')
                      changed.append('property-details.html')
                      print('UPDATED property-details.html')
                  else:
                      print('ALREADY GUARDED property-details.html')
              else:
                  print('NO LOOKUP QUERY FOUND property-details.html')

          print('Changed:', changed)

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'StudentHubHelp Status Guard'
          git config user.email 'actions@github.com'
          git add pg-finder.html tiffin-finder.html library-finder.html cafe-finder.html bookstore-finder.html property-details.html
          git add -u .github/workflows/fix-suspension-visibility.yml
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: enforce active-only public property visibility [suspension-fixed]'
          git push
