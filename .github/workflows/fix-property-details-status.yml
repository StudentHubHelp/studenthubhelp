name: Fix public property detail status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-property-details-status.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[detail-status-fixed]')"
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('property-details.html'); s=p.read_text()
          pat=r"(\.eq\(\s*['\"]slug['\"]\s*,\s*slug\s*\))"
          if ".eq('status','active')" in s: raise SystemExit(0)
          s2,n=re.subn(pat, r"\1.eq('status','active')", s, count=1)
          if n!=1: raise SystemExit('slug filter not found')
          p.write_text(s2)
          Path('.github/workflows/fix-property-details-status.yml').unlink()
      - shell: bash
        run: |
          grep -q "status','active" property-details.html
          git config user.name 'StudentHubHelp Status Guard'
          git config user.email 'actions@github.com'
          git add property-details.html
          git add -u .github/workflows/fix-property-details-status.yml
          git commit -m 'fix: hide suspended properties on public detail pages [detail-status-fixed]'
          git push
