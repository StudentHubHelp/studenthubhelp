name: Fix public property detail status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-property-details-status.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[detail-status-fixed]')"
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('property-details.html'); s=p.read_text()
          old=".from(cfg.table).select('*').eq('slug',slug).maybeSingle()"
          new=".from(cfg.table).select('*').eq('slug',slug).eq('status','active').maybeSingle()"
          if old not in s: raise SystemExit('property details load query not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/fix-property-details-status.yml').unlink()
      - shell: bash
        run: |
          grep -q ".eq('slug',slug).eq('status','active').maybeSingle()" property-details.html
          git config user.name 'StudentHubHelp Status Guard'
          git config user.email 'actions@github.com'
          git add property-details.html
          git add -u .github/workflows/fix-property-details-status.yml
          git commit -m 'fix: hide suspended properties on public detail pages [detail-status-fixed]'
          git push
