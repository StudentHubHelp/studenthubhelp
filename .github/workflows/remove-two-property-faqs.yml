name: Remove two property FAQ items only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-two-property-faqs.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove only the two requested FAQ items
        shell: python
        run: |
          from pathlib import Path
          p = Path('property-details.html')
          s = p.read_text(encoding='utf-8')

          old1 = "    ['Is the listed price guaranteed?',`No. A directory listing can become outdated. ${confirm}`],"
          old2 = "    ['Is availability guaranteed?',`No. Availability can change after a listing is published or reviewed. ${confirm}`],"
          new1 = "    ['How can I ask about the current price?',r.phone||r.contact_phone?'Use the Call or WhatsApp option on this page to ask about the current listed price and terms.':'Contact information is not currently listed on this page.'],"
          new2 = "    ['How can I check current availability?',r.phone||r.contact_phone?'Use the Call or WhatsApp option on this page to check current availability and visit details.':'Contact information is not currently listed on this page.'],"

          if old1 not in s or old2 not in s:
              raise SystemExit('Expected FAQ items were not found; no change made')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate only requested FAQ change
        shell: python
        run: |
          from pathlib import Path
          s=Path('property-details.html').read_text(encoding='utf-8')
          assert 'Is the listed price guaranteed?' not in s
          assert 'Is availability guaranteed?' not in s
          assert 'How can I ask about the current price?' in s
          assert 'How can I check current availability?' in s
          assert s.count("['") >= 12
          print('Requested FAQ-only change validated')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'StudentHubHelp'
          git config user.email 'actions@users.noreply.github.com'
          git add property-details.html
          git commit -m 'Refine two property detail FAQs only'
          git rm .github/workflows/remove-two-property-faqs.yml
          git commit -m 'Remove one-time FAQ workflow'
          git push
