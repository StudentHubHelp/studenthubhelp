name: Fix chatbot mobile sizing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch responsive CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai-chatbot/public/widget.js')
          s = p.read_text()
          old = "@media(max-width:520px){#shh-chatbot-container{right:8px!important;left:auto!important;bottom:8px!important}#shh-chatbot-container>div{width:calc(100vw - 16px)!important;height:calc(100vh - 16px)!important;max-height:calc(100vh - 16px)!important;border-radius:22px!important;margin-bottom:0!important}}"
          new = "@media(max-width:520px){#shh-chatbot-container{right:8px!important;left:auto!important;bottom:8px!important;top:auto!important;width:calc(100vw - 16px)!important}#shh-chatbot-container>div{width:100%!important;height:60vh!important;max-height:60vh!important;min-height:0!important;border-radius:22px!important;margin-bottom:0!important}}"
          if old not in s:
              raise SystemExit('target mobile CSS not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot/public/widget.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: make chatbot mobile 60vh"
          git push