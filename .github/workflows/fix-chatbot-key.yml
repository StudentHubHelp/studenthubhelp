name: Fix chatbot public key configuration
on:
  push:
    paths: ['.github/workflows/fix-chatbot-key.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix only chatbot key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-chatbot/public/widget.js')
          s=p.read_text(encoding='utf-8')
          old='sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFh5'
          new='sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFhT'
          if old not in s:
              raise SystemExit('expected old chatbot key not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-chatbot-key.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot/public/widget.js .github/workflows/fix-chatbot-key.yml
          git commit -m "Fix chatbot public key [skip ci]"
          git push