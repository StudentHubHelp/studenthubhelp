name: install search relevance fix

on:
  push:
    paths:
      - global-search.html
      - search-relevance-fix.js
      - search-distance-intelligence.js
      - search-phase1-intelligence.js
      - search-phase2-intelligence.js
      - .github/workflows/install-search-relevance-fix.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test search intelligence JavaScript
        shell: bash
        run: |
          node --check search-relevance-fix.js
          node --check search-distance-intelligence.js
          node --check search-phase1-intelligence.js
          node --check search-phase2-intelligence.js

      - name: Test phase 1 and phase 2 runtime APIs
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          window.ranked=(data)=>data.map((r,i)=>({...r,__score:i}));
          eval(fs.readFileSync('search-phase1-intelligence.js','utf8'));
          setTimeout(()=>{
            if(!window.__studentHubPhase1) throw new Error('Phase 1 did not install');
            const p1=window.__studentHubPhase1.parseIntent('girls hostal near piprali');
            if(p1.category!=='hostel'||!p1.groups.includes('girls')||!p1.near) throw new Error('Phase 1 intent test failed');
            global.window.__studentHubPhase1Installed=false;
            window.ranked=(data)=>data;
            eval(fs.readFileSync('search-phase2-intelligence.js','utf8'));
            setTimeout(()=>{
              if(!window.__studentHubPhase2) throw new Error('Phase 2 did not install');
              const p2=window.__studentHubPhase2;
              if(p2.maxPrice('hostel under 5000')!==5000) throw new Error('Phase 2 max-price test failed');
              if(p2.minPrice('hostel kam se kam 5000')!==5000) throw new Error('Phase 2 min-price test failed');
              const rows=[
                {name:'Girls PG A',category:'hostel',gender:'girls',monthly_rent:4500},
                {name:'Boys PG B',category:'hostel',gender:'boys',monthly_rent:4500}
              ];
              const out=window.ranked(rows,'girls hostel under 5000');
              if(!out.length||out[0].name!=='Girls PG A') throw new Error('Phase 2 compound ranking test failed');
              console.log('Phase 1 + Phase 2 runtime tests passed');
            },100);
          },100);
          setTimeout(()=>process.exit(0),500);
          NODE

      - name: Attach all search intelligence layers in order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('global-search.html')
          s=p.read_text(encoding='utf-8')
          files=[
              'search-relevance-fix.js',
              'search-distance-intelligence.js',
              'search-phase1-intelligence.js',
              'search-phase2-intelligence.js'
          ]
          # Remove any previous copies so order is deterministic and duplicates cannot accumulate.
          for f in files:
              s=re.sub(r'\s*<script\s+src=["\']'+re.escape(f)+r'["\']\s*></script>', '', s, flags=re.I)
          m=re.search(r'</body\s*>',s,re.I) or re.search(r'</html\s*>',s,re.I)
          if not m:
              raise SystemExit('global-search closing marker not found')
          tags='\n'.join(f'  <script src="{f}"></script>' for f in files)+'\n'
          s=s[:m.start()]+tags+s[m.start():]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify global search attachment order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('global-search.html').read_text(encoding='utf-8')
          files=['search-relevance-fix.js','search-distance-intelligence.js','search-phase1-intelligence.js','search-phase2-intelligence.js']
          pos=[s.find(f'<script src="{f}"></script>') for f in files]
          if any(x<0 for x in pos) or pos!=sorted(pos) or len(set(pos))!=4:
              raise SystemExit(f'Invalid search layer attachment: {pos}')
          print('All 4 search layers attached once and in correct order:', pos)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add global-search.html
          if git diff --cached --quiet; then
            echo 'Global search attachment already correct.'
            exit 0
          fi
          git commit -m 'fix: attach complete search intelligence chain'
          git push
