name: install search relevance fix

on:
  push:
    paths:
      - global-search.html
      - search-relevance-fix.js
      - search-distance-intelligence.js
      - search-phase1-intelligence.js
      - search-phase2-intelligence.js
      - search-phase3-location-intelligence.js
      - search-phase4-final-fusion.js
      - search-phase5-natural-language.js
      - .github/workflows/install-search-relevance-fix.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test search intelligence JavaScript
        shell: bash
        run: |
          for f in search-relevance-fix.js search-distance-intelligence.js search-phase1-intelligence.js search-phase2-intelligence.js search-phase3-location-intelligence.js search-phase4-final-fusion.js search-phase5-natural-language.js; do
            node --check "$f"
          done

      - name: Run 45 search intelligence tests
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const tests=[];
          const ok=(name,condition,detail='')=>{tests.push({name,ok:!!condition,detail});if(!condition) console.error(`FAIL ${tests.length}: ${name} ${detail}`);};
          (async()=>{
            global.window={};
            window.ranked=(data)=>data.map((r,i)=>({...r,__score:i}));
            eval(fs.readFileSync('search-phase1-intelligence.js','utf8')); await wait(100);
            const p1=window.__studentHubPhase1;
            ok('01 Phase1 installs',!!p1);
            ok('02 hostel synonym',p1.parseIntent('pg near piprali').category==='hostel');
            ok('03 girls intent',p1.parseIntent('girls hostel').groups.includes('girls'));
            ok('04 boys intent',p1.parseIntent('boys pg').groups.includes('boys'));
            ok('05 tiffin intent',p1.parseIntent('tiffin mess').category==='tiffin');
            ok('06 library intent',p1.parseIntent('study library').category==='library');
            ok('07 cafe intent',p1.parseIntent('coffee shop').category==='cafe');
            ok('08 bookstore intent',p1.parseIntent('book shop').category==='bookstore');
            ok('09 veg intent',p1.parseIntent('pure veg tiffin').groups.includes('veg'));
            ok('10 cheap intent',p1.parseIntent('cheap hostel').groups.includes('cheap'));
            ok('11 premium intent',p1.parseIntent('premium cafe').groups.includes('premium'));
            ok('12 typo tolerance',p1.parseIntent('hostal near piprali').category==='hostel');
            ok('13 near intent',p1.parseIntent('hostel near piprali').near===true);

            window.ranked=(data)=>data;
            eval(fs.readFileSync('search-phase2-intelligence.js','utf8')); await wait(100);
            const p2=window.__studentHubPhase2;
            ok('14 Phase2 installs',!!p2);
            ok('15 max price',p2.maxPrice('hostel under 5000')===5000);
            ok('16 min price Hindi',p2.minPrice('hostel kam se kam 5000')===5000);
            ok('17 min price English',p2.minPrice('hostel above 5000')===5000);
            ok('18 comma price',p2.maxPrice('hostel under 10,000')===10000);
            ok('19 compound gender price',(()=>{const r=p2.conditionScore({category:'hostel',gender:'girls',monthly_rent:4500},'girls hostel under 5000');return r.matched===r.required&&r.score>0;})());
            ok('20 expensive price condition fails',(()=>{const r=p2.conditionScore({category:'hostel',monthly_rent:8000},'hostel under 5000');return r.required===2&&r.matched<r.required&&r.max===5000;})());
            ok('21 veg matching',p2.conditionScore({category:'tiffin',food_type:'pure veg',price:120},'veg tiffin').matched>=2);
            ok('22 category matching',p2.conditionScore({category:'library'},'library').matched>=1);
            ok('23 no explicit filter safety',p2.conditionScore({name:'Alpha PG'},'Alpha').required===0);

            window.ranked=(data)=>data.map((r,i)=>({...r,__score:i}));
            eval(fs.readFileSync('search-phase3-location-intelligence.js','utf8')); await wait(100);
            const p3=window.__studentHubPhase3;
            ok('24 Phase3 installs',!!p3);
            const qAllen=p3.queryInfo('girls hostel near Allen on Piprali Road');
            ok('25 Piprali road parsing',qAllen.roads.includes('piprali'));
            ok('26 Allen landmark parsing',qAllen.landmarks.includes('allen'));
            ok('27 near relation parsing',qAllen.relations.includes('near'));
            ok('28 opposite relation',p3.queryInfo('cafe opposite Allen').relations.includes('opposite'));
            ok('29 beside relation',p3.queryInfo('hostel next to CLC').relations.includes('beside'));
            ok('30 behind relation',p3.queryInfo('library behind SK College').relations.includes('behind'));
            ok('31 front relation',p3.queryInfo('cafe in front of railway station').relations.includes('front'));
            const btw=p3.queryInfo('hostel between Allen and CLC');
            ok('32 between parsing',btw.between&&btw.landmarks.length===2);
            ok('33 Nawalgarh road parsing',p3.queryInfo('pg on Nawalgarh Road').roads.includes('nawalgarh'));
            ok('34 railway landmark parsing',p3.queryInfo('library near railway station').landmarks.includes('railway_station'));
            ok('35 location score evidence',p3.scoreLocation({area:'Piprali Road',nearby:'Allen Career Institute'},'near Allen on Piprali Road').score>0);

            window.ranked=(data)=>data.map((r,i)=>({...r,__score:i}));
            eval(fs.readFileSync('search-phase4-final-fusion.js','utf8')); await wait(100);
            const p4=window.__studentHubPhase4;
            ok('36 Phase4 installs',!!p4);
            ok('37 query tokenization',p4.queryParts('girls hostel near Allen under 5000').length>=2);
            const rows=[
              {property_id:'1',name:'Allen Girls PG',category:'hostel',gender:'girls',area:'Piprali Road',nearby:'Allen Career Institute',monthly_rent:4500,verified:true,phone:'9999999999'},
              {property_id:'1',name:'Allen Girls PG Duplicate',category:'hostel',gender:'girls',area:'Piprali Road',monthly_rent:4500},
              {property_id:'2',name:'Generic Boys PG',category:'hostel',gender:'boys',area:'Nawalgarh Road',monthly_rent:6000}
            ];
            const query='girls hostel near Allen on Piprali Road under 5000';
            const out=window.ranked(rows,query);
            ok('38 final compound ranking',out.length>0&&out[0].name==='Allen Girls PG');
            ok('39 duplicate removal',out.filter(r=>r.property_id==='1').length===1);
            const meta=p4.scoreFinal(rows[0],query);
            ok('40 confidence coverage',meta.coverage>=0.5);
            ok('41 positive final score',meta.final>0);
            const exactMeta=p4.scoreFinal(rows[0],'Allen Girls PG');
            ok('42 exact name support',exactMeta.exact>0&&exactMeta.bonus>0);
            ok('43 Hindi/Hinglish query support',p4.queryParts('ladkiyon ka pg piprali ke paas').length>0);
            ok('44 multi-condition fusion',p4.scoreFinal(rows[0],query).final>p4.scoreFinal(rows[2],query).final);
            const tie=window.ranked([{property_id:'a',name:'Beta PG',category:'hostel'},{property_id:'b',name:'Alpha PG',category:'hostel'}],'hostel');
            ok('45 deterministic tie-break',tie.length>=2&&tie[0].name==='Alpha PG');
            const passed=tests.filter(t=>t.ok).length;
            console.log(`SEARCH TEST RESULT: ${passed}/${tests.length} passed`);
            if(passed!==45) process.exit(1);
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE


      - name: Run 8 rounds of natural-language search regression (120 checks)
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const rows=[
              {property_id:'t1',name:'Allen Area Tiffin',category:'tiffin',city:'Sikar',area:'Piprali Road',nearby:'Allen Career Institute',address:'Near Allen, Piprali Road, Sikar',food_type:'pure veg'},
              {property_id:'t2',name:'CLC Chowk Cafe',category:'cafe',city:'Sikar',area:'Piprali Road',nearby:'CLC Chowk',address:'CLC Chowk, Piprali Road, Sikar'},
              {property_id:'t3',name:'Allen Boys Hostel',category:'hostel',city:'Sikar',area:'Piprali Road',nearby:'Allen Career Institute',gender:'boys'},
              {property_id:'t4',name:'Kalam Girls Hostel',category:'hostel',city:'Sikar',area:'Nawalgarh Road',nearby:'Kalam',gender:'girls'},
              {property_id:'t5',name:'Aakash Cafe',category:'cafe',city:'Sikar',area:'Piprali Road',nearby:'Aakash Institute',address:'Opposite Aakash, Piprali Road'},
              {property_id:'t6',name:'Allen Book Depot',category:'bookstore',city:'Sikar',area:'Piprali Road',nearby:'Allen Career Institute'},
              {property_id:'t7',name:'Talwandi Allen PG',category:'hostel',city:'Kota',area:'Talwandi',nearby:'Allen Satyarth',gender:'boys'},
              {property_id:'t8',name:'Jawahar Allen Girls Hostel',category:'hostel',city:'Kota',area:'New Jawahar Nagar',nearby:'Allen Sammunat',gender:'girls'},
              {property_id:'t9',name:'Talwandi Veg Hostel',category:'hostel',city:'Kota',area:'Talwandi',nearby:'Allen Satyarth',food_type:'pure veg'},
              {property_id:'t10',name:'Indra Vihar Boys PG',category:'hostel',city:'Kota',area:'Indra Vihar',nearby:'Coaching Area',gender:'boys'},
              {property_id:'t11',name:'Jagatpura Girls PG',category:'hostel',city:'Jaipur',area:'Jagatpura',nearby:'Power House',gender:'girls'},
              {property_id:'t12',name:'Pratap Nagar Girls PG',category:'hostel',city:'Jaipur',area:'Pratap Nagar',nearby:'Pannadhay Circle',gender:'girls'},
              {property_id:'t13',name:'Indiranagar Cafe',category:'cafe',city:'Bengaluru',area:'Indiranagar',facilities:'Wi-Fi'},
              {property_id:'t14',name:'Basavanagudi Veg Tiffin',category:'tiffin',city:'Bengaluru',area:'Basavanagudi',food_type:'vegetarian'},
              {property_id:'t15',name:'HSR Library',category:'library',city:'Bengaluru',area:'HSR Layout'}
            ];
            const cases=[
              ['allen k pass me tiffin','t1'],['Sikar me CLC Chowk par cafe','t2'],
              ['Sikar Piprali Road par Allen ke paas boys hostel','t3'],
              ['Sikar Nawalgarh Road par girls hostel near Kalam','t4'],
              ['Sikar Piprali Road par Aakash ke opposite cafe','t5'],
              ['Sikar me Piprali Road par bookstore near Allen','t6'],
              ['Kota Talwandi me Allen Satyarth ke paas boys PG','t7'],
              ['Kota New Jawahar Nagar me Allen Sammunat ke paas girls hostel','t8'],
              ['Kota Talwandi me pure veg food wala hostel','t9'],
              ['Kota Indra Vihar me boys hostel near coaching','t10'],
              ['Jaipur Jagatpura me girls PG near Power House','t11'],
              ['Jaipur Pratap Nagar me girls PG near Pannadhay Circle','t12'],
              ['Bengaluru Indiranagar me cafe with WiFi','t13'],
              ['Bengaluru Basavanagudi me vegetarian tiffin','t14'],
              ['Bengaluru HSR Layout me library','t15']
            ];
            for(let round=1;round<=8;round++){
              global.window={};
              window.ranked=(data,q)=>{
                const n=String(q).toLowerCase();
                const cat=n.includes('tiffin')||n.includes('mess')?'tiffin':n.includes('cafe')?'cafe':(n.includes('hostel')||n.includes('pg'))?'hostel':n.includes('bookstore')?'bookstore':n.includes('library')?'library':null;
                return cat?data.filter(r=>r.category===cat).map(r=>({...r,__score:10})):[]; 
              };
              eval(fs.readFileSync('search-phase5-natural-language.js','utf8')); await wait(80);
              if(!window.__studentHubPhase5) throw new Error('Phase5 did not install in round '+round);
              for(const [q,want] of cases){
                const out=window.ranked(rows,q);
                if(!out.length||out[0].property_id!==want){
                  throw new Error('Round '+round+' failed: '+q+' => '+(out[0]?.name||'NO RESULT')+' expected '+want);
                }
              }
              console.log('ROUND '+round+': 15/15 PASS');
            }
            const cityRows=[{property_id:'s',name:'Sikar Allen Tiffin',category:'tiffin',city:'Sikar',area:'Piprali Road',nearby:'Allen'},{property_id:'k',name:'Kota Allen Tiffin',category:'tiffin',city:'Kota',area:'Talwandi',nearby:'Allen'}];
            for(const q of ['Sikar me Allen ke paas tiffin','Sikar Allen ke near tiffin']){
              const out=window.ranked(cityRows,q);
              if(!out.length||out.some(r=>r.city!=='Sikar')) throw new Error('City leakage: '+q);
            }
            for(const q of ['Kota me Allen ke paas tiffin','Kota Allen ke near tiffin']){
              const out=window.ranked(cityRows,q);
              if(!out.length||out.some(r=>r.city!=='Kota')) throw new Error('City leakage: '+q);
            }
            console.log('CITY-SCOPE REGRESSION: 4/4 PASS');
            console.log('NATURAL LANGUAGE REGRESSION: 120/120 PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Attach all search intelligence layers in order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('global-search.html'); s=p.read_text(encoding='utf-8')
          files=['search-relevance-fix.js','search-distance-intelligence.js','search-phase1-intelligence.js','search-phase2-intelligence.js','search-phase3-location-intelligence.js','search-phase4-final-fusion.js','search-phase5-natural-language.js']
          for f in files: s=re.sub(r'\s*<script\s+src=["\']'+re.escape(f)+r'["\']\s*></script>','',s,flags=re.I)
          m=re.search(r'</body\s*>',s,re.I) or re.search(r'</html\s*>',s,re.I)
          if not m: raise SystemExit('global-search closing marker not found')
          tags='\n'.join(f'  <script src="{f}"></script>' for f in files)+'\n'
          p.write_text(s[:m.start()]+tags+s[m.start():],encoding='utf-8')
          PY

      - name: Verify global search attachment order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('global-search.html').read_text(encoding='utf-8')
          files=['search-relevance-fix.js','search-distance-intelligence.js','search-phase1-intelligence.js','search-phase2-intelligence.js','search-phase3-location-intelligence.js','search-phase4-final-fusion.js','search-phase5-natural-language.js']
          pos=[s.find(f'<script src="{f}"></script>') for f in files]
          if any(x<0 for x in pos) or pos!=sorted(pos) or len(set(pos))!=7: raise SystemExit(f'Invalid search layer attachment: {pos}')
          print('All 7 search layers attached once and in correct order:',pos)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add global-search.html
          if git diff --cached --quiet; then echo 'Global search attachment already correct.'; exit 0; fi
          git commit -m 'test: finalize 45-case search validation suite'
          git push
