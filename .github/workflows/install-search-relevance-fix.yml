name: install search relevance fix

on:
  push:
    paths:
      - global-search.html
      - search-relevance-fix.js
      - search-distance-intelligence.js
      - search-phase1-intelligence.js
      - .github/workflows/install-search-relevance-fix.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach search intelligence layers to global search
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('global-search.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '  <script src="search-relevance-fix.js"></script>',
              '  <script src="search-distance-intelligence.js"></script>',
              '  <script src="search-phase1-intelligence.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  m = re.search(r'</body\\s*>', s, re.I)
                  if not m:
                      m = re.search(r'</html\\s*>', s, re.I)
                  if not m:
                      raise SystemExit('global-search closing marker not found')
                  s = s[:m.start()] + tag + '\\n' + s[m.start():]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- global-search.html; then
            echo 'No HTML change needed.'
            exit 0
          fi
          git add global-search.html
          git commit -m 'feat: attach phase 1 search intelligence'
          git push
