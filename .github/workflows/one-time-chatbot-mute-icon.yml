name: Set chatbot mute icon

on:
  push:
    branches: [main]
    paths:
      - 'ai-chatbot/public/widget.js'
      - '.github/workflows/one-time-chatbot-mute-icon.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set muted icon
        shell: python
        run: |
          from pathlib import Path
          p = Path('ai-chatbot/public/widget.js')
          text = p.read_text(encoding='utf-8')
          old = '<button id="shh-tts" aria-label="Toggle voice" style="background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:9px;padding:7px;cursor:pointer">🔊</button>'
          new = '<button id="shh-tts" aria-label="Toggle voice" style="background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:9px;padding:7px;cursor:pointer">🔇</button>'
          if old not in text:
              raise SystemExit('Expected voice toggle markup was not found; no change made.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot/public/widget.js
          git diff --cached --quiet || git commit -m "Show chatbot voice muted by default [skip ci]"
          rm -f .github/workflows/one-time-chatbot-mute-icon.yml
          git add .github/workflows/one-time-chatbot-mute-icon.yml
          git diff --cached --quiet || git commit -m "Remove one-time chatbot mute icon workflow [skip ci]"
          git push
