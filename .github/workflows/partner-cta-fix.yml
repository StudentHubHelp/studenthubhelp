name: Fix Partner Application Links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix CTA links
        shell: python
        run: |
          from pathlib import Path
          p=Path('partner.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('auth.html?partner=apply','partner-apply.html')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partner.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: point partner CTAs to application form"
          git push
