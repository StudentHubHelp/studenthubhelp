name: One-time Property ID display fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-property-id-display:
    if: ${{ !contains(github.event.head_commit.message, '[property-id-display-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change display-only Property ID references
        shell: python
        run: |
          from pathlib import Path

          files = [
              'library-finder.html',
              'pg-finder.html',
              'tiffin-finder.html',
              'cafe-finder.html',
              'bookstore-finder.html',
          ]

          replacements = [
              ('ID #${escapeHTML(id)}', 'ID #${escapeHTML(clean(record.property_id))}'),
              ('Property ID: #${escapeHTML(id)}', 'Property ID: #${escapeHTML(clean(record.property_id))}'),
              ('document.getElementById("modalPropertyId").textContent = "Property ID: #" + id;', 'document.getElementById("modalPropertyId").textContent = "Property ID: #" + clean(record.property_id);'),
              ('document.getElementById("modalId").textContent = "#" + id;', 'document.getElementById("modalId").textContent = "#" + clean(record.property_id);'),
              ('bookingPropertyId.textContent = "Property ID: #" + id;', 'bookingPropertyId.textContent = "Property ID: #" + clean(currentRecord.property_id);'),
          ]

          for filename in files:
              path = Path(filename)
              original = path.read_text(encoding='utf-8')
              text = original
              counts = []
              for old, new in replacements:
                  n = text.count(old)
                  counts.append(n)
                  if n != 1:
                      raise SystemExit(f'{filename}: expected exactly 1 occurrence of {old!r}, found {n}; no file written')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='')
              print(f'{filename}: replacements applied {counts}')

      - name: Commit only the five finder files and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library-finder.html pg-finder.html tiffin-finder.html cafe-finder.html bookstore-finder.html
          git diff --cached --check
          git rm .github/workflows/one-time-property-id-display-fix.yml
          git add library-finder.html pg-finder.html tiffin-finder.html cafe-finder.html bookstore-finder.html
          git diff --cached --check
          git commit -m "[property-id-display-fix] Show 10-digit Property IDs in finder pages"
          git push
