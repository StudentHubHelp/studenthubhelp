name: Chatbot PR validation

on:
  push:
    branches:
      - fix/chatbot-reliability-security
    paths:
      - 'supabase/functions/studenthubhelp-chat/**'
      - 'supabase/migrations/*chatbot*'
      - 'ai-chatbot/**'
      - 'widget.js'
      - '.github/workflows/chatbot-pr-check.yml'
  pull_request:
    paths:
      - 'supabase/functions/studenthubhelp-chat/**'
      - 'supabase/migrations/*chatbot*'
      - 'ai-chatbot/**'
      - 'widget.js'
      - '.github/workflows/chatbot-pr-check.yml'

permissions:
  contents: read

jobs:
  edge-function-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/studenthubhelp-chat/index.ts

  react-chatbot-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-chatbot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-chatbot/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Type-check React chatbot component
        run: npx tsc --noEmit --skipLibCheck --jsx react-jsx --target ES2020 --module ESNext --moduleResolution bundler --allowImportingTsExtensions --types vite/client src/components/ChatWidget.tsx
      - name: Restore Vite source entry for validation
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>StudentHubHelp AI Chatbot</title>
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF
      - name: Build chatbot
        run: npm run build
