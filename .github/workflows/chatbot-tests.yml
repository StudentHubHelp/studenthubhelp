name: Chatbot regression tests

on:
  push:
    branches: [main]
    paths:
      - 'chatbot/**'
      - '.github/workflows/chatbot-tests.yml'
  pull_request:
    paths:
      - 'chatbot/**'
      - '.github/workflows/chatbot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chatbot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
      - name: Check chatbot JavaScript syntax
        run: node --check chatbot/chatbot.js
      - name: Run chatbot intent and location regression tests
        run: node --test chatbot/chatbot.test.mjs
