name: Apply Global Search Fix
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch global-search.html
        run: |
          python3 -c 'import base64; from pathlib import Path; p=Path("global-search.html"); s=p.read_text(encoding="utf-8"); s=s.replace("<link rel=\"icon\" href=\"favicon.ico\">","<link rel=\"icon\" type=\"image/png\" href=\"logo.png\">"); s=s.replace(base64.b64decode("Y29uc3QgZGIgPQogICAgICBzdXBhYmFzZS5jcmVhdGVDbGllbnQoCiAgICAgICAgU1VQQUJBU0VfVVJMLAogICAgICAgIFNVUEFCQVNFX0FOT05fS0VZCiAgICAgICk7").decode(),base64.b64decode("").decode(),1); s=s.replace(base64.b64decode("ZnVuY3Rpb24gaW1hZ2VGcm9tUmVjb3JkKHJlY29yZCkgewogICAgICByZXR1cm4gY2xlYW4oCiAgICAgICAgcmVjb3JkLmltYWdlIHx8CiAgICAgICAgcmVjb3JkLmltYWdlX3VybCB8fAogICAgICAgIHJlY29yZC5waG90byB8fAogICAgICAgIHJlY29yZC5waG90b191cmwgfHwKICAgICAgICByZWNvcmQuY292ZXJfaW1hZ2UKICAgICAgKTsKICAgIH0=").decode(),base64.b64decode("").decode(),1); p.write_text(s,encoding="utf-8")'
      - name: Add metadata
        run: |
          python3 -c 'from pathlib import Path; p=Path("global-search.html"); s=p.read_text(encoding="utf-8"); a="<meta property=\"og:type\" content=\"website\">"; b=a+"\n  <meta property=\"og:image\" content=\"https://studenthubhelp.github.io/studenthubhelp/logo.png\">\n  <meta property=\"og:image:alt\" content=\"StudentHubHelp\">"; s=s.replace(a,b,1) if a in s and "og:image" not in s else s; a2="<meta name=\"twitter:card\" content=\"summary\">"; b2="<meta name=\"twitter:card\" content=\"summary_large_image\">\n  <meta name=\"twitter:image\" content=\"https://studenthubhelp.github.io/studenthubhelp/logo.png\">"; s=s.replace(a2,b2,1) if a2 in s and "twitter:image" not in s else s; p.write_text(s,encoding="utf-8")'
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-global-search-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-search.html .github/workflows/apply-global-search-fix.yml
          git diff --cached --quiet || git commit -m "fix: repair global search auth branding and property images"
          git push
