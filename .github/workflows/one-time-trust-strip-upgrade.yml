name: One-time trust strip UI upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[trust-strip-upgraded]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade trust strip presentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('audience-hub.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* TRUST STRIP — premium animated cards */'

          if marker not in css:
              css += r'''

/* TRUST STRIP — premium animated cards */
#live-listings .trust-strip{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  width:min(1120px,100%);
  margin:26px auto 34px;
}
#live-listings .trust-strip-item{
  position:relative;
  isolation:isolate;
  display:flex;
  align-items:center;
  gap:13px;
  min-height:92px;
  padding:17px 16px;
  overflow:hidden;
  border:1px solid rgba(27,42,74,.11);
  border-radius:20px;
  background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(248,246,241,.96));
  box-shadow:0 14px 34px rgba(27,42,74,.08),inset 0 1px 0 rgba(255,255,255,.9);
  color:#172238;
  transform:translateY(0);
  animation:shhTrustIn .65s cubic-bezier(.16,1,.3,1) both;
  transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease;
}
#live-listings .trust-strip-item:nth-child(1){animation-delay:.05s}
#live-listings .trust-strip-item:nth-child(2){animation-delay:.12s}
#live-listings .trust-strip-item:nth-child(3){animation-delay:.19s}
#live-listings .trust-strip-item:nth-child(4){animation-delay:.26s}
#live-listings .trust-strip-item::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(110deg,transparent 15%,rgba(212,175,55,.16) 46%,transparent 72%);
  transform:translateX(-125%);
  animation:shhTrustSweep 4.8s ease-in-out infinite;
  pointer-events:none;
}
#live-listings .trust-strip-item:hover{
  transform:translateY(-6px);
  border-color:rgba(212,175,55,.52);
  box-shadow:0 22px 46px rgba(27,42,74,.13),0 0 0 1px rgba(212,175,55,.08);
}
#live-listings .trust-icon{
  flex:0 0 42px;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(145deg,#142b4d,#1d3d67);
  border:1px solid rgba(212,175,55,.5);
  color:#f3d47a;
  font-size:20px;
  line-height:1;
  box-shadow:0 8px 20px rgba(27,42,74,.18),inset 0 1px 0 rgba(255,255,255,.14);
  animation:shhTrustIcon 2.8s ease-in-out infinite;
}
#live-listings .trust-strip-item:nth-child(2) .trust-icon{animation-delay:.35s}
#live-listings .trust-strip-item:nth-child(3) .trust-icon{animation-delay:.7s}
#live-listings .trust-strip-item:nth-child(4) .trust-icon{animation-delay:1.05s}
#live-listings .trust-strip-item > div{min-width:0;display:flex;flex-direction:column;gap:3px}
#live-listings .trust-strip-item strong{
  display:block;
  color:#172238;
  font-size:13px;
  line-height:1.25;
  font-weight:900;
  letter-spacing:-.15px;
}
#live-listings .trust-strip-item small{
  display:block;
  color:#667085;
  font-size:11px;
  line-height:1.35;
  font-weight:600;
}
@keyframes shhTrustIn{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes shhTrustSweep{
  0%,35%{transform:translateX(-125%)}
  65%,100%{transform:translateX(125%)}
}
@keyframes shhTrustIcon{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}
@media(max-width:900px){
  #live-listings .trust-strip{grid-template-columns:repeat(2,minmax(0,1fr));margin:22px auto 28px}
}
@media(max-width:600px){
  #live-listings .trust-strip{grid-template-columns:1fr;gap:10px;margin:18px auto 24px}
  #live-listings .trust-strip-item{min-height:78px;padding:13px 14px;border-radius:17px}
  #live-listings .trust-icon{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:18px}
  #live-listings .trust-strip-item strong{font-size:12px}
  #live-listings .trust-strip-item small{font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){
  #live-listings .trust-strip-item,#live-listings .trust-strip-item::before,#live-listings .trust-icon{animation:none!important}
  #live-listings .trust-strip-item{transition:none}
}
'''
              path.write_text(css, encoding='utf-8')

          # Remove this one-time workflow after applying the change.
          workflow = Path('.github/workflows/one-time-trust-strip-upgrade.yml')
          workflow.unlink(missing_ok=True)

      - name: Commit upgrade and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audience-hub.css .github/workflows/one-time-trust-strip-upgrade.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: upgrade homepage trust strip [trust-strip-upgraded]"
          git push
