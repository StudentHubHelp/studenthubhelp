name: Phase 3 public performance pass

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply conservative public performance hints
        shell: bash
        run: |
          set -euo pipefail
          for f in ./*.html; do
            [ -f "$f" ] || continue
            sed -i 's/scroll-behavior:[[:space:]]*smooth/scroll-behavior: auto/g' "$f"
            if ! grep -q 'performance.js' "$f"; then
              sed -i 's#</head>#  <script src="performance.js" defer></script>\n</head>#' "$f"
            fi
            if grep -q 'idurlccrarznnnqixxsd.supabase.co' "$f" && ! grep -q 'preconnect.*idurlccrarznnnqixxsd.supabase.co' "$f"; then
              sed -i 's#</head>#  <link rel="preconnect" href="https://idurlccrarznnnqixxsd.supabase.co" crossorigin>\n</head>#' "$f"
            fi
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No public HTML changes required.'
          else
            git commit -m 'Optimize public pages for Phase 3 performance'
            git push
          fi

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase3-public-performance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time Phase 3 performance workflow'
          git push
