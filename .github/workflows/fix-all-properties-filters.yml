name: Fix All Property Listings Filters

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-all-properties-filters.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch PropertiesView filters only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin/src/components/PropertiesView.tsx')
          s = p.read_text(encoding='utf-8')

          pattern = r"(?m)^(\s*)const matchesArea = !areaFilter.*?^\1return matchesCat && matchesArea && matchesStatus && matchesVerified && matchesFeatured && matchesOwner;"
          replacement = r'''\1const areaQuery = areaFilter.trim().toLowerCase();
          const ownerQuery = ownerFilter.trim().toLowerCase();
          const ownerPhoneQuery = ownerFilter.replace(/\\D/g, '');
          const matchesArea = !areaQuery || [p.city, p.area, p.address, p.pincode]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(areaQuery));
          const matchesStatus = !statusFilter || propStatus(p) === statusFilter.toLowerCase();
          const matchesVerified = !verifiedFilter || (verifiedFilter === 'true' && propVerified(p)) || (verifiedFilter === 'false' && !propVerified(p));
          const matchesFeatured = !featuredFilter || (featuredFilter === 'true' && propFeatured(p)) || (featuredFilter === 'false' && !propFeatured(p));
          const matchesOwner = !ownerQuery ||
            (p.owner_name || '').toLowerCase().includes(ownerQuery) ||
            (p.name || '').toLowerCase().includes(ownerQuery) ||
            (p.email || '').toLowerCase().includes(ownerQuery) ||
            (String(p.id || '').toLowerCase().includes(ownerQuery)) ||
            (ownerPhoneQuery && String(p.phone || '').replace(/\\D/g, '').includes(ownerPhoneQuery));
          \1return matchesCat && matchesArea && matchesStatus && matchesVerified && matchesFeatured && matchesOwner;'''

          s2, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Filter block not found; no changes made.')
          s = s2

          if 'placeholder="Locality / Area"' in s:
              s = s.replace('placeholder="Locality / Area"', 'placeholder="City / Locality / Area"', 1)

          p.write_text(s, encoding='utf-8')

      - name: Build admin to verify patch
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/src/components/PropertiesView.tsx
          git commit -m "Fix All Property Listings filters"
          git push
          git rm .github/workflows/fix-all-properties-filters.yml
          git commit -m "Remove temporary filter fix workflow"
          git push
