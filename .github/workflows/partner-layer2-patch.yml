name: Wire Partner Layer 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch partner routing and admin navigation
        shell: python
        run: |
          from pathlib import Path
          import re
          # Public partner CTA -> application form; leave normal Sign In links untouched.
          p=Path('partner.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'(<a[^>]+href=")auth\.html("[^>]*>)([^<]*Apply[^<]*)(</a>)', r'\1partner-apply.html\2\3\4', s, flags=re.I)
          s=re.sub(r'(<a[^>]+href=")auth\.html("[^>]*>)([^<]*Become[^<]*Partner[^<]*)(</a>)', r'\1partner-apply.html\2\3\4', s, flags=re.I)
          p.write_text(s,encoding='utf-8')

          # Existing auth remains the single login entry point; only add the partner role to routing.
          p=Path('auth.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('const D={student:"student-dashboard.html",owner:"owner-dashboard.html"};','const D={student:"student-dashboard.html",owner:"owner-dashboard.html",partner:"partner-dashboard.html"};')
          s=s.replace('const PUBLIC_ROLES=["student","owner"];','const PUBLIC_ROLES=["student","owner","partner"];')
          s=s.replace('function denyAccess(text="Is account ko Student/Owner login system se access nahi kiya ja sakta."){','function denyAccess(text="Is account ko public login system se access nahi kiya ja sakta."){')
          s=s.replace('await denyAccess("Student/Owner profile nahi mila. Account access continue nahi kiya gaya.");','await denyAccess("Student/Owner/Partner profile nahi mila. Account access continue nahi kiya gaya.");')
          s=s.replace('loading(true,r==="owner"?"Opening Owner Dashboard...":"Opening Student Dashboard...");','loading(true,r==="owner"?"Opening Owner Dashboard...":r==="partner"?"Opening Partner Dashboard...":"Opening Student Dashboard...");')
          p.write_text(s,encoding='utf-8')

          # Types
          p=Path('admin/src/types.ts'); s=p.read_text(encoding='utf-8')
          s=s.replace("  | 'admin';","  | 'admin'\n  | 'partners';")
          p.write_text(s,encoding='utf-8')

          # Sidebar
          p=Path('admin/src/components/Sidebar.tsx'); s=p.read_text(encoding='utf-8')
          old="{item('user-management','User Management',Users)}{item('students','Students',GraduationCap)}{item('owners','Owners',Briefcase)}"
          new="{item('user-management','User Management',Users)}{item('students','Students',GraduationCap)}{item('owners','Owners',Briefcase)}{item('partners','Partner Network',Handshake)}"
          if old not in s: raise SystemExit('Sidebar anchor not found')
          s=s.replace(old,new,1); p.write_text(s,encoding='utf-8')

          # App: lazy import, tab render, and dashboard load without disturbing existing sections.
          p=Path('admin/src/App.tsx'); s=p.read_text(encoding='utf-8')
          anchor="const UnverifiedPropertiesView = lazy(() => import('./components/UnverifiedPropertiesView').then((m) => ({ default: m.UnverifiedPropertiesView })));"
          ins=anchor+"\nconst PartnerManagementView = lazy(() => import('./components/PartnerManagementView').then((m) => ({ default: m.PartnerManagementView })));"
          if "./components/PartnerManagementView" not in s:
            if anchor not in s: raise SystemExit('App import anchor not found')
            s=s.replace(anchor,ins,1)
          render_anchor="          {/* OVERVIEW */}"
          partner_render="          {currentTab === 'partners' && (\n            <PartnerManagementView />\n          )}\n\n"
          if "currentTab === 'partners'" not in s:
            if render_anchor not in s: raise SystemExit('App render anchor not found')
            s=s.replace(render_anchor,partner_render+render_anchor,1)
          p.write_text(s,encoding='utf-8')

          # Ensure partner application is discoverable from the existing public partner page.
          p=Path('partner.html'); s=p.read_text(encoding='utf-8')
          if 'partner-apply.html' not in s:
            # Fallback: change only the first CTA-like auth link if text regex above did not match.
            s=re.sub(r'(<a[^>]+href=")auth\.html("[^>]*>)(.*?(?:Apply|Become a Partner).*?)</a>', r'\1partner-apply.html\2\3</a>', s, count=1, flags=re.I|re.S)
          p.write_text(s,encoding='utf-8')

          if not (Path('partner-apply.html').exists() and Path('partner-dashboard.html').exists()):
            raise SystemExit('Partner Layer 2 files missing')

          if s==Path('partner.html').read_text(encoding='utf-8'):
            pass
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.html partner.html admin/src/types.ts admin/src/components/Sidebar.tsx admin/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire partner auth and admin management"
          git push
