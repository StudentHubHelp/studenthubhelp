name: Homepage protection

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/css/homepage.css'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/css/homepage.css'

permissions:
  contents: read

jobs:
  homepage-change-approval:
    name: Homepage protection
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit homepage approval marker
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            APPROVAL_TEXT="$PR_TITLE"
          else
            APPROVAL_TEXT="$COMMIT_MESSAGE"
          fi

          if ! printf '%s' "$APPROVAL_TEXT" | grep -Fq '[homepage-approved]'; then
            echo "::error::Homepage files are protected. Add [homepage-approved] only after the homepage change has been explicitly approved."
            exit 1
          fi

          echo "Explicit homepage approval marker found."
