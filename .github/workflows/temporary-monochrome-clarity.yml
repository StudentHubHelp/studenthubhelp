name: Temporary Admin Monochrome Clarity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply targeted clarity CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/premium.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* ===== ADMIN DASHBOARD — FINAL BLACK WHITE TEXT CLARITY ===== */'
          if marker not in s:
              s += '''\n\n/* ===== ADMIN DASHBOARD — FINAL BLACK WHITE TEXT CLARITY ===== */\n/* Theme-only: force maximum readable contrast without changing layout or functionality. */\nbody.premium-grid .master-drawer-panel,\nbody.premium-grid .master-drawer-panel * {\n  text-shadow:none!important;\n}\nbody.premium-grid .master-drawer-panel {\n  background:#fff!important;\n  color:#111!important;\n}\nbody.premium-grid .master-drawer-panel .master-mini-card,\nbody.premium-grid .master-drawer-panel [class*="bg-navy-"],\nbody.premium-grid .master-drawer-panel [class*="bg-slate-900"],\nbody.premium-grid .master-drawer-panel [class*="bg-gray-900"] {\n  background:#111!important;\n  color:#fff!important;\n  border-color:#111!important;\n}\nbody.premium-grid .master-drawer-panel .master-mini-card *,\nbody.premium-grid .master-drawer-panel [class*="bg-navy-"] *,\nbody.premium-grid .master-drawer-panel [class*="bg-slate-900"] *,\nbody.premium-grid .master-drawer-panel [class*="bg-gray-900"] * {\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n}\nbody.premium-grid .master-drawer-panel .text-white,\nbody.premium-grid .master-drawer-panel .text-slate-100,\nbody.premium-grid .master-drawer-panel .text-slate-200,\nbody.premium-grid .master-drawer-panel .text-slate-300,\nbody.premium-grid .master-drawer-panel .text-slate-400,\nbody.premium-grid .master-drawer-panel .text-slate-500 {\n  color:#111!important;\n  -webkit-text-fill-color:#111!important;\n}\nbody.premium-grid .master-drawer-panel .master-mini-card .text-white,\nbody.premium-grid .master-drawer-panel .master-mini-card .text-slate-100,\nbody.premium-grid .master-drawer-panel .master-mini-card .text-slate-200,\nbody.premium-grid .master-drawer-panel .master-mini-card .text-slate-300,\nbody.premium-grid .master-drawer-panel .master-mini-card .text-slate-400,\nbody.premium-grid .master-drawer-panel .master-mini-card .text-slate-500 {\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n}\nbody.premium-grid #ownerDetailsProperties button {\n  background:#111!important;\n  color:#fff!important;\n  border-color:#111!important;\n}\nbody.premium-grid #ownerDetailsProperties button * {\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n}\nbody.premium-grid #ownerDetailsProperties button .text-gold-400,\nbody.premium-grid #ownerDetailsProperties button .text-gold-300 {\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n}\nbody.premium-grid #ownerDetailsProperties button .text-slate-400,\nbody.premium-grid #ownerDetailsProperties button .text-slate-300,\nbody.premium-grid #ownerDetailsProperties button .text-slate-500 {\n  color:#fff!important;\n  -webkit-text-fill-color:#fff!important;\n}\nbody.premium-grid #ownerEditModal input,\nbody.premium-grid #ownerEditModal select,\nbody.premium-grid #ownerEditModal textarea,\nbody.premium-grid #advancedPropertyModal input,\nbody.premium-grid #advancedPropertyModal select,\nbody.premium-grid #advancedPropertyModal textarea {\n  background:#fff!important;\n  color:#111!important;\n  -webkit-text-fill-color:#111!important;\n  border-color:#bdbdbd!important;\n}\nbody.premium-grid #ownerEditModal input::placeholder,\nbody.premium-grid #advancedPropertyModal input::placeholder {\n  color:#666!important;\n  -webkit-text-fill-color:#666!important;\n}\nbody.premium-grid .modal>.card *,\nbody.premium-grid #ownerEditModal>div *,\nbody.premium-grid #ownerDetailsModal>div *,\nbody.premium-grid #advancedPropertyModal>.card * {\n  text-shadow:none!important;\n}\n'''
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/premium.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: improve admin dashboard black white text clarity"
          git push
          rm .github/workflows/temporary-monochrome-clarity.yml
          git add .github/workflows/temporary-monochrome-clarity.yml
          git commit -m "chore: remove temporary theme workflow"
          git push
