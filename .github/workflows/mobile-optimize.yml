name: Apply mobile performance layer

on:
  push:
    branches: [main]
    paths:
      - 'mobile.css'
      - '.github/workflows/mobile-optimize.yml'
      - 'property-details.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-optimize:
    if: "!contains(github.event.head_commit.message, '[mobile-optimized]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject shared mobile CSS, image hints and Finder smart search
        shell: python
        run: |
          from pathlib import Path
          import re

          skip = {'google7168366cd2bfb7eb.html'}
          finder_pages = {'pg-finder.html','tiffin-finder.html','library-finder.html','cafe-finder.html','bookstore-finder.html'}
          for path in Path('.').glob('*.html'):
              if path.name in skip:
                  continue
              text = path.read_text(encoding='utf-8')

              if 'href="mobile.css"' not in text and '</head>' in text.lower():
                  text = re.sub(r'</head>', '  <link rel="stylesheet" href="mobile.css">\n</head>', text, count=1, flags=re.I)

              if path.name in finder_pages and 'js/finder-power-search.js' not in text and '</body>' in text.lower():
                  text = re.sub(r'</body>', '  <script src="js/finder-power-search.js" defer></script>\n</body>', text, count=1, flags=re.I)

              imgs = []
              first = True
              for m in re.finditer(r'<img\b[^>]*>', text, flags=re.I):
                  tag = m.group(0)
                  if first:
                      first = False
                      imgs.append((m.start(), m.end(), tag))
                      continue
                  if ' loading=' not in tag.lower():
                      tag = tag[:-1] + ' loading="lazy"'
                  if ' decoding=' not in tag.lower():
                      tag = tag[:-1] + ' decoding="async"'
                  imgs.append((m.start(), m.end(), tag))

              for start,end,tag in reversed(imgs):
                  text = text[:start] + tag + text[end:]

              if path.name == 'property-details.html':
                  patterns = [
                      r'<div[^>]*(?:id|class)=["\'][^"\']*(?:verification[-_ ]?(?:modal|popup|dialog)|verify[-_ ]?(?:modal|popup|dialog))[^"]*["\'][^>]*>.*?</div>',
                      r'<div[^>]*(?:id|class)=["\'][^"\']*(?:verification|verify)[^"\']*(?:modal|popup|dialog)[^"\']*["\'][^>]*>.*?</div>'
                  ]
                  for pattern in patterns:
                      text = re.sub(pattern, '', text, flags=re.I|re.S)

                  guard = r'''\n<script>\n(function(){\n  const isBlockingVerification = (el) => {\n    if (!el || el.nodeType !== 1) return false;\n    const key = ((el.id || '') + ' ' + (el.className && typeof el.className === 'string' ? el.className : '')).toLowerCase();\n    if ((/verification|verify/.test(key)) && /(modal|popup|dialog|overlay)/.test(key)) return true;\n    if (el.getAttribute('role') === 'dialog' && /verification|verify/.test((el.textContent || '').slice(0, 1000).toLowerCase())) return true;\n    return false;\n  };\n  const remove = () => document.querySelectorAll('*').forEach(el => { if (isBlockingVerification(el)) el.remove(); });\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', remove, {once:true}); else remove();\n  new MutationObserver(remove).observe(document.documentElement, {childList:true, subtree:true});\n})();\n</script>\n'''
                  if 'isBlockingVerification' not in text:
                      text = text.replace('</body>', guard + '</body>')

              path.write_text(text, encoding='utf-8')

      - name: Commit mobile optimization changes
        run: |
          git config user.name 'StudentHubHelp Mobile Optimizer'
          git config user.email 'actions@github.com'
          git add '*.html' mobile.css js/finder-power-search.js
          git diff --cached --quiet || git commit -m 'perf: optimize mobile responsiveness and Finder search [mobile-optimized]'
          git push
