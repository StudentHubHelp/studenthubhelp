name: Chatbot Live Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatbot-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test Sikar budget
        env:
          API: https://idurlccrarznnnqixxsd.supabase.co/functions/v1/studenthubhelp-chat
          KEY: sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFh5
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$API" -X POST -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --data '{"message":"sikar me rhne ka hr mhine ka kharcha lgbg kitna hoga","sessionId":"smoke-sikar-budget"}' -o /tmp/a.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/a.json'))
          assert x.get('grounded') is True, x
          assert isinstance(x.get('budgetPlan'), dict), x
          assert isinstance(x.get('recommendations'), list), x
          assert isinstance(x.get('liveActivePropertyCount'), (int,float)), x
          print('Sikar budget PASS', x.get('searchMode'), x.get('budgetPlan',{}).get('dataQuality'))
          PY
      - name: Test Sikar hostel search
        env:
          API: https://idurlccrarznnnqixxsd.supabase.co/functions/v1/studenthubhelp-chat
          KEY: sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFh5
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$API" -X POST -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --data '{"message":"Sikar me active boys hostel dikhao","sessionId":"smoke-sikar-hostel"}' -o /tmp/b.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/b.json'))
          assert x.get('grounded') is True, x
          assert isinstance(x.get('recommendations'), list), x
          assert all(p.get('type')=='hostel' for p in x['recommendations']), x
          print('Sikar hostel PASS', len(x['recommendations']))
          PY
      - name: Test Jaipur budget fallback
        env:
          API: https://idurlccrarznnnqixxsd.supabase.co/functions/v1/studenthubhelp-chat
          KEY: sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFh5
        run: |
          set -euo pipefail
          curl -sS --fail-with-body "$API" -X POST -H "Content-Type: application/json" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --data '{"message":"jaipur me ik mhine ka kharcha kitna hoga","sessionId":"smoke-jaipur-budget"}' -o /tmp/c.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/c.json'))
          assert x.get('grounded') is True, x
          bp=x.get('budgetPlan') or {}
          assert bp.get('city')=='Jaipur', x
          assert bp.get('dataQuality',{}).get('estimatedCategories'), x
          print('Jaipur fallback PASS', bp.get('totalEstimated'), bp.get('dataQuality'))
          PY