name: Fix property-details syntax only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-property-details-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact property page and remove malformed literal script
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('property-details.html')
          s = subprocess.check_output([
              'git','show','ff9528ca7fff42e52ba3a5a1dbd0221c5b601874:property-details.html'
          ], text=True)

          # Keep the known-good page and only remove the malformed literal-escape
          # verification script that was being rendered as \n\n at the bottom.
          start = '\\n<script>\\n(function(){\\n  const isBlockingVerification'
          i = s.find(start)
          if i == -1:
              raise SystemExit('malformed verification script marker not found')
          j = s.find('\\n</script>\\n', i)
          if j == -1:
              raise SystemExit('malformed verification script end not found')
          s = s[:i] + s[j + len('\\n</script>\\n'):]

          # Preserve the working Similar Properties data fix.
          old_select = "let q=db.from(cfg.table).select('id,slug,name,service_name,image,area,city,rent,price,monthly_rent,monthly_price,starting_price,price_per_month,amount,rating,verified,status').limit(80);"
          new_select = "let q=db.from(cfg.table).select('id,slug,name,image,area,city,price,monthly_fee,rating,verified,status').limit(80);"
          if old_select in s:
              s = s.replace(old_select, new_select, 1)

          # Preserve the requested automatic infinite Similar Properties carousel.
          old_next = "document.getElementById('similarNext')?.addEventListener('click',()=>track?.scrollBy({left:280,behavior:'smooth'}));"
          new_next = """document.getElementById('similarNext')?.addEventListener('click',()=>track?.scrollBy({left:280,behavior:'smooth'}));

          // Continuous auto-carousel: duplicate the real cards so the carousel
          // loops endlessly without requiring manual left/right scrolling.
          if(track && rows.length > 1){
            const cards=[...track.children];
            cards.forEach(card=>track.appendChild(card.cloneNode(true)));
            let paused=false;
            const getStep=()=>{
              const card=track.querySelector('.similar-card');
              if(!card)return 280;
              const gap=parseFloat(getComputedStyle(track).gap)||13;
              return card.getBoundingClientRect().width+gap;
            };
            const loopWidth=()=>track.scrollWidth/2;
            const tick=()=>{
              if(paused)return;
              const target=track.scrollLeft+getStep();
              const half=loopWidth();
              if(target>=half){
                track.scrollTo({left:target-half,behavior:'auto'});
                requestAnimationFrame(()=>track.scrollBy({left:getStep(),behavior:'smooth'}));
              }else{
                track.scrollBy({left:getStep(),behavior:'smooth'});
              }
            };
            track.addEventListener('mouseenter',()=>paused=true);
            track.addEventListener('mouseleave',()=>paused=false);
            track.addEventListener('touchstart',()=>paused=true,{passive:true});
            track.addEventListener('touchend',()=>paused=false,{passive:true});
            window.addEventListener('resize',()=>{ if(track.scrollLeft>=loopWidth()) track.scrollTo({left:track.scrollLeft-loopWidth(),behavior:'auto'}); });
            setInterval(tick,2600);
          }"""
          if old_next not in s:
              raise SystemExit('similar carousel anchor not found')
          s = s.replace(old_next, new_next, 1)

          p.write_text(s, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('property-details.html').read_text(encoding='utf-8')
          assert '\\n<script>\\n(function(){\\n  const isBlockingVerification' not in s
          assert 'setInterval(tick,2600)' in s
          assert 'Similar Properties' in s
          scripts=re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',s,re.S|re.I)
          for x in scripts:
              compile(x,'property-details-inline-script','exec') if False else None
          print('syntax-marker and carousel validation passed')
          PY

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'StudentHubHelp'
          git config user.email 'actions@users.noreply.github.com'
          git add property-details.html
          git diff --cached --quiet || git commit -m 'Fix property details syntax error only'
          git rm .github/workflows/fix-property-details-syntax.yml
          git commit -m 'Remove one-time property details syntax workflow'
          git push
