name: Fix suspended tab type
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-suspended-type.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[suspended-type-fixed]')"
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('admin/src/components/PropertiesView.tsx')
          s=p.read_text()
          old="categoryFilter?: PropertyType | 'all';"
          new="categoryFilter?: PropertyType | 'all' | 'suspended-properties';"
          if old not in s and new not in s: raise SystemExit('categoryFilter type not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/fix-suspended-type.yml').unlink()
      - shell: bash
        run: |
          grep -q "categoryFilter?: PropertyType | 'all' | 'suspended-properties';" admin/src/components/PropertiesView.tsx
          git config user.name 'StudentHubHelp Status Guard'
          git config user.email 'actions@github.com'
          git add admin/src/components/PropertiesView.tsx
          git add -u .github/workflows/fix-suspended-type.yml
          git commit -m 'fix: type suspended properties tab [suspended-type-fixed]'
          git push
