name: SEO indexing upgrade

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'property-details.html'
      - 'pg-finder.html'
      - 'tiffin-finder.html'
      - 'library-finder.html'
      - 'cafe-finder.html'
      - 'bookstore-finder.html'
      - 'scripts/seo-aeo-build.mjs'
      - 'js/property-seo-upgrade.js'
      - 'js/seo-location-entities.js'
      - '.github/workflows/seo-indexing-upgrade.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize all workflows that write generated files or commits to main.
concurrency:
  group: studenthubhelp-main-write-queue
  cancel-in-progress: false

jobs:
  seo-upgrade:
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[seo-optimized]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Attach SEO and GEO layers without changing page UI
        shell: python
        run: |
          from pathlib import Path
          import json

          finder_pages = ['pg-finder.html','tiffin-finder.html','library-finder.html','cafe-finder.html','bookstore-finder.html']

          def add_before(text, marker, tag):
              if tag in text: return text
              if marker not in text: raise SystemExit(f'Marker not found: {marker}')
              return text.replace(marker, tag + marker, 1)

          p=Path('property-details.html')
          p.write_text(add_before(p.read_text(encoding='utf-8'),'</head>','  <script src="js/property-seo-upgrade.js" defer></script>\n'),encoding='utf-8')

          for name in finder_pages:
              p=Path(name)
              p.write_text(add_before(p.read_text(encoding='utf-8'),'</head>','  <script src="js/seo-location-entities.js" defer></script>\n'),encoding='utf-8')

          site_graph={
            '@context':'https://schema.org',
            '@graph':[
              {
                '@type':'WebSite',
                '@id':'https://studenthubhelp.in/#website',
                'name':'StudentHubHelp',
                'url':'https://studenthubhelp.in/',
                'inLanguage':'en-IN',
                'description':'India-wide student discovery platform for hostels, PGs, tiffin and mess services, libraries, cafes and book stores.',
                'publisher':{'@id':'https://studenthubhelp.in/#organization'},
                'potentialAction':{
                  '@type':'SearchAction',
                  'target':{'@type':'EntryPoint','urlTemplate':'https://studenthubhelp.in/global-search.html?q={search_term_string}'},
                  'query-input':'required name=search_term_string'
                }
              },
              {
                '@type':'Organization',
                '@id':'https://studenthubhelp.in/#organization',
                'name':'StudentHubHelp',
                'url':'https://studenthubhelp.in/',
                'logo':'https://studenthubhelp.in/logo.png',
                'areaServed':{'@type':'Country','name':'India'},
                'knowsAbout':['student accommodation','hostels','PGs','tiffin and mess services','libraries','cafes','book stores','student resources'],
                'contactPoint':{
                  '@type':'ContactPoint',
                   'contactType':'customer support',
                  'email':'support@studenthubhelp.in',
                  'areaServed':'IN',
                  'availableLanguage':['en','hi']
                },
                'sameAs':['https://www.instagram.com/studenthubhelp/']
              },
              {
                '@type':'WebPage',
                '@id':'https://studenthubhelp.in/#homepage',
                'url':'https://studenthubhelp.in/',
                'name':'StudentHubHelp | Hostel, PG, Tiffin, Library, Cafe & Book Store Finder India',
                'isPartOf':{'@id':'https://studenthubhelp.in/#website'},
                'about':{'@id':'https://studenthubhelp.in/#organization'},
                'inLanguage':'en-IN'
              },
              {
                '@type':'Service',
                '@id':'https://studenthubhelp.in/#student-finder-service',
                'name':'StudentHubHelp Student Finder',
                'serviceType':'Student accommodation and local student services discovery',
                'provider':{'@id':'https://studenthubhelp.in/#organization'},
                'areaServed':{'@type':'Country','name':'India'},
                'audience':{'@type':'Audience','audienceType':'Students and parents'},
                'hasOfferCatalog':{
                  '@type':'OfferCatalog',
                  'name':'Student services',
                  'itemListElement':[
                    {'@type':'Offer','itemOffered':{'@type':'Service','name':'Hostel and PG Finder'}},
                    {'@type':'Offer','itemOffered':{'@type':'Service','name':'Tiffin and Mess Finder'}},
                    {'@type':'Offer','itemOffered':{'@type':'Service','name':'Library Finder'}},
                    {'@type':'Offer','itemOffered':{'@type':'Service','name':'Cafe Finder'}},
                    {'@type':'Offer','itemOffered':{'@type':'Service','name':'Bookstore Finder'}}
                  ]
                }
              }
            ]
          }
          graph_tag='<script id="studenthubhelp-site-graph" type="application/ld+json">'+json.dumps(site_graph,ensure_ascii=False,separators=(',',':'))+'</script>\n'
          p=Path('index.html')
          home=p.read_text(encoding='utf-8')
          if 'id="studenthubhelp-site-graph"' not in home:
              home=add_before(home,'</head>',graph_tag)
          p.write_text(home,encoding='utf-8')

      - name: Generate advanced SEO and AEO schema layer
        run: node scripts/seo-aeo-build.mjs

      - name: Validate SEO and GEO implementation
        shell: python
        run: |
          from pathlib import Path
          import json,re

          def html_document_is_well_formed(text, name):
              assert re.search(r'^<!doctype html>', text, re.I | re.M), name
              assert len(re.findall(r'^<html(?:\s|>)', text, re.I | re.M)) == 1, name
              assert text.lower().count('</html>') == 1 and text.rstrip().lower().endswith('</html>'), name

          index=Path('index.html').read_text(encoding='utf-8')
          assert 'studenthubhelp-site-graph' in index
          assert 'studenthubhelp-aeo-schema' in index
          assert 'StudentHubHelp Student Finder' in index
          assert 'https://www.instagram.com/studenthubhelp/' in index
          html_document_is_well_formed(index, 'index.html')

          prop=Path('property-details.html').read_text(encoding='utf-8')
          property_seo=Path('js/property-seo-upgrade.js').read_text(encoding='utf-8')
          assert 'js/property-seo-upgrade.js' in prop and 'propertySchema' in property_seo
          html_document_is_well_formed(prop, 'property-details.html')

          for name in ['pg-finder.html','tiffin-finder.html','library-finder.html','cafe-finder.html','bookstore-finder.html']:
              text=Path(name).read_text(encoding='utf-8')
              assert 'js/seo-location-entities.js' in text and 'js/finder-power-search.js' in text, name
              assert 'studenthubhelp-aeo-schema' in text, name
              html_document_is_well_formed(text, name)

          # The Student Cities Hub and its 12 city pages must retain static, crawlable collection and FAQ data.
          hub=Path('student-cities.html').read_text(encoding='utf-8')
          hub_match=re.search(r'<script id="studenthubhelp-aeo-schema" type="application/ld\+json">([\s\S]*?)</script>', hub)
          assert hub_match, 'Missing Student Cities Hub JSON-LD'
          hub_graph=json.loads(hub_match.group(1)).get('@graph', [])
          hub_types={node.get('@type') for node in hub_graph}
          assert {'Organization','WebSite','CollectionPage','BreadcrumbList','ItemList','FAQPage'} <= hub_types
          hub_list=next(node for node in hub_graph if node.get('@type')=='ItemList')
          hub_faq=next(node for node in hub_graph if node.get('@type')=='FAQPage')
          assert hub_list.get('numberOfItems')==12 and len(hub_list.get('itemListElement', []))==12
          assert len(hub_faq.get('mainEntity', []))==5
          assert len(re.findall(r'<article class="city-card" data-city=', hub))==12
          for city in ['sikar','bengaluru','chennai','kota','delhi','patna','jhunjhunu','pune','gurugram','coimbatore','jaipur','lucknow']:
              assert f'href="/{city}.html"' in hub, f'Missing {city} card in Student Cities Hub'
              city_html=Path(city+'.html').read_text(encoding='utf-8')
              city_match=re.search(r'<script id="studenthubhelp-aeo-schema" type="application/ld\+json">([\s\S]*?)</script>', city_html)
              assert city_match, f'Missing city JSON-LD: {city}'
              city_graph=json.loads(city_match.group(1)).get('@graph', [])
              city_types={node.get('@type') for node in city_graph}
              assert {'CollectionPage','BreadcrumbList','FAQPage'} <= city_types, f'Missing city collection / breadcrumb / FAQ schema: {city}'
              if re.search(r'<article\b[^>]*class=["\'][^"\']*listing-card', city_html):
                  assert 'ItemList' in city_types, f'Missing static listing ItemList: {city}'
              assert f'href="/student-cities.html"' in city_html, f'Missing All Cities link: {city}'
              html_document_is_well_formed(city_html, city+'.html')
          html_document_is_well_formed(hub, 'student-cities.html')

          robots=Path('robots.txt').read_text(encoding='utf-8')
          for private_path in ['/admin/','/auth.html','/owner-dashboard.html','/student-dashboard.html','/partner-dashboard.html','/add-listing.html']:
              assert f'Disallow: {private_path}' not in robots.splitlines(), f'{private_path} must remain crawlable so Google can read its noindex directive'
          for private_page in ['auth.html','owner-dashboard.html','student-dashboard.html','partner-dashboard.html','add-listing.html','admin/index.html']:
              private_html=Path(private_page).read_text(encoding='utf-8')
              robots_tag=re.search(r"""<meta\s+name=["']robots["']\s+content=["']([^"']+)["']""", private_html, re.I)
              assert robots_tag and 'noindex' in robots_tag.group(1).lower(), f'Missing noindex directive: {private_page}'
          assert 'Disallow: /supabase/' in robots and 'Disallow: /.github/' in robots and 'Disallow: /admin/src/' in robots
          assert 'Sitemap: https://studenthubhelp.in/sitemap.xml' in robots
          print('Advanced SEO/AEO validation passed. Private pages expose noindex to crawlers; internal source paths remain blocked.')

      - name: Commit SEO/GEO/AEO upgrade
        run: |
          git config user.name 'StudentHubHelp SEO Optimizer'
          git config user.email 'actions@github.com'
          git add '*.html' scripts/seo-aeo-build.mjs js/property-seo-upgrade.js js/seo-location-entities.js robots.txt .github/workflows/seo-indexing-upgrade.yml
          git diff --cached --quiet || git commit -m 'feat: complete SEO GEO AEO upgrade [seo-optimized]'
          git pull --rebase -X ours origin main
          git push origin HEAD:main

# SEO/GEO/AEO automation is intentionally UI-neutral: no layout, theme, search controls or DB schema changes.
