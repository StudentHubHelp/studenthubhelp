name: Apply status visibility upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-visibility-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[status-visibility-upgraded]')"
    steps:
      - uses: actions/checkout@v4

      - name: Patch status visibility and suspended admin section
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Admin type: add a dedicated Suspended Properties tab.
          p = Path('admin/src/types.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  | 'properties'\n", "  | 'properties'\n  | 'suspended-properties'\n", 1)
          p.write_text(s, encoding='utf-8')

          # 2) Admin sidebar: add the dedicated section without changing existing sections.
          p = Path('admin/src/components/Sidebar.tsx')
          s = p.read_text(encoding='utf-8')
          old = "{item('properties','All Properties',Building2)}{item('hostels','Hostels & PGs',Hotel)}"
          new = "{item('properties','All Properties',Building2)}{item('suspended-properties','Suspended Properties',AlertTriangle)}{item('hostels','Hostels & PGs',Hotel)}"
          if old not in s:
              raise SystemExit('Sidebar insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Admin PropertiesView: special category filter for suspended properties.
          p = Path('admin/src/components/PropertiesView.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "const x=a==='all'&&j==='pending';",
              "const x=a==='all'&&j==='pending';",
              1
          )
          # Make the category predicate explicitly understand the dedicated suspended tab.
          old = "if(l&&l!=='all'&&(g=d===l||K(s)===l));"
          if old in s:
              s = s.replace(old, "if(l&&l!=='all'&&(g=l==='suspended-properties'?N(s.status)==='suspended':(d===l||K(s)===l)));", 1)
          else:
              # Source is formatted in the repository; use a regex fallback.
              s2, n = re.subn(r"if\(l&&l!==['\"]all['\"]&&\(g=d===l\|\|K\(s\)===l\)\);", "if(l&&l!=='all'&&(g=l==='suspended-properties'?N(s.status)==='suspended':(d===l||K(s)===l)));", s, count=1)
              if n == 0:
                  raise SystemExit('PropertiesView category predicate not found')
              s = s2
          # Handle readable/source formatting too.
          s = re.sub(
              r"(const\s+\w+\s*=\s*useMemo\(\(\)\s*=>\s*\{[\s\S]*?const\s+\w+\s*=\s*\w+\?\w+:\w+;[\s\S]*?let\s+\w+\s*=\s*!0;\s*)l&&l!==['\"]all['\"]",
              lambda m: m.group(0),
              s,
              count=1
          )
          # Title and editor type for the special tab.
          s = re.sub(
              r"const me=a==='all'\?'All Property Listings':\(\(G=re\[a\]\)==null\?void 0:G\.title\)\|\|\"Properties\",be=a!==\"all\"\?a:\"hostels\";",
              "const me=a==='all'?'All Property Listings':a==='suspended-properties'?'Suspended Properties':((G=re[a])==null?void 0:G.title)||\"Properties\",be=a!=='all'&&a!=='suspended-properties'?a:\"hostels\";",
              s,
              count=1
          )
          if "a==='suspended-properties'?'Suspended Properties'" not in s:
              # Readable source fallback.
              s = re.sub(
                  r"const me\s*=\s*a\s*===\s*['\"]all['\"]\s*\?\s*['\"]All Property Listings['\"]\s*:\s*.*?;\s*const be\s*=\s*a\s*!==\s*['\"]all['\"]\s*\?\s*a\s*:\s*['\"]hostels['\"]\s*;",
                  "const me = a === 'all' ? 'All Property Listings' : a === 'suspended-properties' ? 'Suspended Properties' : ((re[a] as any)?.title || 'Properties');\n  const be = a !== 'all' && a !== 'suspended-properties' ? a : 'hostels';",
                  s,
                  count=1
              )
          p.write_text(s, encoding='utf-8')

          # 4) Admin App: render the dedicated suspended section and persist Activate.
          p = Path('admin/src/App.tsx')
          s = p.read_text(encoding='utf-8')
          marker = "  // =========================================================\n  // USER HANDLERS"
          handler = '''  // =========================================================\n  // SUSPENDED PROPERTY HANDLER\n  // =========================================================\n\n  const handleActivateSuspendedProperty = async (property: PropertyItem) => {\n    const table = getPropertyType(property);\n    try {\n      const { error } = await supabase\n        .from(table)\n        .update({ status: 'active', updated_at: new Date().toISOString() })\n        .eq('id', property.id);\n      if (error) throw error;\n\n      setProperties((prev) =>\n        prev.map((p) =>\n          String(p.id) === String(property.id)\n            ? { ...p, status: 'active', updated_at: new Date().toISOString() }\n            : p\n        )\n      );\n      showToast(`Property "${property.name || 'Property'}" activated successfully.`);\n      logActivity('activate_property', 'property', property.id, { status: 'active' });\n    } catch (err: any) {\n      showToast(err?.message || 'Unable to activate property.', 'error');\n    }\n  };\n\n'''
          if handler.strip() not in s:
              if marker not in s:
                  raise SystemExit('App handler insertion point not found')
              s = s.replace(marker, handler + marker, 1)
          branch_marker = "          {/* HOSTELS */}"
          branch = '''          {/* SUSPENDED PROPERTIES */}\n\n          {currentTab === 'suspended-properties' && (\n            <PropertiesView\n              categoryFilter="suspended-properties"\n              properties={properties}\n              onOpenPreview={handleOpenPropertyPreview}\n              onOpenEditor={handleOpenPropertyEditor}\n              onToggleVerification={handleToggleVerification}\n              onDeleteProperty={handleDeleteProperty}\n              onBulkAction={handleBulkAction}\n            />\n          )}\n\n'''
          if "currentTab === 'suspended-properties'" not in s:
              if branch_marker not in s:
                  raise SystemExit('App suspended branch insertion point not found')
              s = s.replace(branch_marker, branch + branch_marker, 1)
          p.write_text(s, encoding='utf-8')

          # 5) Public finder pages: inject a small status guard before </body>.
          guard = '''(function(){\n  'use strict';\n  const page = location.pathname.split('/').pop().toLowerCase();\n  const tableByPage = {\n    'pg-finder.html':'hostels',\n    'tiffin-finder.html':'tiffins',\n    'library-finder.html':'libraries',\n    'cafe-finder.html':'cafes',\n    'bookstore-finder.html':'bookstores'\n  };\n  const table = tableByPage[page];\n  if(!table || !window.supabase) return;\n  const SUPABASE_URL = 'https://idurlccrarznnnqixxsd.supabase.co';\n  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9';\n  // This guard intentionally uses the already loaded Supabase client when available.\n  const hideSuspended = async () => {\n    try {\n      const {data,error} = await window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY).from(table).select('id,property_id').eq('status','suspended');\n      if(error || !Array.isArray(data) || !data.length) return;\n      const ids = new Set(data.flatMap(r => [r.id,r.property_id]).filter(v => v!==null && v!==undefined).map(String));\n      document.querySelectorAll('.card,.result-card').forEach(card => {\n        const text = String(card.textContent || '');\n        for(const id of ids){\n          if(new RegExp('(?:#|Property\\s*ID\\s*:?\\s*)'+id+'\\b','i').test(text)){ card.remove(); break; }\n        }\n      });\n    } catch (_) {}\n  };\n  const run=()=>hideSuspended();\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run,{once:true}); else run();\n  new MutationObserver(()=>hideSuspended()).observe(document.body,{childList:true,subtree:true});\n})();\n'''
          gp = Path('js/public-status-guard.js')
          gp.write_text(guard, encoding='utf-8')
          pages = ['pg-finder.html','tiffin-finder.html','library-finder.html','cafe-finder.html','bookstore-finder.html']
          tag = '  <script src="js/public-status-guard.js" defer></script>\n'
          for name in pages:
              p = Path(name); s = p.read_text(encoding='utf-8')
              if 'js/public-status-guard.js' not in s:
                  s = s.replace('</body>', tag + '</body>', 1)
                  p.write_text(s, encoding='utf-8')

          # 6) Direct property details: block suspended listings from public view.
          p = Path('property-details.html')
          s = p.read_text(encoding='utf-8')
          guard2 = '''\n<script>\n(function(){\n  const params=new URLSearchParams(location.search);\n  const typeMap={hostel:'hostels',pg:'hostels',tiffin:'tiffins',library:'libraries',cafe:'cafes',bookstore:'bookstores'};\n  const type=typeMap[String(params.get('type')||'').toLowerCase()];\n  const id=params.get('id');\n  if(!type||!id||!window.supabase) return;\n  const client=window.supabase.createClient('https://idurlccrarznnnqixxsd.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9');\n  client.from(type).select('status').eq('id',id).maybeSingle().then(({data})=>{\n    if(String(data?.status||'').toLowerCase()==='suspended'){\n      const app=document.getElementById('app');\n      if(app) app.innerHTML='<div style="max-width:720px;margin:80px auto;padding:30px;text-align:center;font-family:Inter,Arial,sans-serif"><h2>Property unavailable</h2><p>This listing is currently unavailable.</p><button onclick="history.back()">← Go Back</button></div>';\n    }\n  }).catch(()=>{});\n})();\n</script>\n'''
          if 'This listing is currently unavailable.' not in s:
              s = s.replace('</body>', guard2 + '</body>', 1)
              p.write_text(s, encoding='utf-8')

          # 7) Commit only the intended product files; remove this temporary workflow from the final tree.
          workflow = Path('.github/workflows/status-visibility-upgrade.yml')
          workflow.unlink()

      - name: Validate
        shell: bash
        run: |
          test ! -e .github/workflows/status-visibility-upgrade.yml
          grep -q "suspended-properties" admin/src/types.ts
          grep -q "Suspended Properties" admin/src/components/Sidebar.tsx
          grep -q "currentTab === 'suspended-properties'" admin/src/App.tsx
          test -f js/public-status-guard.js
          for f in pg-finder.html tiffin-finder.html library-finder.html cafe-finder.html bookstore-finder.html; do grep -q 'js/public-status-guard.js' "$f"; done

      - name: Commit final changes
        run: |
          git config user.name 'StudentHubHelp Status Guard'
          git config user.email 'actions@github.com'
          git add admin/src/types.ts admin/src/components/Sidebar.tsx admin/src/components/PropertiesView.tsx admin/src/App.tsx js/public-status-guard.js pg-finder.html tiffin-finder.html library-finder.html cafe-finder.html bookstore-finder.html property-details.html
          git commit -m 'feat: hide suspended properties and add admin suspended section [status-visibility-upgraded]'
          git push
