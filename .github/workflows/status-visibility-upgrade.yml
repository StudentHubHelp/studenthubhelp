name: Apply status visibility upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-visibility-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[status-visibility-upgraded]')"
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin suspended section and public status visibility
        shell: python
        run: |
          from pathlib import Path
          import re

          # Admin tab type.
          p=Path('admin/src/types.ts'); s=p.read_text(encoding='utf-8')
          if "| 'suspended-properties'" not in s:
              s=s.replace("  | 'properties'\n","  | 'properties'\n  | 'suspended-properties'\n",1)
          p.write_text(s,encoding='utf-8')

          # Admin sidebar.
          p=Path('admin/src/components/Sidebar.tsx'); s=p.read_text(encoding='utf-8')
          old="{item('properties','All Properties',Building2)}{item('hostels','Hostels & PGs',Hotel)}"
          new="{item('properties','All Properties',Building2)}{item('suspended-properties','Suspended Properties',AlertTriangle)}{item('hostels','Hostels & PGs',Hotel)}"
          if 'item(\'suspended-properties\',\'Suspended Properties\'' not in s:
              if old not in s: raise SystemExit('Sidebar insertion point not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Admin PropertiesView: recognize the dedicated suspended category.
          p=Path('admin/src/components/PropertiesView.tsx'); s=p.read_text(encoding='utf-8')
          old="l&&l!==\"all\"&&(g=d===l||K(s)===l)"
          new="l&&l!==\"all\"&&(g=l===\"suspended-properties\"?N(s.status)===\"suspended\":(d===l||K(s)===l))"
          if old in s:
              s=s.replace(old,new,1)
          else:
              old="l&&l!=='all'&&(g=d===l||K(s)===l)"
              new="l&&l!=='all'&&(g=l==='suspended-properties'?N(s.status)==='suspended':(d===l||K(s)===l))"
              if old in s: s=s.replace(old,new,1)
              else: raise SystemExit('PropertiesView category predicate not found')
          s=s.replace("const me=a===\"all\"?\"All Property Listings\":((G=re[a])==null?void 0:G.title)||\"Properties\",be=a!==\"all\"?a:\"hostels\";","const me=a===\"all\"?\"All Property Listings\":a===\"suspended-properties\"?\"Suspended Properties\":((G=re[a])==null?void 0:G.title)||\"Properties\",be=a!==\"all\"&&a!==\"suspended-properties\"?a:\"hostels\";",1)
          s=s.replace("const me=a==='all'?'All Property Listings':((G=re[a])==null?void 0:G.title)||'Properties',be=a!=='all'?a:'hostels';","const me=a==='all'?'All Property Listings':a==='suspended-properties'?'Suspended Properties':((G=re[a])==null?void 0:G.title)||'Properties',be=a!=='all'&&a!=='suspended-properties'?a:'hostels';",1)
          p.write_text(s,encoding='utf-8')

          # Admin App: render the section. Activate is already available through the existing
          # PropertiesView bulk Activate action, so no second mutation path is introduced.
          p=Path('admin/src/App.tsx'); s=p.read_text(encoding='utf-8')
          branch="""          {/* SUSPENDED PROPERTIES */}\n\n          {currentTab === 'suspended-properties' && (\n            <PropertiesView\n              categoryFilter=\"suspended-properties\"\n              properties={properties}\n              onOpenPreview={handleOpenPropertyPreview}\n              onOpenEditor={handleOpenPropertyEditor}\n              onToggleVerification={handleToggleVerification}\n              onDeleteProperty={handleDeleteProperty}\n              onBulkAction={handleBulkAction}\n            />\n          )}\n\n"""
          if "currentTab === 'suspended-properties'" not in s:
              marker="          {/* HOSTELS */}"
              if marker not in s: raise SystemExit('App insertion point not found')
              s=s.replace(marker,branch+marker,1)
          p.write_text(s,encoding='utf-8')

          # Public Finder pages: only ACTIVE rows are fetched. No schema or design changes.
          finder_tables={
            'pg-finder.html':'hostels',
            'tiffin-finder.html':'tiffins',
            'library-finder.html':'libraries',
            'cafe-finder.html':'cafes',
            'bookstore-finder.html':'bookstores',
          }
          for name,table in finder_tables.items():
              p=Path(name); s=p.read_text(encoding='utf-8')
              pattern=r'(\.from\\([\"\\\']'+table+r'[\"\\\']\\)\\.select\\([\"\\\']\\*[\"\\\']\\))'
              s2,n=re.subn(pattern,r'\1.eq("status","active")',s,count=1)
              if n==0:
                  # formatted/alternate quote fallback
                  needle=f'.from("{table}").select("*")'
                  if needle in s:
                      s2=s.replace(needle,needle+'.eq("status","active")',1); n=1
              if n==0: raise SystemExit(f'Public query not found in {name}')
              p.write_text(s2,encoding='utf-8')

          # Direct public property details: a suspended row must behave as unavailable.
          p=Path('property-details.html'); s=p.read_text(encoding='utf-8')
          needle=".eq('slug',slug).maybeSingle()"
          if needle in s:
              s=s.replace(needle,".eq('slug',slug).eq('status','active').maybeSingle()",1)
          else:
              needle='.eq("slug",slug).maybeSingle()'
              if needle in s: s=s.replace(needle,'.eq("slug",slug).eq("status","active").maybeSingle()',1)
              else: raise SystemExit('Property details query not found')
          p.write_text(s,encoding='utf-8')

          # Remove this temporary workflow from the final product tree.
          Path('.github/workflows/status-visibility-upgrade.yml').unlink()

      - name: Validate
        shell: bash
        run: |
          test ! -e .github/workflows/status-visibility-upgrade.yml
          grep -q "suspended-properties" admin/src/types.ts
          grep -q "Suspended Properties" admin/src/components/Sidebar.tsx
          grep -q "currentTab === 'suspended-properties'" admin/src/App.tsx
          for f in pg-finder.html tiffin-finder.html library-finder.html cafe-finder.html bookstore-finder.html; do grep -q 'eq("status","active")' "$f" || grep -q "eq('status','active')" "$f"; done
          grep -q "status','active" property-details.html || grep -q 'status","active' property-details.html

      - name: Commit final changes
        run: |
          git config user.name 'StudentHubHelp Status Guard'
          git config user.email 'actions@github.com'
          git add admin/src/types.ts admin/src/components/Sidebar.tsx admin/src/components/PropertiesView.tsx admin/src/App.tsx pg-finder.html tiffin-finder.html library-finder.html cafe-finder.html bookstore-finder.html property-details.html
          git commit -m 'feat: hide suspended properties and add admin suspended section [status-visibility-upgraded]'
          git push
