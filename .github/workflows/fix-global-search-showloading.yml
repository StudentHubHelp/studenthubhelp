name: Fix global search loading helpers

on:
  push:
    branches:
      - main
    paths:
      - global-search.html
      - README.md
      - .github/workflows/fix-global-search-showloading.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore missing global search helpers
        shell: python
        run: |
          from pathlib import Path
          path = Path('global-search.html')
          text = path.read_text(encoding='utf-8')
          marker = '    async function performSearch(q){'
          if marker not in text:
              raise SystemExit('performSearch marker not found')
          if 'function showLoading(show)' not in text:
              helpers = """    function showLoading(show){
              if(loading) loading.style.display=show?'block':'none';
              if(show && grid) grid.innerHTML='';
            }

            function showEmpty(show){
              if(empty) empty.style.display=show?'block':'none';
            }

            function setURLQuery(q){
              try{
                const url=new URL(window.location.href);
                if(q) url.searchParams.set('q',q);
                else url.searchParams.delete('q');
                window.history.replaceState({},'',url.toString());
              }catch(e){}
            }

            function updateSummary(results,q){
              if(title) title.textContent=q?'Smart search: '+q:'Explore StudentHubHelp';
              if(subtitle) subtitle.textContent=q?'Relevant StudentHubHelp listings':'Search across all student services in one place.';
              if(count){
                const span=count.querySelector('span');
                if(span) span.textContent=String(results.length)+' results';
                else count.textContent=String(results.length)+' results';
              }
            }

          """
              text = text.replace(marker, helpers + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Global search helpers inserted.')
          else:
              print('Global search helpers already present.')

      - name: Validate global-search JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('global-search.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          Path('/tmp/global-search.js').write_text('\n\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/global-search.js

      - name: Commit patched global-search.html
        shell: bash
        run: |
          git config user.name 'StudentHubHelp'
          git config user.email 'satpalnehra30@gmail.com'
          git add global-search.html
          if git diff --cached --quiet; then
            echo 'No global-search changes required.'
            exit 0
          fi
          git commit -m 'fix: restore global search loading helpers [showloading-fixed]'
          git push

      - name: Remove one-time fixer
        if: ${{ success() }}
        shell: bash
        run: |
          if [ -f .github/workflows/fix-global-search-showloading.yml ]; then
            git config user.name 'StudentHubHelp'
            git config user.email 'satpalnehra30@gmail.com'
            git rm .github/workflows/fix-global-search-showloading.yml
            git commit -m 'chore: remove global search helper fixer'
            git push
          fi
