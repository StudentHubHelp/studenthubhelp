name: Fix suspension flow
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch suspension flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          finder_tables = {
              'pg-finder.html': 'hostels',
              'tiffin-finder.html': 'tiffins',
              'library-finder.html': 'libraries',
              'cafe-finder.html': 'cafes',
              'bookstore-finder.html': 'bookstores',
          }
          for filename, table in finder_tables.items():
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              original = s
              pattern = re.compile(r"(\\.from\\(\\s*(['\"])" + re.escape(table) + r"\\2\\s*\\))\\s*\\.eq\\(\\s*(['\"])status\\4\\s*,\\s*(['\"])active\\6\\s*\\)\\s*\\.select\\(\\s*(['\"])\\*\\8\\s*\\)")
              s = pattern.sub(r"\\1.select('*').eq('status', 'active')", s)
              if s != original:
                  p.write_text(s, encoding='utf-8')

          p = Path('property-details.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              original = s
              s = re.sub(r"(\\.from\\(\\s*cfg\\.table\\s*\\)\\s*\\.select\\([\\s\\S]*?\\))\\s*\\.limit\\(\\s*80\\s*\\)", r"\\1.eq('status', 'active').limit(80)", s, count=1)
              s = s.replace("table: 'tiffin'", "table: 'tiffins'").replace('table: "tiffin"', 'table: "tiffins"')
              if s != original:
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Verify changes
        run: |
          echo '--- finder status filters ---'
          grep -n -E "from\\(['\"](hostels|tiffins|libraries|cafes|bookstores)['\"]\\)|eq\\(['\"]status['\"], ['\"]active['\"]\\)" pg-finder.html tiffin-finder.html library-finder.html cafe-finder.html bookstore-finder.html || true
          echo '--- detail active/realtime guards ---'
          grep -n -E "status.*active|table: ['\"]tiffin" property-details.html || true
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git add pg-finder.html tiffin-finder.html library-finder.html cafe-finder.html bookstore-finder.html property-details.html
          git commit -m 'fix: enforce active-only public property flow'
          git push
