name: Finish Partner Auth UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch Google partner role UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('auth.html'); s=p.read_text(encoding='utf-8')
          owner='''<div class="role-option"><input id="callbackRoleOwner" type="radio" name="callbackRole" value="owner"><label class="role-label" for="callbackRoleOwner"><span><strong>🏢 Owner</strong><small>Manage your listing</small></span></label></div>'''
          if 'id="callbackRolePartner"' not in s and owner in s:
            s=s.replace(owner,owner+'''\n<div class="role-option"><input id="callbackRolePartner" type="radio" name="callbackRole" value="partner"><label class="role-label" for="callbackRolePartner"><span><strong>🤝 Partner</strong><small>Approved applicants only</small></span></label></div>''',1)
          s=s.replace('Create your StudentHubHelp student or owner account.','Create your StudentHubHelp student, owner or approved partner account.')
          s=s.replace('Select Student or Owner to continue.','Select Student, Owner or approved Partner to continue.')
          old='''  }else if(r==="owner"){\n    $("googleRoleState").textContent="Owner selected — ab Google se continue kar sakte ho.";\n    $("googleSignupText").textContent="Continue with Google as Owner";\n  }else{'''
          new='''  }else if(r==="owner"){\n    $("googleRoleState").textContent="Owner selected — ab Google se continue kar sakte ho.";\n    $("googleSignupText").textContent="Continue with Google as Owner";\n  }else if(r==="partner"){\n    $("googleRoleState").textContent="Partner selected — approved application required.";\n    $("googleSignupText").textContent="Continue with Google as Partner";\n  }else{'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete partner auth role ui"
          git push
