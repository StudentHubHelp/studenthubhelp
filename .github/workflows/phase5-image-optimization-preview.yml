name: Phase 5 - image optimization preview

on:
  pull_request:
    branches: [main]
    paths:
      - "**.png"
      - "scripts/phase5-image-optimization-preview.mjs"
      - ".github/workflows/phase5-image-optimization-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize-preview:
    name: Lossless PNG optimization preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image optimizer
        run: npm install --no-save sharp
      - name: Create lossless optimization previews
        run: node scripts/phase5-image-optimization-preview.mjs
      - name: Upload optimized previews for visual review
        uses: actions/upload-artifact@v4
        with:
          name: studenthubhelp-optimized-image-previews
          path: artifacts/optimized-images/
          if-no-files-found: warn
          retention-days: 7
