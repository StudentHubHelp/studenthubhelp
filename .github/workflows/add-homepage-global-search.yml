name: Add homepage global search

on:
  push:
    branches: [main]
    paths:
      - 'js/homepage-global-search.js'
      - '.github/workflows/add-homepage-global-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-search:
    if: "github.event_name != 'push' || !contains(github.event.head_commit.message, '[homepage-search]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach homepage search script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="js/homepage-global-search.js" defer></script>'
          if marker not in text:
              needle = '</head>'
              if needle not in text:
                  raise SystemExit('index.html: </head> not found')
              text = text.replace(needle, f'  {marker}\n{needle}', 1)
              p.write_text(text, encoding='utf-8')

      - name: Validate homepage search hook
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('js/homepage-global-search.js').read_text(encoding='utf-8')
          assert 'js/homepage-global-search.js' in html
          assert "id = 'homepageGlobalSearch'" in js
          assert 'global-search.html' in js
          print('Homepage global search hook validated.')

      - name: Commit homepage search integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage integration changes needed."
            exit 0
          fi
          git commit -m "feat: integrate premium homepage global search [homepage-search]"
          git push

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/add-homepage-global-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/add-homepage-global-search.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove one-time homepage search workflow"
          git push
