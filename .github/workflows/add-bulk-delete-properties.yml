name: Add Admin Bulk Property Delete
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PropertiesView
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('admin/src/components/PropertiesView.tsx')
          s = p.read_text(encoding='utf-8')
          marker = "  const handlePersistedBulkAction = async (action: 'verify' | 'activate' | 'suspend' | 'feature') => {"
          fn = base64.b64decode('').decode('utf-8')
          if 'handleBulkDeleteProperties' not in s:
              if marker not in s: raise SystemExit('bulk action marker not found')
              s = s.replace(marker, fn + marker, 1)
          button = '<button disabled={bulkBusy || categoryFilter !== \'all\'} onClick={handleBulkDeleteProperties} className="px-3 py-1.5 rounded-lg bg-rose-600/20 text-rose-300 hover:bg-rose-600/30 font-bold disabled:opacity-50">{bulkBusy ? \'Working…\' : \'Bulk Delete\'}</button>'
          feature = '<button disabled={bulkBusy} onClick={() => handlePersistedBulkAction(\'feature\')} className="px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 font-bold disabled:opacity-50">Bulk Feature</button>'
          if 'Bulk Delete</button>' not in s:
              if feature not in s: raise SystemExit('bulk feature marker not found')
              s = s.replace(feature, feature + button, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          grep -q 'handleBulkDeleteProperties' admin/src/components/PropertiesView.tsx
          grep -q 'Bulk Delete' admin/src/components/PropertiesView.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/src/components/PropertiesView.tsx
          git commit -m 'feat: add admin bulk property delete'
          git rm .github/workflows/add-bulk-delete-properties.yml
          git commit -m 'chore: remove temporary bulk delete workflow'
          git push origin HEAD:main
