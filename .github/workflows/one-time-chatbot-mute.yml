name: Set chatbot voice muted by default

on:
  push:
    branches: [main]
    paths:
      - 'ai-chatbot/public/widget.js'
      - '.github/workflows/one-time-chatbot-mute.yml'

permissions:
  contents: write

jobs:
  mute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set voice off by default
        shell: python
        run: |
          from pathlib import Path
          p = Path('ai-chatbot/public/widget.js')
          text = p.read_text(encoding='utf-8')
          old = 'let history=[];let speaking=true;'
          new = 'let history=[];let speaking=false;'
          if old not in text:
              raise SystemExit('Expected chatbot voice setting was not found; no change made.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot/public/widget.js
          git diff --cached --quiet || git commit -m "Mute chatbot voice by default [skip ci]"
          rm -f .github/workflows/one-time-chatbot-mute.yml
          git add .github/workflows/one-time-chatbot-mute.yml
          git diff --cached --quiet || git commit -m "Remove one-time chatbot mute workflow [skip ci]"
          git push
