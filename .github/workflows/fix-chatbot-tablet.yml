name: Tune chatbot tablet layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch tablet CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai-chatbot/public/widget.js')
          s = p.read_text()
          old = "@media(min-width:521px){#shh-chatbot-container.shh-expanded{right:16px!important;bottom:16px!important}#shh-chatbot-container.shh-expanded>div{width:min(760px,calc(100vw - 32px))!important;height:min(820px,calc(100vh - 32px))!important}}"
          new = "@media(min-width:521px) and (max-width:900px){#shh-chatbot-container{right:12px!important;bottom:12px!important}#shh-chatbot-container>div{width:min(480px,calc(100vw - 24px))!important;height:min(70vh,680px)!important;max-height:70vh!important;border-radius:24px!important}}@media(min-width:901px){#shh-chatbot-container.shh-expanded{right:16px!important;bottom:16px!important}#shh-chatbot-container.shh-expanded>div{width:min(760px,calc(100vw - 32px))!important;height:min(820px,calc(100vh - 32px))!important}}"
          if old not in s:
              raise SystemExit('target desktop CSS not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot/public/widget.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve chatbot tablet sizing"
          git push