name: One-time audience guide layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply premium audience guide layer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject audience guide assets
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'href="audience-hub.css"' not in s:
              marker = '<link rel="stylesheet" href="audience-hub.css">'
              pos = s.lower().find('</head>')
              if pos < 0: raise SystemExit('head tag not found')
              s = s[:pos] + '  ' + marker + '\n' + s[pos:]
          if 'src="audience-hub.js"' not in s:
              marker = '<script src="audience-hub.js" defer></script>'
              pos = s.lower().rfind('</body>')
              if pos < 0: raise SystemExit('body tag not found')
              s = s[:pos] + '  ' + marker + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Commit homepage integration
        run: |
          git config user.name 'StudentHubHelp'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply premium audience guide layer'
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-audience-hub.yml
          git add .github/workflows/one-time-audience-hub.yml
          git commit -m 'Remove one-time audience guide workflow'
          git push
