name: Build Director Admin

on:
  push:
    branches:
      - main
    paths:
      - 'admin/src/**'
      - 'admin/public/**'
      - 'admin/package.json'
      - 'admin/vite.config.ts'
      - 'admin/index.html'
      - 'admin/manifest.webmanifest'
      - 'admin/service-worker.js'
      - 'admin/icons/**'
      - 'logo.png'
      - 'admin/src/BUILD_TRIGGER.txt'
      - 'scripts/apply-review-production-fix.py'
      - '.github/workflows/admin-build.yml'
  workflow_dispatch:

permissions:
  contents: write

# Avoid simultaneous admin build commits racing to push to main.
concurrency:
  group: director-admin-build-main
  cancel-in-progress: false

jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: admin
        run: npm install

      - name: Wire enterprise AI controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/src/components/IntelligenceViews.tsx')
          s = p.read_text(encoding='utf-8')
          import_line = "import { ChatbotAdminControls } from './ChatbotAdminControls';"
          if import_line not in s:
              marker = "import { ChatbotAdminView } from './ChatbotAdminView';"
              if marker not in s:
                  raise SystemExit('ChatbotAdminView import marker not found')
              s = s.replace(marker, marker + "\n" + import_line, 1)
          old = '<ChatbotAdminView />'
          new = '<ChatbotAdminView /><ChatbotAdminControls />'
          if new not in s:
              if old not in s:
                  raise SystemExit('ChatbotAdminView render marker not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Restore source index
        working-directory: admin
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <link rel="icon" type="image/png" href="/admin/icons/icon-192x192.png?v=director-admin-2" />
              <link rel="apple-touch-icon" href="/admin/icons/icon-192x192.png?v=director-admin-2" />
              <link rel="manifest" href="/admin/manifest.webmanifest" />
              <meta name="theme-color" content="#082B63" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-title" content="SHH Admin" />
              <title>StudentHubHelp Admin Dashboard</title>
              <meta name="description" content="Secure administration dashboard for StudentHubHelp listings and operations." />
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
            </head>
            <body class="bg-[#040814] text-slate-100 antialiased">
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
              <script>
                if ("serviceWorker" in navigator) {
                  window.addEventListener("load", function () {
                    navigator.serviceWorker.register("/admin/service-worker.js", { scope: "/admin/" })
                      .then(async function (registration) {
                        if ("sync" in registration) registration.sync.register("studenthubhelp-admin-refresh-shell").catch(function () {});
                        if ("periodicSync" in registration && "permissions" in navigator) {
                          try {
                            const permission = await navigator.permissions.query({ name: "periodic-background-sync" });
                            if (permission.state === "granted") {
                              await registration.periodicSync.register("studenthubhelp-admin-refresh-shell", { minInterval: 12 * 60 * 60 * 1000 });
                            }
                          } catch (_) {}
                        }
                        if ("periodicSync" in registration && "permissions" in navigator) {
                          try {
                            const permission = await navigator.permissions.query({ name: "periodic-background-sync" });
                            if (permission.state === "granted") {
                              await registration.periodicSync.register("studenthubhelp-admin-refresh-shell", { minInterval: 12 * 60 * 60 * 1000 });
                            }
                          } catch (_) {}
                        }
                      })
                      .catch(function (error) {
                        console.warn("StudentHubHelp Admin service worker registration failed:", error);
                      });
                  }, { once: true });
                }
              </script>
            </body>
          </html>
          EOF

      - name: Apply review source fix
        run: python3 scripts/apply-review-production-fix.py

      - name: Build admin
        working-directory: admin
        run: npm run build

      - name: Publish build
        run: |
          rm -rf /tmp/admin-build
          mkdir -p /tmp/admin-build
          cp -r admin/dist/. /tmp/admin-build/
          rm -rf admin/assets
          cp -r /tmp/admin-build/assets admin/
          cp /tmp/admin-build/index.html admin/
          cp logo.png admin/logo.png

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin owner-dashboard.html
          git diff --cached --quiet || git commit -m "Build director admin with review workflow [skip ci]"
          # Integrate commits that landed while the build was running; never force-push.
          git pull --rebase origin main
          git push
