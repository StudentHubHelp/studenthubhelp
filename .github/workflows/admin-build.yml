name: Build Director Admin

on:
  push:
    branches:
      - main
    paths:
      - 'admin/src/**'
      - 'admin/public/**'
      - 'admin/package.json'
      - 'admin/vite.config.ts'
      - 'admin/index.html'
      - 'logo.png'
      - 'admin/src/BUILD_TRIGGER.txt'
      - '.github/workflows/admin-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upgrade public index footer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          start = html.find('<!-- =========================================\n        PREMIUM FOOTER')
          end = html.find('</footer>', start)
          if start < 0 or end < 0:
              raise SystemExit('Existing footer not found')
          end += len('</footer>')

          footer = '''<!-- =========================================
        PREMIUM FOOTER — RESPONSIVE V2
  ========================================= -->
  <footer class="site-footer">
    <div class="container footer-shell">
      <div class="footer-grid footer-grid-v2">
        <section class="footer-brand-panel">
          <div class="footer-brand">
            <img src="logo.png" alt="StudentHubHelp logo" loading="lazy" decoding="async" />
            <div><strong>StudentHubHelp</strong><span>Student Discovery Platform · India</span></div>
          </div>
          <p class="footer-desc">A student-focused local discovery platform for exploring hostels, PGs, tiffin and mess services, libraries, cafes and bookstores across India.</p>
          <div class="footer-trust-line"><span>✓ Student-focused</span><span>✓ Local discovery</span><span>✓ India-wide</span></div>
          <div class="footer-socials" aria-label="Social and sharing links">
            <a class="footer-social" href="https://www.instagram.com/studenthubhelp/" target="_blank" rel="noopener noreferrer" aria-label="StudentHubHelp on Instagram"><span class="social-icon">◎</span><span>Instagram</span></a>
            <a class="footer-social" href="https://wa.me/?text=Discover%20StudentHubHelp%20-%20https%3A%2F%2Fstudenthubhelp.github.io%2Fstudenthubhelp%2F" target="_blank" rel="noopener noreferrer" aria-label="Share StudentHubHelp on WhatsApp"><span class="social-icon">◉</span><span>WhatsApp</span></a>
            <button class="footer-social" type="button" onclick="shareStudentHubHelp()" aria-label="Share StudentHubHelp"><span class="social-icon">↗</span><span>Share</span></button>
          </div>
        </section>
        <section class="footer-column"><h4>Explore</h4><div class="footer-links">
          <a href="index.html">Home</a><a href="pg-finder.html">Hostels &amp; PG</a><a href="tiffin-finder.html">Tiffin &amp; Mess</a><a href="library-finder.html">Libraries</a><a href="cafe-finder.html">Cafes</a><a href="bookstore-finder.html">Bookstores</a>
        </div></section>
        <section class="footer-column"><h4>StudentHubHelp</h4><div class="footer-links">
          <a href="about.html">About Us</a><a href="student-helplines-safety.html">Student Helplines &amp; Safety</a><a href="global-search.html">Search</a><a href="add-listing.html">Add Listing</a><a href="partner.html">Partner Program</a><a href="privacy-policy.html">Privacy Policy</a><a href="terms-and-conditions.html">Terms &amp; Conditions</a><a href="contact-us.html">Contact Us</a>
        </div></section>
        <section class="footer-column"><h4>Quick Discovery</h4><div class="footer-links">
          <a href="global-search.html">Find a Service</a><a href="pg-finder.html">Find Accommodation</a><a href="tiffin-finder.html">Find Food</a><a href="library-finder.html">Find Study Spaces</a><a href="about.html#faq">FAQs</a>
        </div></section>
        <section class="footer-column footer-contact"><h4>Director &amp; Support</h4>
          <div class="director-name">SATPAL SWAMI</div><div class="director-role">Founder · StudentHubHelp</div>
          <div class="director-info">
            <a href="tel:+919929718264"><span>☎</span><span>+91 9929718264</span></a>
            <a href="mailto:satpalswami22742@gmail.com"><span>✉</span><span>satpalswami22742@gmail.com</span></a>
            <a href="https://studenthubhelp.github.io/studenthubhelp/admin/"><span>⌘</span><span>Admin Login</span></a>
          </div>
        </section>
      </div>
      <div class="footer-bottom"><div>© 2026 StudentHubHelp. All rights reserved.</div><div>Built for students · Discover locally, study confidently.</div></div>
    </div>
  </footer>'''
          html = html[:start] + footer + html[end:]

          css = '''
    /* PREMIUM FOOTER — RESPONSIVE V2 */
    .site-footer{position:relative;overflow:hidden;background:radial-gradient(circle at 8% 0%,rgba(214,168,79,.08),transparent 28%),linear-gradient(180deg,#071a33 0%,#06162b 100%);border-top:1px solid rgba(214,168,79,.18);color:#fff}
    .site-footer::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.018),transparent)}
    .footer-shell{position:relative;z-index:1;padding:52px 0 20px}
    .footer-grid-v2{display:grid;grid-template-columns:minmax(260px,1.55fr) repeat(3,minmax(145px,.85fr)) minmax(210px,1.05fr);gap:30px;align-items:start}
    .footer-brand-panel{min-width:0;padding-right:10px}.footer-brand{display:flex;align-items:center;gap:12px;min-width:0}.footer-brand img{width:48px;height:48px;flex:0 0 48px;object-fit:contain;border-radius:13px;background:#fff;padding:3px;box-shadow:0 10px 28px rgba(0,0,0,.22)}
    .footer-brand strong{display:block;font-size:17px;line-height:1.2;color:#fff}.footer-brand span{display:block;margin-top:3px;color:#8fa4bd;font-size:10px;font-weight:600}
    .site-footer .footer-desc{max-width:390px;margin:16px 0 14px;color:#aebed2;font-size:11px;line-height:1.7}.footer-trust-line{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:17px}.footer-trust-line span{padding:5px 8px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(255,255,255,.035);color:#9fb0c4;font-size:9px;font-weight:700}
    .site-footer h4{margin:2px 0 14px;color:#f0d48a;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.9px}.footer-links{display:grid;gap:5px}.footer-links a{display:block;width:fit-content;max-width:100%;padding:5px 0;color:#aebed2;font-size:11px;line-height:1.45;transition:color .2s ease,transform .2s ease}.footer-links a:hover{color:#fff;transform:translateX(3px)}
    .footer-contact{min-width:0}.director-name{font-size:16px;font-weight:800;letter-spacing:.2px;color:#fff}.director-role{margin-top:3px;color:#8498b2;font-size:9px;font-weight:600}.director-info{display:grid;gap:9px;margin-top:16px}.director-info a{display:flex;align-items:flex-start;gap:8px;min-width:0;color:#aebed2;font-size:10px;line-height:1.45}.director-info a span:first-child{width:17px;flex:0 0 17px;color:#d6a84f;text-align:center}.director-info a span:last-child{overflow-wrap:anywhere}.director-info a:hover{color:#fff}
    .footer-socials{display:flex;flex-wrap:wrap;gap:8px}.footer-social{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:7px 11px;border:1px solid rgba(214,168,79,.20);border-radius:10px;background:rgba(255,255,255,.035);color:#d8e1ec;font-size:10px;font-weight:700;cursor:pointer;transition:transform .2s ease,border-color .2s ease,background .2s ease,color .2s ease}.footer-social:hover{transform:translateY(-2px);border-color:rgba(214,168,79,.55);background:rgba(214,168,79,.08);color:#fff}.footer-social .social-icon{font-size:14px;line-height:1;color:#f0d48a}
    .footer-bottom{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:38px;padding-top:17px;border-top:1px solid rgba(255,255,255,.08);color:#71839c;font-size:9px}
    @media(max-width:1050px){.footer-grid-v2{grid-template-columns:1.35fr repeat(2,1fr);gap:28px}.footer-brand-panel{grid-column:1/-1;max-width:760px;padding-right:0}}
    @media(max-width:720px){.footer-shell{padding:38px 0 16px}.footer-grid-v2{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px}.footer-brand-panel{grid-column:1/-1}.site-footer h4{margin-bottom:10px}.footer-bottom{align-items:flex-start;flex-direction:column;gap:5px;margin-top:28px}}
    @media(max-width:480px){.footer-shell{width:min(100% - 24px,1180px)}.footer-grid-v2{grid-template-columns:1fr;gap:22px}.footer-brand-panel{grid-column:auto}.footer-column{padding-top:3px}.footer-links{gap:2px}.footer-links a{padding:4px 0;font-size:10.5px}.footer-socials{gap:7px}.footer-social{flex:1 1 auto;min-width:0;padding-inline:9px}.footer-bottom{font-size:8.5px}}
'''
          if 'PREMIUM FOOTER — RESPONSIVE V2' not in html:
              pos = html.rfind('</style>')
              if pos < 0: raise SystemExit('Main style block not found')
              html = html[:pos] + css + '\n' + html[pos:]

          share = '''<script>function shareStudentHubHelp(){const d={title:'StudentHubHelp',text:'Discover student-friendly hostels, PGs, tiffin, libraries, cafes and bookstores across India.',url:'https://studenthubhelp.github.io/studenthubhelp/'};if(navigator.share){navigator.share(d).catch(()=>{});return}window.open('https://wa.me/?text='+encodeURIComponent(d.text+' '+d.url),'_blank','noopener,noreferrer')}</script>'''
          if 'function shareStudentHubHelp()' not in html:
              html = html.replace('</body>', share + '\n</body>', 1)

          anchor = '<meta property="og:image:alt" content="StudentHubHelp" />'
          extra = '''<meta property="og:locale" content="en_IN" />
<meta property="og:image:secure_url" content="https://studenthubhelp.github.io/studenthubhelp/logo.png" />
<meta property="og:image:type" content="image/png" />'''
          if 'og:image:secure_url' not in html:
              html = html.replace(anchor, anchor + '\n' + extra, 1)
          p.write_text(html, encoding='utf-8')
          print('Index footer upgrade applied')

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: admin
        run: npm install

      - name: Wire enterprise AI controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/src/components/IntelligenceViews.tsx')
          s = p.read_text(encoding='utf-8')
          import_line = "import { ChatbotAdminControls } from './ChatbotAdminControls';"
          if import_line not in s:
              marker = "import { ChatbotAdminView } from './ChatbotAdminView';"
              if marker not in s:
                  raise SystemExit('ChatbotAdminView import marker not found')
              s = s.replace(marker, marker + "\n" + import_line, 1)
          old = '<ChatbotAdminView />'
          new = '<ChatbotAdminView /><ChatbotAdminControls />'
          if new not in s:
              if old not in s:
                  raise SystemExit('ChatbotAdminView render marker not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Enterprise AI controls wired into Director Admin')
          PY

      - name: Restore source index
        working-directory: admin
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <link rel="icon" type="image/png" href="/studenthubhelp/admin/logo.png" />
              <link rel="apple-touch-icon" href="/studenthubhelp/admin/logo.png" />
              <title>StudentHubHelp - Director Admin Dashboard</title>
              <meta name="description" content="Professional Director Admin Dashboard with user management, real-time Supabase integration, comprehensive analytics charts, and property management." />
              <link rel="preconnect" href="https://fonts.googleapis.com" />
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
              <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
            </head>
            <body class="bg-[#040814] text-slate-100 antialiased">
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          EOF

      - name: Build admin
        working-directory: admin
        run: npm run build

      - name: Publish build
        run: |
          rm -rf /tmp/admin-build
          mkdir -p /tmp/admin-build
          cp -r admin/dist/. /tmp/admin-build/
          rm -rf admin/assets
          cp -r /tmp/admin-build/assets admin/
          cp /tmp/admin-build/index.html admin/
          cp logo.png admin/logo.png

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin index.html
          git diff --cached --quiet || git commit -m "Build director admin [skip ci]"
          git push
