name: one-time-nearby-coaching
on:
  push:
    paths:
      - '.github/workflows/one-time-nearby-coaching.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Nearby Coaching to property details
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('property-details.html')
          s=p.read_text(encoding='utf-8')
          old="""${field('Nearby Landmark',r.landmark||r.nearby_landmark)}"""
          new="""${field('Nearby Landmark',r.landmark||r.nearby_landmark)}\n          ${field('Nearby Coaching',r.nearby_coaching)}"""
          if old not in s:
              raise SystemExit('target pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-nearby-coaching.yml
          git add property-details.html .github/workflows/one-time-nearby-coaching.yml
          git commit -m 'Show nearby coaching in property details'
          git push origin main
