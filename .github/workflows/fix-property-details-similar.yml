name: Fix property details similar listings

on:
  push:
    branches: [main]
    paths:
      - 'property-details.html'
      - '.github/workflows/fix-property-details-similar.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch property details
        shell: python
        run: |
          from pathlib import Path

          p = Path('property-details.html')
          s = p.read_text(encoding='utf-8')

          old_select = "let q=db.from(cfg.table).select('id,slug,name,service_name,image,area,city,rent,price,monthly_rent,monthly_price,starting_price,price_per_month,amount,rating,verified,status').limit(80);"
          new_select = "let q=db.from(cfg.table).select('id,slug,name,image,area,city,price,monthly_fee,rating,verified,status').limit(80);"
          if old_select in s:
              s = s.replace(old_select, new_select, 1)

          # A previous workflow accidentally wrote literal \\n          # escape sequences into this standalone script. Convert that
          # script back to valid JavaScript without changing its behavior.
          marker = '<script>\\n(function(){'
          if marker in s:
              start = s.index(marker)
              end_marker = '\\n</script>'
              end = s.find(end_marker, start)
              if end != -1:
                  block = s[start:end + len(end_marker)]
                  block = block.replace('\\n', '\n')
                  s = s[:start] + block + s[end + len(end_marker):]

          p.write_text(s, encoding='utf-8')

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'StudentHubHelp'
          git config user.email 'actions@users.noreply.github.com'
          git add property-details.html
          git diff --cached --quiet || git commit -m 'Fix similar property loading on property details'
          git rm .github/workflows/fix-property-details-similar.yml
          git commit -m 'Remove one-time property details fix workflow'
          git push
