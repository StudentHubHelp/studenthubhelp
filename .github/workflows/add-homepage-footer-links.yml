name: Add homepage footer links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-footer-links:
    if: "!contains(github.event.head_commit.message, '[footer-links-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add 404 and Thank You links under Quick Discovery
        shell: python
        run: |
          from pathlib import Path

          path = Path('performance.js')
          text = path.read_text(encoding='utf-8')
          needle = '<a href="about.html#faq">FAQs</a>'
          addition = '''<a href="about.html#faq">FAQs</a>${(window.location.pathname === '/studenthubhelp/' || window.location.pathname.endsWith('/studenthubhelp/index.html')) ? '<a href="404.html">404 Page</a><a href="thank-you.html">Thank You</a>' : ''}'''

          if 'href="404.html">404 Page</a>' in text and 'href="thank-you.html">Thank You</a>' in text:
              print('Footer links already present; nothing to change.')
          elif needle not in text:
              raise SystemExit('Quick Discovery FAQ link not found; stopping without changes.')
          else:
              path.write_text(text.replace(needle, addition, 1), encoding='utf-8')
              print('Added homepage-only 404 and Thank You links under Quick Discovery.')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-homepage-footer-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- performance.js; then
            git add .github/workflows/add-homepage-footer-links.yml
            git commit -m 'chore: clean up footer-link workflow [footer-links-applied]' || true
          else
            git add performance.js .github/workflows/add-homepage-footer-links.yml
            git commit -m 'feat: add homepage footer links [footer-links-applied]'
          fi
          git push
