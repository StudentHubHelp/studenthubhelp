name: Finalize Partner Auth
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch partner provisioning
        shell: python
        run: |
          from pathlib import Path
          p=Path('auth.html'); s=p.read_text(encoding='utf-8')
          # Google OAuth cannot know the Google email before the provider returns; validate on callback instead.
          old='''    if(r==="partner") {\n      const emailHint=$("signupEmail").value.trim().toLowerCase();\n      if(!emailHint || !(await isApprovedPartnerEmail(emailHint))){\n        msg("Partner ke liye pehle approved application ke same email se continue karo.");\n        return;\n      }\n    }\n    localStorage.setItem("sh_google_signup_role",r);'''
          new='''    localStorage.setItem("sh_google_signup_role",r);'''
          if old in s: s=s.replace(old,new,1)
          # Provision partner_profiles from the approved application after either password or Google authentication.
          marker='''async function isApprovedPartnerEmail(email){\n  const e=String(email||"").trim().toLowerCase();\n  if(!e)return false;\n  const {data,error}=await db.from("partner_applications").select("id,status").eq("email",e).eq("status","approved").limit(1);\n  if(error)throw new Error("Partner approval check nahi ho saka.");\n  return !!data?.length;\n}'''
          helper=marker+'''\n\nasync function ensurePartnerProfile(user, profile){\n  if(!user?.id || !profile || role(profile.role)!=="partner") return profile;\n  const {data:existing,error:readError}=await db.from("partner_profiles").select("id").eq("user_id",user.id).maybeSingle();\n  if(readError)throw new Error("Partner profile load nahi ho saka.");\n  if(existing)return profile;\n  const email=String(profile.email||user.email||"").trim().toLowerCase();\n  const {data:apps,error:appError}=await db.from("partner_applications").select("id,full_name,phone,email,state,district,city,area,status").eq("email",email).eq("status","approved").order("created_at",{ascending:false}).limit(1);\n  if(appError)throw new Error("Approved Partner application load nahi ho saki.");\n  const app=apps?.[0];\n  if(!app)throw new Error("Approved Partner application nahi mili.");\n  const {error}=await db.from("partner_profiles").insert({user_id:user.id,application_id:app.id,full_name:app.full_name||profile.full_name||"Partner",email:app.email||email,phone:app.phone||profile.phone||"",state:app.state,district:app.district,city:app.city,areas:app.area?[app.area]:[],status:"active"});\n  if(error && !String(error.message||"").toLowerCase().includes("duplicate"))throw error;\n  return profile;\n}'''
          if 'async function ensurePartnerProfile' not in s:
            if marker not in s: raise SystemExit('partner helper anchor missing')
            s=s.replace(marker,helper,1)
          call='''    clearPending();\n\n    const md=user.user_metadata||{};'''
          repl='''    clearPending();\n\n    if(r==="partner") {\n      await ensurePartnerProfile(user,p);\n    }\n\n    const md=user.user_metadata||{};'''
          if call not in s: raise SystemExit('route provisioning anchor missing')
          s=s.replace(call,repl,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: provision approved partner profiles on login"
          git push
