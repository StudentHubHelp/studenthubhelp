name: SEO phase validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.html'
      - 'property-index.html'
      - 'property-details.html'
      - 'scripts/generate-property-pages.mjs'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/generate-sitemap.mjs'
      - '.github/workflows/seo-phase-validation.yml'

permissions:
  contents: read

jobs:
  seo-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check SEO generator syntax
        run: |
          node --check scripts/generate-property-pages.mjs
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/generate-sitemap.mjs

      - name: Regenerate property HTML from published listing data
        env:
          SUPABASE_URL: https://idurlccrarznnnqixxsd.supabase.co
          SUPABASE_KEY: sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFhT
          BASE_URL: https://studenthubhelp.in
        run: node scripts/generate-property-pages.mjs

      - name: Validate internal links, property HTML and schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import html as html_lib, json, re

          base='https://studenthubhelp.in/'
          home=Path('index.html').read_text(encoding='utf-8')
          visual=Path('sitemap.html').read_text(encoding='utf-8')
          directory=Path('property-index.html').read_text(encoding='utf-8')
          assert 'href="/explore-listings.html"' in home, 'Homepage is missing its public listings directory link'
          assert 'href="property-index.html"' in visual
          for city in ('sikar','kota','jaipur','delhi'):
              assert Path(city, 'index.html').exists(), f'Missing generated city hub: {city}'
          assert '<link rel="canonical" href="https://studenthubhelp.in/property-index.html">' in directory
          assert re.search(r'<a href="https://studenthubhelp\.in/properties/', directory), 'Property directory has no crawlable property links'

          report=json.loads(Path('property-pages-manifest.json').read_text(encoding='utf-8'))
          assert report['total'] >= 600, f"Unexpected property count: {report['total']}"
          for category in ('hostel','tiffin','library','cafe','bookstore'):
              expected=report['byCategory'].get(category,0)
              pages=list(Path('properties',category).glob('*/index.html'))
              assert expected > 0 and len(pages) >= expected, f'{category}: generated page count mismatch'
              canonical_pages=[]
              for page in pages:
                  html=page.read_text(encoding='utf-8')
                  if 'id="seo-property-fallback"' not in html:
                      continue
                  canonical_pages.append(page)
                  assert 'id="canonicalLink" rel="canonical"' in html, f'Missing canonical: {page}'
                  schema_tag='<script type="application/ld+json" id="baseSchema">'
                  schema_start=html.find(schema_tag)
                  assert schema_start >= 0, f'Missing base WebPage schema: {page}'
                  schema_start += len(schema_tag)
                  schema_end=html.find('</script>', schema_start)
                  assert schema_end >= 0, f'Unclosed base schema: {page}'
                  schema=json.loads(html[schema_start:schema_end])
                  assert schema.get('@type') == 'WebPage', f'Invalid base WebPage schema: {page}'
                  assert 'function setSEO(r)' in html, f'Missing dynamic listing SEO schema builder: {page}'
                  assert all(kind in html for kind in ('LodgingBusiness','FoodEstablishment','Library','CafeOrCoffeeShop','BookStore')), f'Missing category-specific schema types: {page}'
                  assert 'href="/property-index.html"' in html, f'Missing property directory link: {page}'
                  assert 'href="/"' in html, f'Missing homepage link: {page}'
                  assert 'href="' + {
                      'hostel':'/pg-finder.html',
                      'tiffin':'/tiffin-finder.html',
                      'library':'/library-finder.html',
                      'cafe':'/cafe-finder.html',
                      'bookstore':'/bookstore-finder.html'
                  }[category] + '"' in html, f'Missing category finder link: {page}'
                  title_match=re.search(r'<title>(.*?)</title>', html, re.I|re.S)
                  title_text=html_lib.unescape(title_match.group(1)) if title_match else ''
                  assert title_match and len(re.sub(r'\s+',' ',title_text).strip()) <= 60, f'Property title exceeds 60 characters: {page}'
              assert len(canonical_pages) >= expected, f'{category}: expected {expected} canonical pages with server-rendered summaries, found {len(canonical_pages)}'
          print(f"SEO validation passed: {report['total']} property pages; category totals {report['byCategory']}")
          PY

      - name: Regenerate SEO directories and XML sitemap
        env:
          SUPABASE_URL: https://idurlccrarznnnqixxsd.supabase.co
          SUPABASE_KEY: sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFhT
          BASE_URL: https://studenthubhelp.in/
          SEO_LOCATION_MIN_PROPERTIES: 3
        run: |
          node scripts/generate-seo-pages.mjs
          node scripts/generate-sitemap.mjs

      - name: Validate sitemap output
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import json, xml.etree.ElementTree as ET

          ns='http://www.sitemaps.org/schemas/sitemap/0.9'
          root=ET.parse('sitemap.xml').getroot()
          assert root.tag == f'{{{ns}}}sitemapindex'
          urls=[]
          for item in root.findall(f'{{{ns}}}sitemap'):
              loc=item.find(f'{{{ns}}}loc').text.strip()
              child=ET.parse(Path(urlparse(loc).path).name).getroot()
              assert child.tag == f'{{{ns}}}urlset'
              urls.extend(x.find(f'{{{ns}}}loc').text.strip() for x in child.findall(f'{{{ns}}}url'))
          assert len(urls)==len(set(urls)), 'Duplicate URL across sitemaps'
          assert 'https://studenthubhelp.in/' in urls
          assert 'https://studenthubhelp.in/property-index.html' in urls
          generated=json.loads(Path('seo-generated-manifest.json').read_text(encoding='utf-8')).get('generated',[])
          assert all(url in urls for url in generated), 'Generated SEO URL missing from sitemap'
          print(f'Sitemap validation passed: {len(urls)} unique URLs.')
          PY
