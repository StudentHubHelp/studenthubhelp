name: SEO phase validation

on:
  push:
    branches: [main]
    paths:
      - 'data/seo-page-rules.json'
      - 'scripts/seo-page-eligibility.mjs'
      - 'tests/seo-page-eligibility.test.mjs'
      - 'scripts/seo-listing-data.mjs'
      - 'tests/seo-listing-data.test.mjs'
      - 'scripts/generate-seo-pages.mjs'
      - 'bengaluru.html'
      - '.github/workflows/seo-phase-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.html'
      - 'property-index.html'
      - 'property-details.html'
      - 'about.html'
      - 'ahmedabad.html'
      - 'sikar.html'
      - 'bengaluru.html'
      - 'chennai.html'
      - 'kota.html'
      - 'delhi.html'
      - 'patna.html'
      - 'jhunjhunu.html'
      - 'pune.html'
      - 'gurugram.html'
      - 'coimbatore.html'
      - 'lucknow.html'
      - 'hyderabad.html'
      - 'data/city-area-guides.json'
      - 'scripts/generate-city-area-guides.mjs'
      - 'jaipur.html'
      - 'scripts/generate-property-pages.mjs'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'city-hub.js'
      - 'js/property-seo-upgrade.js'
      - 'js/seo-location-entities.js'
      - '.github/workflows/seo-phase-validation.yml'

permissions:
  contents: read

jobs:
  seo-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test location intelligence registry
        run: node tests/location-intelligence-registry.test.cjs
      - name: Test SEO page eligibility and hysteresis
        run: node tests/seo-page-eligibility.test.mjs
      - name: Test SEO listing data normalization
        run: node tests/seo-listing-data.test.mjs
      - name: Check SEO generator syntax
        run: |
          node --check scripts/generate-property-pages.mjs
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/generate-sitemap.mjs
          node --check scripts/generate-city-area-guides.mjs
          node --check city-hub.js
          node --check js/property-seo-upgrade.js
          node --check js/seo-location-entities.js
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('property-details.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', source, re.I)
          inline=next((item for item in scripts if 'function loadSimilar(r)' in item), None)
          assert inline, 'Property detail inline application script not found'
          Path('/tmp/property-details-inline.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/property-details-inline.js

      - name: Regenerate property HTML from published listing data
        env:
          SUPABASE_URL: https://idurlccrarznnnqixxsd.supabase.co
          SUPABASE_KEY: sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFhT
          BASE_URL: https://studenthubhelp.in
        run: node scripts/generate-property-pages.mjs

      - name: Validate internal links, property HTML and schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import html as html_lib, json, re

          base='https://studenthubhelp.in/'
          home=Path('index.html').read_text(encoding='utf-8')
          visual=Path('sitemap.html').read_text(encoding='utf-8')
          directory=Path('property-index.html').read_text(encoding='utf-8')
          assert 'href="/explore-listings.html"' in home, 'Homepage is missing its public listings directory link'
          assert 'href="property-index.html"' in visual
          city_roots={
              'sikar':'sikar.html',
              'bengaluru':'bengaluru.html',
              'chennai':'chennai.html',
              'kota':'kota.html',
              'delhi':'delhi.html',
              'patna':'patna.html',
              'jhunjhunu':'jhunjhunu.html',
              'pune':'pune.html',
              'gurugram':'gurugram.html',
              'coimbatore':'coimbatore.html',
              'jaipur':'jaipur.html',
          }
          for city, page in city_roots.items():
              source=Path(page)
              city_page=Path(city)/'index.html'
              assert source.exists(), f'Missing legacy city alias: {page}'
              assert city_page.exists(), f'Missing canonical city hub: {city_page}'
              source_html=source.read_text(encoding='utf-8')
              page_html=city_page.read_text(encoding='utf-8')
              assert f'<link rel="canonical" href="{base}{city}/">' in page_html, f'City guide canonical mismatch: {city_page}'
              assert 'noindex' in source_html.lower(), f'Legacy city .html alias must be noindex: {page}'
              assert '<!-- STUDENT_CITY_STATIC_V2 -->' in page_html, f'City guide is missing the static HTML marker: {city_page}'
              assert 'mobile.css' not in page_html, f'City guide must not depend on mobile.css: {city_page}'
              assert page_html.count('class="service-section"') == 5, f'City guide must include all five static service sections: {city_page}'
              assert page_html.count('<details>') >= 8, f'City guide must include at least 8 visible FAQ answers: {city_page}'
              assert '"@type":"FAQPage"' in page_html and '"@type":"ItemList"' in page_html, f'City guide FAQ/ItemList schema missing: {city_page}'
              assert 'class="listing-card"' in page_html, f'City guide must include server-rendered listing cards: {city_page}'
              assert '...' not in page_html, f'City guide contains an ellipsis placeholder: {city_page}'
          all_city_slugs=['sikar','jaipur','jhunjhunu','kota','delhi','gurugram','bengaluru','patna','chennai','pune','coimbatore','lucknow','ahmedabad','hyderabad']
          for current in all_city_slugs:
              city_html=Path(current,'index.html').read_text(encoding='utf-8')
              for target in all_city_slugs:
                  assert f'href="/{target}/"' in city_html, f'{current} footer is missing {target} city link'
          assert '<link rel="canonical" href="https://studenthubhelp.in/property-index.html">' in directory
          assert re.search(r'<a href="https://studenthubhelp\.in/properties/', directory), 'Property directory has no crawlable property links'

          report=json.loads(Path('property-pages-manifest.json').read_text(encoding='utf-8'))
          assert report['total'] >= 600, f"Unexpected property count: {report['total']}"
          for category in ('hostel','tiffin','library','cafe','bookstore'):
              expected=report['byCategory'].get(category,0)
              pages=list(Path('properties',category).glob('*/index.html'))
              assert expected > 0 and len(pages) >= expected, f'{category}: generated page count mismatch'
              canonical_pages=[]
              for page in pages:
                  html=page.read_text(encoding='utf-8')
                  if 'id="seo-property-fallback"' not in html:
                      continue
                  canonical_pages.append(page)
                  assert 'id="canonicalLink" rel="canonical"' in html, f'Missing canonical: {page}'
                  robots_match=re.search(r"""<meta\s+name=["']robots["']\s+content=["']([^"']+)["']""", html, re.I)
                  assert robots_match and 'noindex' not in robots_match.group(1).lower(), f'Generated property page is not statically indexable: {page}'
                  assert 'index' in robots_match.group(1).lower(), f'Missing static index directive: {page}'
                  schema_tag='<script type="application/ld+json" id="baseSchema">'
                  schema_start=html.find(schema_tag)
                  assert schema_start >= 0, f'Missing base WebPage schema: {page}'
                  schema_start += len(schema_tag)
                  schema_end=html.find('</script>', schema_start)
                  assert schema_end >= 0, f'Unclosed base schema: {page}'
                  schema=json.loads(html[schema_start:schema_end])
                  assert schema.get('@type') == 'WebPage', f'Invalid base WebPage schema: {page}'
                  entity=schema.get('mainEntity')
                  assert isinstance(entity, dict), f'Missing static listing entity schema: {page}'
                  assert entity.get('@type') in {'LodgingBusiness','FoodEstablishment','Library','CafeOrCoffeeShop','BookStore','Thing'}, f'Invalid listing entity type: {page}'
                  assert entity.get('url','').startswith('https://studenthubhelp.in/properties/'), f'Listing schema URL is not canonical: {page}'
                  assert 'function setSEO(r)' in html, f'Missing dynamic listing SEO schema builder: {page}'
                  assert all(kind in html for kind in ('LodgingBusiness','FoodEstablishment','Library','CafeOrCoffeeShop','BookStore')), f'Missing category-specific schema types: {page}'
                  assert 'href="/property-index.html"' in html, f'Missing property directory link: {page}'
                  assert 'href="/"' in html, f'Missing homepage link: {page}'
                  assert 'href="' + {
                      'hostel':'/pg-finder.html',
                      'tiffin':'/tiffin-finder.html',
                      'library':'/library-finder.html',
                      'cafe':'/cafe-finder.html',
                      'bookstore':'/bookstore-finder.html'
                  }[category] + '"' in html, f'Missing category finder link: {page}'
                  title_match=re.search(r'<title>(.*?)</title>', html, re.I|re.S)
                  title_text=html_lib.unescape(title_match.group(1)) if title_match else ''
                  assert title_match and len(re.sub(r'\s+',' ',title_text).strip()) <= 60, f'Property title exceeds 60 characters: {page}'
              assert len(canonical_pages) >= expected, f'{category}: expected {expected} canonical pages with server-rendered summaries, found {len(canonical_pages)}'
          property_seo=Path('js/property-seo-upgrade.js').read_text(encoding='utf-8')
          finder_entities=Path('js/seo-location-entities.js').read_text(encoding='utf-8')
          property_template=Path('property-details.html').read_text(encoding='utf-8')
          property_generator=Path('scripts/generate-property-pages.mjs').read_text(encoding='utf-8')
          about_html=Path('about.html').read_text(encoding='utf-8')
          about_style=about_html.find('<style id="shh-about-single-design-system">')
          about_head_end=about_html.find('</head>')
          about_body_start=about_html.find('<body')
          assert 0 <= about_style < about_head_end < about_body_start, 'About page layout CSS must load in head before first paint'
          ahmedabad_html=Path('ahmedabad.html').read_text(encoding='utf-8')
          assert '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>' in ahmedabad_html, 'Ahmedabad city page Supabase SDK must be deferred'
          assert re.search(r'<script src="/?city-hub\.js" defer></script>', ahmedabad_html), 'Ahmedabad city page must keep city hub code deferred'
          assert 'function firstImageUrl(record)' in property_generator and 'const heroPreload = heroImage' in property_generator, 'Generated property pages must preload a known hero image'
          assert 'http-equiv="refresh" content="0;url=${escapeHtml(canonical)}"' in property_generator, 'Property alias redirects must include an immediate meta refresh'
          assert 'skeleton-title-text' in property_generator and '.skeleton-title-text{' in property_template, 'Property heading must render in the initial skeleton to reduce LCP and CLS'
          assert 'rel="preconnect" href="https://idurlccrarznnnqixxsd.supabase.co"' in property_template, 'Property page is missing the Supabase API preconnect'
          assert "loading=\"'+(index===0?'eager':'lazy')+'\"" in property_template, 'Only the primary property image should load eagerly'
          assert "rootMargin:'320px 0px'" in property_template and ".eq('city',r.city)" in property_template and ".eq('status','active')" in property_template and ".limit(300)" in property_template, 'Similar listings should be deferred and city-filtered'
          assert "properties/'+type+'/'+encodeURIComponent(prettySlug||slug)+'/'" in property_seo, 'Legacy slug URL is not canonicalized to its clean property URL'
          assert "document.getElementById('baseSchema')" in property_seo, 'Property schema normalizer is not connected to the actual baseSchema node'
          assert "properties/'+type+'/'+encodeURIComponent(slug)+'/'" in finder_entities, 'Finder ItemList must use clean canonical property URLs'
          print(f"SEO validation passed: {report['total']} property pages; category totals {report['byCategory']}")
          PY

      - name: Regenerate SEO directories and XML sitemap
        env:
          SUPABASE_URL: https://idurlccrarznnnqixxsd.supabase.co
          SUPABASE_KEY: sb_publishable_JIRAAdzm97xMNN1jIS_idg_oHEObFhT
          BASE_URL: https://studenthubhelp.in/
          SEO_LOCATION_MIN_PROPERTIES: 3
        run: |
          node scripts/generate-seo-pages.mjs
          node scripts/generate-city-area-guides.mjs
          node scripts/generate-sitemap.mjs

      - name: Validate generated SEO titles, descriptions and GEO answers
        run: |
          python - <<'PY'
          from pathlib import Path
          import html as html_lib, json, re

          pages=[]
          for page in Path('.').rglob('index.html'):
              if 'properties' in page.parts or '.git' in page.parts:
                  continue
              source=page.read_text(encoding='utf-8')
              if 'name="studenthubhelp-generated-seo"' not in source or 'name="description"' not in source:
                  continue
              title_match=re.search(r'<title>(.*?)</title>', source, re.I|re.S)
              desc_match=re.search(r'<meta name="description" content="([^"]*)"', source, re.I)
              assert title_match and desc_match, f'Missing title or description: {page}'
              title=html_lib.unescape(re.sub(r'\s+',' ',title_match.group(1)).strip())
              desc=html_lib.unescape(desc_match.group(1))
              assert len(title)<=60, f'Title exceeds 60 characters ({len(title)}): {page}'
              assert 110<=len(desc)<=160, f'Meta description outside 110–160 characters ({len(desc)}): {page}'
              canonical_match=re.search(r'<link rel="canonical" href="([^"]+)"',source,re.I)
              assert canonical_match, f'Missing canonical URL: {page}'
              schema_match=re.search(r'<script type="application/ld\+json">(.*?)</script>',source,re.I|re.S)
              assert schema_match, f'Missing CollectionPage JSON-LD: {page}'
              schema=json.loads(schema_match.group(1))
              assert schema.get('@type')=='CollectionPage', f'Invalid collection schema: {page}'
              items=schema.get('mainEntity',{})
              assert items.get('@type')=='ItemList' and items.get('numberOfItems',0)>=3, f'Missing listing ItemList: {page}'
              faq=schema.get('hasPart',{})
              assert faq.get('@type')=='FAQPage' and len(faq.get('mainEntity',[]))>=2, f'Missing FAQPage schema: {page}'
              visible=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',source,flags=re.I)
              visible=re.sub(r'<[^>]+>',' ',visible)
              words=re.findall(r'\b[\w-]+\b',html_lib.unescape(visible))
              assert len(words)>=100 and 'Quick answers' in source, f'Thin or missing visible GEO answer content: {page}'
              pages.append(page)
          assert len(pages)>=50, f'Expected at least 50 generated SEO pages, found {len(pages)}'
          area_data=json.loads(Path('data/city-area-guides.json').read_text(encoding='utf-8'))
          for city in area_data['cities']:
              for area in city['candidateAreas']:
                  guide=Path(city['slug'],'areas',area['slug'],'index.html')
                  assert guide.is_file(), f'Missing evidence-led area guide: {guide}'
                  html=guide.read_text(encoding='utf-8')
                  assert 'name="robots" content="noindex,follow"' in html, f'Area guide must remain noindex pending review: {guide}'
                  assert f'<link rel="canonical" href="https://studenthubhelp.in/{city["slug"]}/areas/{area["slug"]}/">' in html, f'Area guide canonical mismatch: {guide}'
                  assert 'Evidence and source links' in html and all(source in html for source in area['sourceUrls']), f'Area guide source evidence missing: {guide}'
                  assert 'No sample or placeholder property cards are shown' in html, f'Area guide must not fabricate listings: {guide}'
          redirects=Path('_redirects').read_text(encoding='utf-8') if Path('_redirects').exists() else ''
          start='# BEGIN STUDENTHUBHELP GENERATED SEO AREA REDIRECTS'
          end='# END STUDENTHUBHELP GENERATED SEO AREA REDIRECTS'
          assert start in redirects and end in redirects, 'Missing generated SEO area redirect block'
          block=redirects.split(start,1)[1].split(end,1)[0].strip().splitlines()
          for line in block:
              parts=line.split()
              assert len(parts)==3 and parts[2]=='301', f'Invalid area redirect: {line}'
              assert parts[0]!=parts[1], f'Self-redirect detected: {line}'
              target=Path(parts[1].strip('/'))
              if target.is_dir():
                  target=target/'index.html'
              assert target.exists(), f'Area redirect target does not exist: {line}'
          print(f'Generated SEO validation passed: {len(pages)} pages, bounded snippets, ItemList, visible FAQ answers and {len(block)} area redirect rules.')
          PY

      - name: Validate sitemap output
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import json, xml.etree.ElementTree as ET

          ns='http://www.sitemaps.org/schemas/sitemap/0.9'
          root=ET.parse('sitemap.xml').getroot()
          assert root.tag == f'{{{ns}}}sitemapindex'
          urls=[]
          for item in root.findall(f'{{{ns}}}sitemap'):
              loc=item.find(f'{{{ns}}}loc').text.strip()
              child=ET.parse(Path(urlparse(loc).path).name).getroot()
              assert child.tag == f'{{{ns}}}urlset'
              urls.extend(x.find(f'{{{ns}}}loc').text.strip() for x in child.findall(f'{{{ns}}}url'))
          assert len(urls)==len(set(urls)), 'Duplicate URL across sitemaps'
          assert 'https://studenthubhelp.in/' in urls
          assert 'https://studenthubhelp.in/property-index.html' in urls
          manifest=json.loads(Path('seo-generated-manifest.json').read_text(encoding='utf-8'))
          generated=manifest.get('generated',[])
          redirect_urls={'https://studenthubhelp.in'.rstrip('/')+item['from'] for item in manifest.get('redirectPages',[]) if item.get('from')}
          missing=[url for url in generated if url not in redirect_urls and url not in urls]
          assert not missing, 'Generated SEO URLs missing from sitemap: '+', '.join(missing[:10])
          assert not any(url in urls for url in redirect_urls), 'Noindex redirect URL found in sitemap'
          print(f'Sitemap validation passed: {len(urls)} unique URLs; {len(redirect_urls)} redirects excluded.')
          PY
