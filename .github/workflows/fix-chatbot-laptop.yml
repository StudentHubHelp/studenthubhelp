name: Fix chatbot laptop layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch desktop CSS only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ai-chatbot/public/widget.js')
          s = p.read_text()
          old = '@media(min-width:901px){#shh-chatbot-container.shh-expanded{right:16px!important;bottom:16px!important}#shh-chatbot-container.shh-expanded>div{width:min(760px,calc(100vw - 32px))!important;height:min(820px,calc(100vh - 32px))!important}}'
          new = '@media(min-width:901px){#shh-chatbot-container{right:20px!important;bottom:20px!important}#shh-chatbot-container>div{width:min(560px,calc(100vw - 40px))!important;height:min(78vh,680px)!important;max-height:calc(100vh - 40px)!important}#shh-chatbot-container.shh-expanded{right:16px!important;bottom:16px!important}#shh-chatbot-container.shh-expanded>div{width:min(720px,calc(100vw - 32px))!important;height:min(82vh,720px)!important;max-height:calc(100vh - 32px)!important}}'
          if old not in s:
              raise SystemExit('desktop CSS target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patched widget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-chatbot/public/widget.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: fit chatbot on laptop screens"
          git push
