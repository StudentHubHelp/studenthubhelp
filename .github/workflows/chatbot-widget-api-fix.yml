name: Fix Chatbot API Request Headers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatbot-widget-api-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove gateway auth headers from public chatbot request
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-chatbot/public/widget.js')
          s=p.read_text(encoding='utf-8')
          old="headers:{'Content-Type':'application/json','apikey':publicKey,'Authorization':`Bearer ${publicKey}`}"
          new="headers:{'Content-Type':'application/json'}"
          if old not in s:
              raise SystemExit('expected chatbot fetch header block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'StudentHubHelp'
          git config user.email 'studenthubhelp@users.noreply.github.com'
          git add ai-chatbot/public/widget.js
          git commit -m 'Fix chatbot public API request headers'
          git push
