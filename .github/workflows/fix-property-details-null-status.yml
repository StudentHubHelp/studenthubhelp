name: Fix property details null status
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch property-details.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('property-details.html')
          s=p.read_text(encoding='utf-8')
          old='.eq(lookupField,lookupValue).eq("status","active")'
          new='.eq(lookupField,lookupValue).or_("status.eq.active,status.is.null")'
          if old not in s:
              print('Target already fixed or not found; no change needed.')
              raise SystemExit(0)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add property-details.html
          git commit -m 'fix: allow property details for legacy null status'
          git push
