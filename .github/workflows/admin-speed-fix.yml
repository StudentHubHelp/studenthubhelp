name: Admin speed fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate All Properties fetch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('admin/src/components/PropertiesView.tsx')
          text = path.read_text(encoding='utf-8')

          start_marker = "  // All Property Listings must use the complete live Supabase dataset."
          end_marker = "  useEffect(() => setSelectedIds([])"
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)

          if start >= 0 and end > start:
              replacement = "  // The parent App already loads the complete paginated Supabase property dataset.\n  // Re-fetching all five property tables here caused a second, sequential network load.\n\n"
              text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding='utf-8')
              print('Removed duplicate All Properties fetch using primary markers.')
          else:
              pattern = re.compile(r"\n  useEffect\(\(\) => \{\n    let cancelled = false;\n    if \(categoryFilter !== 'all' \|\| statusFilter === 'pending'\) return;.*?\n  \}, \[categoryFilter, statusFilter\]\);\n", re.S)
              updated, count = pattern.subn("\n  // The parent App already loads the complete paginated Supabase property dataset.\n  // Re-fetching all five property tables here caused a second, sequential network load.\n\n", text, count=1)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  print('Removed duplicate All Properties fetch using fallback pattern.')
              else:
                  print('All Properties duplicate fetch is already removed; nothing to change.')

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'StudentHubHelp Performance Guard'
          git config user.email 'actions@github.com'
          git add admin/src/components/PropertiesView.tsx
          git rm .github/workflows/admin-speed-fix.yml
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'perf: remove duplicate admin property fetch'
          git push