<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Property / Listing - StudentHubHelp Sikar</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#040814', 900: '#081026', 850: '#0D1838', 800: '#14224D', 700: '#1F316B' },
                        gold: { 100: '#FFF7D6', 200: '#FDECB2', 300: '#F5DE88', 400: '#E6C65E', 500: '#D4AF37', 600: '#B89020', 700: '#8C6B10' }
                    },
                    fontFamily: { sans: ['Inter', 'Noto Sans Devanagari', 'sans-serif'], display: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        .gold-gradient-text { background: linear-gradient(135deg, #FFF7D6 0%, #D4AF37 50%, #B89020 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-gradient-bg { background: linear-gradient(135deg, #D4AF37 0%, #F5DE88 50%, #B89020 100%); }
        .gold-border-glow { border: 1px solid rgba(212, 175, 55, 0.25); box-shadow: 0 0 20px rgba(212, 175, 55, 0.06); }
    </style>
</head>
<body class="bg-navy-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-navy-950">

    <nav class="bg-navy-900 border-b border-gold-500/15 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
        <a href="./" class="flex items-center gap-3">
            <img src="logo.png" onerror="this.outerHTML='<div class=\'w-10 h-10 rounded-xl bg-gold-500 text-navy-950 font-display font-extrabold text-lg flex items-center justify-center\'>SH</div>'" class="w-10 h-10 rounded-xl object-cover border border-gold-500/40 shadow-md">
            <div>
                <span class="text-lg font-display font-bold gold-gradient-text">StudentHubHelp</span>
                <span class="block text-[10px] text-slate-400 uppercase font-semibold">Sikar Student Platform</span>
            </div>
        </a>
        <div class="flex items-center gap-3 text-xs">
            <a href="./" class="px-4 py-2 rounded-xl bg-navy-850 border border-gold-500/30 text-gold-300 hover:bg-gold-500/20 transition flex items-center gap-1.5 font-bold shadow-md">
                <i class="fa-solid fa-home"></i> Home
            </a>
        </div>
    </nav>

    <main class="max-w-3xl w-full mx-auto px-4 py-12 flex-1">
        <div class="bg-navy-900 border border-gold-500/40 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-8 gold-border-glow">
            
            <div class="text-center space-y-2">
                <span class="text-[11px] font-bold px-3 py-1 rounded-full uppercase border bg-gold-500/10 text-gold-300 border-gold-500/30">Owner Portal</span>
                <h1 class="text-2xl sm:text-3xl font-display font-bold text-white">Add Your Property in Sikar</h1>
                <p class="text-xs text-slate-400">List your Hostel, Tiffin Service, Library, or Cafe directly into the Supabase live database.</p>
            </div>

            <form id="addListingForm" onsubmit="submitListingData(event)" class="space-y-6 text-xs">
                
                <div class="space-y-1.5">
                    <label class="block text-gold-400 font-bold uppercase tracking-wide">Select Category <span class="text-red-400">*</span></label>
                    <select id="listingCategory" class="w-full bg-navy-850 border border-navy-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500 font-medium">
                        <option value="hostels">Hostel / PG (Boys & Girls)</option>
                        <option value="tiffins">Tiffin & Mess Service</option>
                        <option value="libraries">24/7 Study Library</option>
                        <option value="cafes">Student Cafe / Food Spot</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-gold-400 font-bold uppercase tracking-wide">Property / Business Name <span class="text-red-400">*</span></label>
                        <input type="text" id="listingName" required placeholder="e.g. Royal Hostel / Tapovan Library" class="w-full bg-navy-850 border border-navy-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-gold-400 font-bold uppercase tracking-wide">Sikar Area / Location <span class="text-red-400">*</span></label>
                        <select id="listingArea" required class="w-full bg-navy-850 border border-navy-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500">
                            <option value="Piprali Road">Piprali Road</option>
                            <option value="Nawalgarh Road">Nawalgarh Road</option>
                            <option value="Jat Colony">Jat Colony</option>
                            <option value="Radhakishan Pura">Radhakishan Pura</option>
                            <option value="Palwas Road">Palwas Road</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-gold-400 font-bold uppercase tracking-wide">Verified / Exact Address <span class="text-red-400">*</span></label>
                    <input type="text" id="listingAddress" required placeholder="e.g. Near Matrix Coaching, Piprali Road, Sikar" class="w-full bg-navy-850 border border-navy-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-gold-400 font-bold uppercase tracking-wide">Contact Number (WhatsApp) <span class="text-red-400">*</span></label>
                        <input type="tel" id="listingPhone" required placeholder="e.g. +91 9929718264" class="w-full bg-navy-850 border border-navy-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500 font-mono">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-gold-400 font-bold uppercase tracking-wide">Opening Hours / Timing</label>
                        <input type="text" id="listingExtraField" placeholder="e.g. 24/7 Open or 07:00 AM - 09:00 PM" class="w-full bg-navy-850 border border-navy-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="block text-gold-400 font-bold uppercase tracking-wide">Facilities / Menu / Speciality</label>
                    <textarea id="listingFacilities" rows="3" placeholder="e.g. RO Water, Wi-Fi, AC/Cooler, Mess facility available" class="w-full bg-navy-850 border border-navy-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500 resize-none"></textarea>
                </div>

                <div id="formAlertBox" class="hidden p-4 rounded-xl text-center font-bold text-xs"></div>

                <button type="submit" id="submitBtn" class="w-full py-4 gold-gradient-bg text-navy-950 font-bold text-sm rounded-xl shadow-xl hover:brightness-110 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Publish Listing to Supabase Database
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-navy-900 border-t border-navy-800 py-6 text-slate-500 text-xs text-center">
        <p>© 2026 StudentHubHelp (Shekhawati). Director: Satpal Swami (+91 99297 18264)</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://idurlccrarznnnqixxsd.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdXJsY2NyYXJ6bm5ucWl4eHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODY3NTgsImV4cCI6MjEwMzU2Mjc1OH0.pq_rza98twL-SETqm_6TGNzsPCkVJxwjocFUeLB1yMA";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function submitListingData(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('formAlertBox');
            
            const category = document.getElementById('listingCategory').value;
            const name = document.getElementById('listingName').value.trim();
            const area = document.getElementById('listingArea').value;
            const address = document.getElementById('listingAddress').value.trim();
            const phone = document.getElementById('listingPhone').value.trim();
            const extraField = document.getElementById('listingExtraField').value.trim();
            const facilities = document.getElementById('listingFacilities').value.trim();

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving to Supabase...`;

            try {
                let payload = {};

                if(category === 'hostels') {
                    payload = {
                        "Hostel Name (Supplied)": name,
                        "Category": "Hostel/PG",
                        "Verified / Live Address": `${address}, ${area}`,
                        "Contact (Verified)": phone,
                        "Google/Maps Rating": "5.0",
                        "Review Count": "1",
                        "Facilities": facilities || "Verified Student Hostel",
                        "image": "hostel-banner.png"
                    };
                } else if(category === 'tiffins') {
                    payload = {
                        "Supplied Name": name,
                        "Category": "Tiffin Service",
                        "Area": area,
                        "Verified / Live Address": address,
                        "Supplied Phone": phone,
                        "Opening Hours": extraField || "07:00 AM - 09:00 PM",
                        "Live Rating": "5.0",
                        "Review Count": "1",
                        "image": "tiffin-banner.png"
                    };
                } else if(category === 'libraries') {
                    payload = {
                        "Supplied Name": name,
                        "Category": "Study Library",
                        "Area": area,
                        "Verified / Live Address": address,
                        "Supplied Phone": phone,
                        "Opening Hours": extraField || "24/7 Open",
                        "Live Rating": "5.0",
                        "Review Count": "1",
                        "image": "library-banner.png"
                    };
                } else if(category === 'cafes') {
                    payload = {
                        "Name": name,
                        "Public/Exact Address": `${address}, ${area}`,
                        "Google Rating": 5.0,
                        "Review Count": 1,
                        "Food Details": facilities || "Student Cafe Snacks & Beverages",
                        "Opening Hours": extraField || "09:00 AM - 09:00 PM",
                        "Contact": phone,
                        "image": "cafe-banner.png"
                    };
                }

                const { error } = await supabaseClient
                    .from(category)
                    .insert([payload]);

                if (error) throw error;

                alertBox.className = "p-4 rounded-xl text-center font-bold text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Success! Your property has been published live in Supabase.`;
                alertBox.classList.remove('hidden');
                
                document.getElementById('addListingForm').reset();
                setTimeout(() => alertBox.classList.add('hidden'), 6000);

            } catch (err) {
                console.error(err);
                alertBox.className = "p-4 rounded-xl text-center font-bold text-xs bg-red-500/20 text-red-300 border border-red-500/30";
                alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Error: ${err.message}`;
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publish Listing to Supabase Database`;
            }
        }
    </script>
</body>
</html>
