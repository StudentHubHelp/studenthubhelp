<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Your Property / Tiffin / Library Free | StudentHub</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#040814', 900: '#081026', 850: '#0D1838', 800: '#14224D', 700: '#1F316B' },
                        gold: { 100: '#FFF7D6', 200: '#FDECB2', 300: '#F5DE88', 400: '#E6C65E', 500: '#D4AF37', 600: '#B89020', 700: '#8C6B10' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        .gold-gradient-text { background: linear-gradient(135deg, #FFF7D6 0%, #D4AF37 50%, #B89020 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-gradient-bg { background: linear-gradient(135deg, #D4AF37 0%, #F5DE88 50%, #B89020 100%); }
        .gold-border-glow { border: 1px solid rgba(212, 175, 55, 0.25); box-shadow: 0 0 15px rgba(212, 175, 55, 0.05); }
    </style>
</head>
<body class="bg-navy-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <nav class="bg-navy-900 border-b border-gold-500/15 py-4 px-6 flex justify-between items-center">
        <a href="./" class="flex items-center gap-3">
            <img src="logo.png" onerror="this.outerHTML='<div class=\'w-10 h-10 rounded-xl bg-gold-500 text-navy-950 font-bold flex items-center justify-center\'>SH</div>'" class="w-10 h-10 rounded-xl object-cover border border-gold-500/40">
            <span class="text-xl font-display font-bold gold-gradient-text">StudentHub</span>
        </a>
        <a href="./" class="text-xs px-3.5 py-2 rounded-xl bg-navy-850 border border-gold-500/30 text-gold-300">← Back to Home</a>
    </nav>

    <main class="max-w-2xl w-full mx-auto px-4 py-10 flex-1">
        <div class="bg-navy-850 rounded-3xl p-6 sm:p-8 gold-border-glow shadow-2xl space-y-6">
            <div>
                <span class="text-xs font-bold text-gold-400 uppercase tracking-wider">Free Business Listing</span>
                <h1 class="text-2xl font-display font-bold text-white mt-1">List Your Hostel, Tiffin or Library</h1>
                <p class="text-xs text-slate-400 mt-1">Get verified direct student inquiries. Zero brokerage commission.</p>
            </div>

            <form id="addListingForm" class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-300 mb-1.5 font-bold">1. Select Business Category *</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer"><input type="radio" name="businessCat" value="Hostel" checked class="peer sr-only" onchange="toggleCategoryFields()"><div class="p-3 rounded-xl bg-navy-900 border border-navy-700 peer-checked:border-gold-500 peer-checked:bg-gold-500/10 text-center font-bold text-white"><i class="fa-solid fa-hotel block mb-1 text-gold-400"></i> Hostel / PG</div></label>
                        <label class="cursor-pointer"><input type="radio" name="businessCat" value="Tiffin" class="peer sr-only" onchange="toggleCategoryFields()"><div class="p-3 rounded-xl bg-navy-900 border border-navy-700 peer-checked:border-gold-500 peer-checked:bg-gold-500/10 text-center font-bold text-white"><i class="fa-solid fa-bowl-food block mb-1 text-gold-400"></i> Tiffin Center</div></label>
                        <label class="cursor-pointer"><input type="radio" name="businessCat" value="Library" class="peer sr-only" onchange="toggleCategoryFields()"><div class="p-3 rounded-xl bg-navy-900 border border-navy-700 peer-checked:border-gold-500 peer-checked:bg-gold-500/10 text-center font-bold text-white"><i class="fa-solid fa-landmark block mb-1 text-gold-400"></i> 24/7 Library</div></label>
                    </div>
                </div>

                <div><label class="block text-slate-300 mb-1">Business Name *</label><input type="text" id="propName" required placeholder="e.g. Shyam Boys PG & Hostel" class="w-full bg-navy-900 border border-navy-700 rounded-xl px-4 py-2.5 text-white"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-slate-300 mb-1">Owner Name *</label><input type="text" id="ownerName" required placeholder="Full Name" class="w-full bg-navy-900 border border-navy-700 rounded-xl px-4 py-2.5 text-white"></div>
                    <div><label class="block text-slate-300 mb-1">WhatsApp / Phone Number *</label><input type="tel" id="propPhone" required placeholder="e.g. 9929718264" class="w-full bg-navy-900 border border-navy-700 rounded-xl px-4 py-2.5 text-white"></div>
                </div>
                <div><label class="block text-slate-300 mb-1">Address / Landmark in Sikar *</label><input type="text" id="propAddress" required placeholder="e.g. Near Matrix Academy, Piprali Road" class="w-full bg-navy-900 border border-navy-700 rounded-xl px-4 py-2.5 text-white"></div>

                <div id="hostelFields" class="space-y-3">
                    <label class="block text-slate-300 mb-1">Hostel Facilities & Sharing</label>
                    <textarea id="hostelFacilities" rows="2" placeholder="e.g. WiFi, AC Rooms, RO Water, 3-Time Satvik Food, Inverter Backup" class="w-full bg-navy-900 border border-navy-700 rounded-xl px-4 py-2.5 text-white"></textarea>
                </div>

                <div id="tiffinFields" class="hidden space-y-3">
                    <label class="block text-slate-300 mb-1">Daily Meal Menu & Delivery Area</label>
                    <textarea id="tiffinMenu" rows="2" placeholder="e.g. सुबह 4 रोटी, दाल, मौसमी सब्जी, चावल | शाम 4 रोटी, पनीर/कढ़ी" class="w-full bg-navy-900 border border-navy-700 rounded-xl px-4 py-2.5 text-white"></textarea>
                </div>

                <div id="libraryFields" class="hidden space-y-3">
                    <label class="block text-slate-300 mb-1">Library Shift Timings & Facilities</label>
                    <textarea id="libraryFacilities" rows="2" placeholder="e.g. 24/7 AC, 100 Mbps WiFi, Reserved Seat Cabins, RO Water" class="w-full bg-navy-900 border border-navy-700 rounded-xl px-4 py-2.5 text-white"></textarea>
                </div>

                <button type="submit" class="w-full py-3.5 gold-gradient-bg text-navy-950 font-bold text-sm rounded-xl hover:brightness-110 shadow-xl flex items-center justify-center gap-1.5 mt-2">
                    <i class="fa-solid fa-paper-plane"></i> Submit Listing for Verification
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-navy-950 border-t border-navy-900 py-6 text-slate-500 text-xs text-center">
        <p>© 2026 StudentHub (Shekhawati). Director: Satpal Swami (+91 99297 18264)</p>
    </footer>

    <script>
        function toggleCategoryFields() {
            const cat = document.querySelector('input[name="businessCat"]:checked').value;
            document.getElementById('hostelFields').classList.toggle('hidden', cat !== 'Hostel');
            document.getElementById('tiffinFields').classList.toggle('hidden', cat !== 'Tiffin');
            document.getElementById('libraryFields').classList.toggle('hidden', cat !== 'Library');
        }

        document.getElementById('addListingForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const cat = document.querySelector('input[name="businessCat"]:checked').value;
            const name = document.getElementById('propName').value.trim();
            const owner = document.getElementById('ownerName').value.trim();
            const phone = document.getElementById('propPhone').value.trim();
            const address = document.getElementById('propAddress').value.trim();

            const message = `*New Listing Request on StudentHub*%0A*Category:* ${cat}%0A*Business Name:* ${name}%0A*Owner:* ${owner}%0A*Phone:* ${phone}%0A*Address:* ${address}`;
            window.open(`https://wa.me/919929718264?text=${message}`, '_blank');
            alert('Your listing details have been routed to Director Satpal Swami for verification!');
        });
    </script>
</body>
</html>
