<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#25143b">
  <title>Page Not Found | StudentHubHelp</title>
  <meta name="description" content="The page you are looking for could not be found. Explore StudentHubHelp to discover student accommodation and local services.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StudentHubHelp">
  <meta property="og:title" content="Page Not Found | StudentHubHelp">
  <meta property="og:description" content="This page could not be found. Continue exploring StudentHubHelp.">
  <meta property="og:image" content="https://studenthubhelp.in/logo.png">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#5b315f 0,transparent 35%),linear-gradient(135deg,#160f2b,#29163e 58%,#40213f);color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .not-found{width:min(680px,100%);padding:clamp(28px,6vw,58px);border:1px solid rgba(255,255,255,.17);border-radius:28px;background:rgba(255,255,255,.09);box-shadow:0 28px 90px rgba(0,0,0,.28);text-align:center;backdrop-filter:blur(18px)}
    .brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:30px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.2px}.brand img{width:48px;height:48px;object-fit:contain;border-radius:12px;background:#fff}
    .code{font-size:clamp(64px,14vw,112px);line-height:.95;font-weight:900;letter-spacing:-.07em;color:#f0c978}.eyebrow{margin:20px 0 8px;color:#f5dca6;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    h1{margin:0;font-size:clamp(25px,5vw,38px)}p{max-width:470px;margin:14px auto 26px;color:#e4dbea;line-height:1.7}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.actions a{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 20px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:800}.primary{background:#f0c978;color:#281832}.secondary{border:1px solid rgba(255,255,255,.32);color:#fff}
    @media(max-width:420px){body{padding:14px}.not-found{border-radius:22px}.actions a{width:100%}}
  </style>
  <script>
    (function () {
      // Keep the existing generated-property fallback route working.
      var parts = location.pathname.split('/').filter(Boolean);
      var allowed = ['hostel', 'tiffin', 'library', 'cafe', 'bookstore'];
      if (parts.length === 3 && parts[0] === 'properties') {
        var type = String(parts[1] || '').toLowerCase();
        var slug;
        try { slug = decodeURIComponent(parts[2]); } catch (_) { slug = parts[2]; }
        if (allowed.indexOf(type) !== -1 && slug) {
          location.replace('/property-details.html?type=' + encodeURIComponent(type) +
            '&slug=' + encodeURIComponent(slug) + '&fallback=1');
        }
      }
    })();
  </script>
</head>
<body>
  <main class="not-found">
    <a class="brand" href="/"><img src="/logo.png" alt="StudentHubHelp logo"><span>StudentHubHelp</span></a>
    <div class="code" aria-hidden="true">404</div>
    <div class="eyebrow">Lost in your student journey?</div>
    <h1>This page could not be found.</h1>
    <p>The link may be outdated, or the page may have moved. You can return home or search for hostels, PGs, tiffin services, libraries, cafes and bookstores.</p>
    <div class="actions">
      <a class="primary" href="/">Go to Homepage</a>
      <a class="secondary" href="/global-search.html">Search Services</a>
      <a class="secondary" href="/contact-us.html">Contact Support</a>
    </div>
  </main>
</body>
</html>
