<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Redirecting | StudentHubHelp</title>
  <link rel="icon" href="/logo.png">
  <script>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var allowed = ['hostel', 'tiffin', 'library', 'cafe', 'bookstore'];
    if (parts.length === 3 && parts[0] === 'properties') {
      var type = String(parts[1] || '').toLowerCase();
      var slug;
      try { slug = decodeURIComponent(parts[2]); } catch (_) { slug = parts[2]; }
      if (allowed.indexOf(type) !== -1 && slug) {
        var target = '/property-details.html?type=' + encodeURIComponent(type) +
          '&slug=' + encodeURIComponent(slug) + '&fallback=1';
        location.replace(target);
        return;
      }
    }
    location.replace('/');
  })();
  </script>
</head>
<body><p>Redirecting to StudentHubHelp… <a href="/">Go to homepage</a></p></body>
</html>
