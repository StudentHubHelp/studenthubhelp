<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner Dashboard | StudentHubHelp</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="logo.png"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#06162b;color:#fff}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{width:42px;height:42px;background:#fff;border-radius:11px;padding:3px}.btn{border:1px solid rgba(214,168,79,.3);background:rgba(214,168,79,.08);color:#f0d48a;border-radius:11px;padding:10px 14px;font-size:11px;font-weight:900;cursor:pointer}.hero{padding:30px;border:1px solid rgba(214,168,79,.24);border-radius:24px;background:linear-gradient(145deg,#0d2a4d,#081b34);margin-bottom:18px}.ey{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#f0d48a;font-weight:900}.hero h1{font:700 38px Georgia,serif;margin:9px 0}.muted{color:#aebed2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.card{padding:20px;border:1px solid #ffffff12;border-radius:18px;background:#0b2342}.num{font-size:25px;font-weight:900;margin-top:8px}.label{font-size:10px;color:#8498b2;font-weight:800}.main{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.activity{display:flex;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #ffffff0d}.activity:last-child{border-bottom:0}.status{font-size:9px;font-weight:900;text-transform:uppercase;color:#f0d48a}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;border:1px solid #ffffff14;background:#06162b;color:#fff;border-radius:10px;padding:11px;font:inherit;font-size:11px}.form textarea{min-height:90px}.msg{font-size:11px;padding:10px;border-radius:9px;display:none}.msg.show{display:block}.ok{background:#064e3b;color:#a7f3d0}.err{background:#450a0a;color:#fecaca}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="index.html"><img src="logo.png">StudentHubHelp</a><button id="logout" class="btn">Logout</button></div><section class="hero"><div class="ey">Partner Dashboard</div><h1 id="welcome">Welcome, Partner</h1><div id="territory" class="muted">Loading your territory…</div></section><div id="cards" class="grid"></div><div class="main"><section class="card"><div class="ey">Local Contributions</div><h2 style="margin:8px 0 4px;font-size:19px">Property & Community Leads</h2><p class="muted">Submit useful local information. Admin review is required before publication.</p><form id="activity" class="form"><select name="activity_type" required><option value="property_lead">Property Lead</option><option value="student_outreach">Student Outreach</option><option value="local_update">Local Information Update</option></select><input name="title" placeholder="Activity title" required><input name="area" placeholder="Area / locality"><textarea name="description" placeholder="Describe the property lead, local update or outreach activity" required></textarea><div id="msg" class="msg"></div><button class="btn" type="submit">Submit for Admin Review</button></form><div id="list" style="margin-top:20px"></div></section><aside class="card"><div class="ey">My Territory</div><h2 style="font:700 25px Georgia,serif;margin:9px 0">Assigned Coverage</h2><div id="details" class="muted">Loading…</div><div style="margin-top:22px;padding-top:18px;border-top:1px solid #ffffff0d"><div class="ey">Partner Status</div><div id="status" style="font-weight:900;margin-top:7px">—</div></div></aside></div></div><script>const URL='https://idurlccrarznnnqixxsd.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdXJsY2NyYXJ6bm5uaXh0eHNkIiwicm9sZSI6ImFub24iIsImlhdCI6MTc4Nzk4Njc1OCwiZXhwIjoyMTAzNTYyNzU4fQ.pq_rza98twL-SETqm_6TGNzsPCkVJxwjocFUeLB1yMA';const db=window.supabase.createClient(URL,KEY);let partner=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const{data:{user}}=await db.auth.getUser();if(!user){location.replace('auth.html');return}const{data:p,error}=await db.from('profiles').select('id,role,full_name,email,phone').eq('id',user.id).maybeSingle();if(error||p?.role!=='partner'){await db.auth.signOut({scope:'local'});location.replace('auth.html');return}const{data:pp}=await db.from('partner_profiles').select('*').eq('user_id',user.id).maybeSingle();if(!pp){document.getElementById('welcome').textContent='Partner profile pending';return}partner=pp;document.getElementById('welcome').textContent='Welcome, '+esc(pp.full_name);document.getElementById('territory').textContent=[pp.city,pp.district,pp.state].filter(Boolean).join(' · ');document.getElementById('details').innerHTML='<b>'+esc(pp.partner_level||'city')+' partner</b><br><br>'+esc((pp.areas||[]).join(', ')||'Assigned areas will appear here.') ;document.getElementById('status').textContent=String(pp.status||'active').toUpperCase();document.getElementById('cards').innerHTML=[['properties_discovered','Properties Discovered'],['approved_listings','Approved Listings'],['students_reached','Students Reached'],['active_areas','Active Areas']].map(x=>'<div class="card"><div class="label">'+x[1]+'</div><div class="num">'+Number(pp[x[0]]||0).toLocaleString('en-IN')+'</div></div>').join('');await loadActivities()}async function loadActivities(){const{data}=await db.from('partner_activity').select('*').eq('partner_id',partner.id).order('created_at',{ascending:false}).limit(20);document.getElementById('list').innerHTML=(data||[]).length?(data||[]).map(a=>'<div class="activity"><div><b style="font-size:12px">'+esc(a.title)+'</b><div class="muted">'+esc(a.description)+'</div></div><span class="status">'+esc(a.status)+'</span></div>').join(''):'<div class="muted">No contributions yet.</div>'}document.getElementById('activity').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),d=Object.fromEntries(fd.entries());const m=document.getElementById('msg');try{const{error}=await db.from('partner_activity').insert({partner_id:partner.id,activity_type:d.activity_type,title:d.title,area:d.area,city:partner.city,district:partner.district,state:partner.state,description:d.description});if(error)throw error;f.reset();m.textContent='Submitted successfully. Admin review is required.';m.className='msg show ok';await loadActivities()}catch(x){m.textContent=x?.message||'Submission failed.';m.className='msg show err'}};document.getElementById('logout').onclick=async()=>{await db.auth.signOut({scope:'local'});location.replace('auth.html')};init();</script></body></html>
