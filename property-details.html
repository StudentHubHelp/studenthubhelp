  /* =========================

   ========================= */

function seoText(value, fallback=''){
  const text=String(value??fallback)
    .replace(/\s+/g,' ')
    .trim();

  return text;
}

function seoClean(value){
  return seoText(value).replace(/[<>]/g,'');
}

function updatePropertySEO(r){
  const name=seoClean(r.name||r.service_name||'Property');
  const city=seoClean(r.city||'India');
  const area=seoClean(r.area||'');
  const description=seoClean(
    r.description ||
    `View detailed information about ${name} in ${area||city} on StudentHubHelp.`
  );

  const typeName={
    hostel:'Hostel / PG',
    tiffin:'Tiffin Service',
    cafe:'Cafe',
    library:'Library',
    bookstore:'Bookstore'
  }[type]||'Property';

  const locationText=[area,city].filter(Boolean).join(', ');

  const titleParts=[
    name,
    locationText,
    typeName,
    'StudentHubHelp'
  ].filter(Boolean);

  const seoTitle=titleParts.join(' | ');

  const seoDescription=(
    `${name} ${typeName} in ${locationText||'India'}. `+
    `${description}`
  ).slice(0,160);

  const canonicalUrl=location.href;

  document.title=seoTitle;

  const setMeta=(id,content)=>{
    const el=document.getElementById(id);
    if(el) el.setAttribute('content',content);
  };

  setMeta('ogTitle',seoTitle);
  setMeta('ogDescription',seoDescription);
  setMeta('ogUrl',canonicalUrl);
  setMeta('twitterTitle',seoTitle);
  setMeta('twitterDescription',seoDescription);

  const imageUrl=new URL(
    r.image||cfg.banner,
    location.href
  ).href;

  setMeta('ogImage',imageUrl);
  setMeta('twitterImage',imageUrl);

  const canonical=document.getElementById('canonicalLink');
  if(canonical) canonical.href=canonicalUrl;

  /* =========================
   PHASE 4 - LOCAL SEO SIGNALS
   ========================= */

const localityParts=[
  r.area,
  r.city,
  r.district,
  r.state
]
.filter(Boolean)
.map(v=>seoClean(v));

const localityText=[
  ...new Set(localityParts)
].join(', ');

const localSeoDescription=(
  `${name} ${typeName} in ${localityText||'India'}. `+
  `${description}`
).slice(0,160);

setMeta('ogDescription',localSeoDescription);
setMeta('twitterDescription',localSeoDescription);
  
  /* -------- JSON-LD -------- */

  const schema={
    "@context":"https://schema.org",
    "@graph":[
      {
        "@type":"WebPage",
        "@id":canonicalUrl+"#webpage",
        "url":canonicalUrl,
        "name":seoTitle,
        "description":seoDescription,
        "isPartOf":{
          "@type":"WebSite",
          "name":"StudentHubHelp",
          "url":"https://studenthubhelp.github.io/studenthubhelp/"
        },
        "breadcrumb":{

        }
      },

        "@type":"BreadcrumbList",
        "@id":canonicalUrl+"#breadcrumb",
        "itemListElement":[
          {
            "@type":"ListItem",
            "position":1,
            "name":"Home",
            "item":"https://studenthubhelp.github.io/studenthubhelp/"
          },
          {
            "@type":"ListItem",
            "position":2,
            "name":typeName,
            "item":new URL(
              type==='hostel'?'pg-finder.html':
              type==='tiffin'?'tiffin-finder.html':
              type==='library'?'library-finder.html':
              type==='cafe'?'cafe-finder.html':
              'bookstore-finder.html',
              location.href
            ).href
          },
          {
            "@type":"ListItem",
            "position":3,
            "name":name,
            "item":canonicalUrl
          }
        ]
      }
    ]
  };

  /*
   * LocalBusiness schema only when actual business/property
   * information exists.
   */
  const hasAddress=Boolean(
    r.address||r.area||r.city||r.pincode
  );

  if(hasAddress){
    const business={
  "@type":"LocalBusiness",

  "url":canonicalUrl,

};

function niceKey(k){return k.replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase())}
function show(v){if(v===null||v===undefined||v==='')return '<span class="muted">Coming Soon</span>';if(typeof v==='boolean')return v?'<span class="yes">Yes</span>':'<span class="no">No</span>';if(Array.isArray(v))return v.length?v.map(x=>esc(x)).join(', '):'<span class="muted">Coming Soon</span>';return esc(v)}
function field(label,v){
  if(v===null||v===undefined||v==='') return '';
  if(Array.isArray(v)&&v.length===0) return '';
  return `<div class="item"><div class="label">${esc(label)}</div><div class="value">${show(v)}</div></div>`;
}
function pills(v){
  if(v===null||v===undefined||v==='') return '';
  let a=Array.isArray(v)?v:String(v).split(',').map(x=>x.trim()).filter(Boolean);
  if(!a.length) return '';
  return `<div class="facilities">${a.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`;
}
function normalizeBool(v){
  if(typeof v === 'boolean') return v;
  if(v === null || v === undefined || v === '') return null;
  const x=String(v).trim().toLowerCase();
  if(['true','yes','y','1','available','active','verified'].includes(x)) return true;
  if(['false','no','n','0','unavailable','inactive','not verified'].includes(x)) return false;
  return null;
}
function getVerification(r){
  const explicit =
    normalizeBool(r.verified) ??
    (String(r.verification_status||'').toLowerCase()==='verified' ? true :
     String(r.verification_status||'').toLowerCase()==='not verified' ? false : null);
  if(explicit !== null) return explicit;
  return String(r.status||'').toLowerCase()==='verified';
}
function completenessScore(r){

    r.name||r.service_name,

}

      localStorage.setItem(

      );

async function submitClaim(event){

  event.preventDefault();

  if(!currentProperty){
    return;
  }

  const btn=document.getElementById('claimSubmitBtn');
  const message=document.getElementById('claimMessageBox');

  const ownerName=
    document.getElementById('claimOwnerName').value.trim();

  const ownerPhone=
    document.getElementById('claimOwnerPhone').value.trim();

  const claimMessage=
    document.getElementById('claimMessage').value.trim();

  message.className='claim-message';
  message.textContent='';

  if(!ownerName || !ownerPhone){

    message.className='claim-message error';
    message.textContent='Name and phone number are required.';
    return;
  }

  btn.disabled=true;
  btn.innerHTML=
    '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

  try{

    const {
      data:{
        user
      }
    }=await db.auth.getUser();

    if(!user){

      throw new Error('Please login before submitting a claim.');
    }

    const propertyType=getClaimPropertyType();

    const propertyId=getClaimPropertyId(currentProperty);

    const {
      error
    }=await db
      .from('claim_requests')
      .insert({
        property_id:propertyId,
        property_type:propertyType,
        owner_id:user.id,
        owner_name:ownerName,
        owner_phone:ownerPhone,
        message:claimMessage || null,
        status:'pending'
      });

    if(error){

      if(
        error.code==='23505' ||
        String(error.message||'')
          .toLowerCase()
          .includes('duplicate')
      ){

        throw new Error(
          'A pending ownership request already exists for this listing.'
        );
      }

      throw error;
    }

    message.className='claim-message success';

    message.textContent=
      'Ownership request submitted successfully. Admin approval is required.';

    btn.innerHTML=
      '<i class="fa-solid fa-check"></i> Request Submitted';

    setTimeout(()=>{

      closeClaimModal();

    },1800);

  }catch(error){

    console.error('Claim submission error:',error);

    message.className='claim-message error';
    message.textContent=
      error.message ||
      'Unable to submit ownership request. Please try again.';

    btn.disabled=false;

    btn.innerHTML=
      '<i class="fa-solid fa-paper-plane"></i> Submit Ownership Request';
  }
}

function similarityScore(current,x){
  let score=0;
  const sameCity=current.city&&x.city&&String(current.city).trim().toLowerCase()===String(x.city).trim().toLowerCase();
  const sameArea=current.area&&x.area&&String(current.area).trim().toLowerCase()===String(x.area).trim().toLowerCase();
  if(sameCity)score+=45;
  if(sameArea)score+=30;
  const a=priceNumber(current),b=priceNumber(x);
  if(a&&b){
    const diff=Math.abs(a-b)/Math.max(a,b);
    score+=Math.max(0,25-Math.round(diff*25));
  }else if(!a&&!b)score+=8;
  return score;
}
async function loadSimilarProperties(r){
  const box=document.getElementById('similarProperties');
  if(!box)return;
  try{
    let q=db.from(cfg.table).select('id,slug,name,image,area,city,price,monthly_fee,rating,verified,status').eq('status', 'active').limit(80);
    if(r.city)q=q.eq('city',r.city);
    const {data,error}=await q;
    if(error)throw error;
    const rows=(data||[])
      .filter(x=>String(x.id??'')!==String(r.id??'') && String(x.slug??'')!==String(r.slug??''))
      .map(x=>({...x,_score:similarityScore(r,x)}))
      .sort((a,b)=>b._score-a._score)
      .slice(0,10);
    if(!rows.length){
      box.innerHTML='<div class="empty-state">Similar listings will appear here as more real listings become available.</div>';
      return;
    }
    box.innerHTML=`
      <div class="similar-wrap">
        <div class="similar-track" id="similarTrack">
          ${rows.map(x=>{
            const nm=x.name||x.service_name||'Property';
            const href=`property-details.html?type=${encodeURIComponent(type)}&slug=${encodeURIComponent(x.slug||x.id||'')}`;
            const pr=priceValue(x);
            const match=x.area&&r.area&&String(x.area).toLowerCase()===String(r.area).toLowerCase()
              ?'Same area'
              :'Same city';
            return `<a class="similar-card" href="${esc(href)}">
              <img class="similar-img" src="${esc(x.image||cfg.banner)}" alt="${esc(nm)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${esc(cfg.banner)}'">
              <div class="similar-body">
                <div class="similar-name">${esc(nm)}</div>
                <div class="similar-meta">${esc([x.area,x.city].filter(Boolean).join(' • ')||'Location available')}</div>
                ${pr?`<div class="similar-price">${esc(pr)}</div>`:''}
                <span class="similar-match">${esc(match)} • Similar option</span>
              </div>
            </a>`;
          }).join('')}
        </div>
        <div class="carousel-controls" style="margin-top:4px">
          <button type="button" class="carousel-btn" id="similarPrev" aria-label="Previous similar properties">←</button>
          <button type="button" class="carousel-btn" id="similarNext" aria-label="Next similar properties">→</button>
        </div>
      </div>`;
    const track=document.getElementById('similarTrack');
    document.getElementById('similarPrev')?.addEventListener('click',()=>track?.scrollBy({left:-280,behavior:'smooth'}));
    document.getElementById('similarNext')?.addEventListener('click',()=>track?.scrollBy({left:280,behavior:'smooth'}));

// Continuous auto-carousel: duplicate the real cards so the carousel
// loops endlessly without requiring manual left/right scrolling.
if(track && rows.length > 1){
  const cards=[...track.children];
  cards.forEach(card=>track.appendChild(card.cloneNode(true)));
  let paused=false;
  const getStep=()=>{
    const card=track.querySelector('.similar-card');
    if(!card)return 280;
    const gap=parseFloat(getComputedStyle(track).gap)||13;
    return card.getBoundingClientRect().width+gap;
  };
  const loopWidth=()=>track.scrollWidth/2;
  const tick=()=>{
    if(paused)return;
    const target=track.scrollLeft+getStep();
    const half=loopWidth();
    if(target>=half){
      track.scrollTo({left:target-half,behavior:'auto'});
      requestAnimationFrame(()=>track.scrollBy({left:getStep(),behavior:'smooth'}));
    }else{
      track.scrollBy({left:getStep(),behavior:'smooth'});
    }
  };
  track.addEventListener('mouseenter',()=>paused=true);
  track.addEventListener('mouseleave',()=>paused=false);
  track.addEventListener('touchstart',()=>paused=true,{passive:true});
  track.addEventListener('touchend',()=>paused=false,{passive:true});
  window.addEventListener('resize',()=>{ if(track.scrollLeft>=loopWidth()) track.scrollTo({left:track.scrollLeft-loopWidth(),behavior:'auto'}); });
  setInterval(tick,2600);
}
  }catch(e){
    console.warn('Similar properties load failed:',e);
    box.innerHTML='<div class="empty-state">Similar listings are unavailable right now.</div>';
  }
}
