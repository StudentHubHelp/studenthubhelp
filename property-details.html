  /* =========================
   PHASE 3 - DYNAMIC PROPERTY SEO
   ========================= */

function seoText(value, fallback=''){
  const text=String(value??fallback)
    .replace(/\s+/g,' ')
    .trim();

  return text;
}

function seoClean(value){
  return seoText(value).replace(/[<>]/g,'');
}

function updatePropertySEO(r){
  const name=seoClean(r.name||r.service_name||'Property');
  const city=seoClean(r.city||'India');
  const area=seoClean(r.area||'');
  const description=seoClean(
    r.description ||
    `View detailed information about ${name} in ${area||city} on StudentHubHelp.`
  );

  const typeName={
    hostel:'Hostel / PG',
    tiffin:'Tiffin Service',
    cafe:'Cafe',
    library:'Library',
    bookstore:'Bookstore'
  }[type]||'Property';

  const locationText=[area,city].filter(Boolean).join(', ');

  const titleParts=[
    name,
    locationText,
    typeName,
    'StudentHubHelp'
  ].filter(Boolean);

  const seoTitle=titleParts.join(' | ');

  const seoDescription=(
    `${name} ${typeName} in ${locationText||'India'}. `+
    `${description}`
  ).slice(0,160);

  const canonicalUrl=location.href;

  document.title=seoTitle;

  const setMeta=(id,content)=>{
    const el=document.getElementById(id);
    if(el) el.setAttribute('content',content);
  };

  setMeta('ogTitle',seoTitle);
  setMeta('ogDescription',seoDescription);
  setMeta('ogUrl',canonicalUrl);
  setMeta('twitterTitle',seoTitle);
  setMeta('twitterDescription',seoDescription);

  const imageUrl=new URL(
    r.image||cfg.banner,
    location.href
  ).href;

  setMeta('ogImage',imageUrl);
  setMeta('twitterImage',imageUrl);

  const canonical=document.getElementById('canonicalLink');
  if(canonical) canonical.href=canonicalUrl;

  /* =========================
   PHASE 4 - LOCAL SEO SIGNALS
   ========================= */

const localityParts=[
  r.area,
  r.city,
  r.district,
  r.state
]
.filter(Boolean)
.map(v=>seoClean(v));

const localityText=[
  ...new Set(localityParts)
].join(', ');

const localSeoDescription=(
  `${name} ${typeName} in ${localityText||'India'}. `+
  `${description}`
).slice(0,160);

setMeta('ogDescription',localSeoDescription);
setMeta('twitterDescription',localSeoDescription);
  
  /* -------- JSON-LD -------- */

  const schema={
    "@context":"https://schema.org",
    "@graph":[
      {
        "@type":"WebPage",
        "@id":canonicalUrl+"#webpage",
        "url":canonicalUrl,
        "name":seoTitle,
        "description":seoDescription,
        "isPartOf":{
          "@type":"WebSite",
          "name":"StudentHubHelp",
          "url":"https://studenthubhelp.github.io/studenthubhelp/"
        },
        "breadcrumb":{
          "@id":canonicalUrl+"#breadcrumb"
        }
      },
      {
        "@type":"BreadcrumbList",
        "@id":canonicalUrl+"#breadcrumb",
        "itemListElement":[
          {
            "@type":"ListItem",
            "position":1,
            "name":"Home",
            "item":"https://studenthubhelp.github.io/studenthubhelp/"
          },
          {
            "@type":"ListItem",
            "position":2,
            "name":typeName,
            "item":new URL(
              type==='hostel'?'pg-finder.html':
              type==='tiffin'?'tiffin-finder.html':
              type==='library'?'library-finder.html':
              type==='cafe'?'cafe-finder.html':
              'bookstore-finder.html',
              location.href
            ).href
          },
          {
            "@type":"ListItem",
            "position":3,
            "name":name,
            "item":canonicalUrl
          }
        ]
      }
    ]
  };

  /*
   * LocalBusiness schema only when actual business/property
   * information exists.
   */
  const hasAddress=Boolean(
    r.address||r.area||r.city||r.pincode
  );

  if(hasAddress){
    const business={
  "@type":"LocalBusiness",
  "@id":canonicalUrl+"#business",
  "name":name,
  "url":canonicalUrl,
  "description":localSeoDescription
};

    if(imageUrl){
      business.image=imageUrl;
    }

    if(r.phone||r.contact_phone){
      business.telephone=String(
        r.phone||r.contact_phone
      );
    }

    if(hasAddress){
      business.address={
        "@type":"PostalAddress"
      };

      if(r.address){
        business.address.streetAddress=String(r.address);
      }

      if(r.area){
        business.address.addressLocality=String(r.area);
      }

      if(r.city){
        business.address.addressRegion=String(r.city);
      }

      if(r.pincode){
        business.address.postalCode=String(r.pincode);
      }

      business.address.addressCountry="IN";
    }

    const lat=parseFloat(r.latitude);
    const lng=parseFloat(r.longitude);

    if(Number.isFinite(lat)&&Number.isFinite(lng)){
      business.geo={
        "@type":"GeoCoordinates",
        "latitude":lat,
        "longitude":lng
      };
    }

    schema["@graph"].push(business);
  }

  const schemaEl=document.getElementById('propertySchema');

  if(schemaEl){
    schemaEl.textContent=JSON.stringify(schema,null,2);
  }
}
function niceKey(k){return k.replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase())}
function show(v){if(v===null||v===undefined||v==='')return '<span class="muted">Coming Soon</span>';if(typeof v==='boolean')return v?'<span class="yes">Yes</span>':'<span class="no">No</span>';if(Array.isArray(v))return v.length?v.map(x=>esc(x)).join(', '):'<span class="muted">Coming Soon</span>';return esc(v)}
function field(label,v){
  if(v===null||v===undefined||v==='') return '';
  if(Array.isArray(v)&&v.length===0) return '';
  return `<div class="item"><div class="label">${esc(label)}</div><div class="value">${show(v)}</div></div>`;
}
function pills(v){
  if(v===null||v===undefined||v==='') return '';
  let a=Array.isArray(v)?v:String(v).split(',').map(x=>x.trim()).filter(Boolean);
  if(!a.length) return '';
  return `<div class="facilities">${a.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`;
}
function normalizeBool(v){
  if(typeof v === 'boolean') return v;
  if(v === null || v === undefined || v === '') return null;
  const x=String(v).trim().toLowerCase();
  if(['true','yes','y','1','available','active','verified'].includes(x)) return true;
  if(['false','no','n','0','unavailable','inactive','not verified'].includes(x)) return false;
  return null;
}
function getVerification(r){
  const explicit =
    normalizeBool(r.verified) ??
    (String(r.verification_status||'').toLowerCase()==='verified' ? true :
     String(r.verification_status||'').toLowerCase()==='not verified' ? false : null);
  if(explicit !== null) return explicit;
  return String(r.status||'').toLowerCase()==='verified';
}
function completenessScore(r){
  const checks = [
    r.name||r.service_name,
    r.address||r.area||r.city,
    r.phone||r.contact_phone,
    r.description,
    r.image,
    r.facilities,
    r.rating,
    r.timing||r.timings||r.opening_time,
    r.category||r.type
  ];
  const present=checks.filter(hasValue).length;
  return Math.round((present/checks.length)*100);
}
function common(r){
  return [
    field('Owner / Provider',r.owner_name),
    field('Phone',r.phone||r.contact_phone),
    field('WhatsApp',r.whatsapp||r.whatsapp_number),
    field('Email',r.email),
    field('Address',r.address),
    field('Area',r.area),
    field('City',r.city),
    field('Pincode',r.pincode),
    field('Status',r.status),
    field('Rating',r.rating)
  ].filter(Boolean);
}
function verificationLabel(r){
  return getVerification(r) ? 'Verified by StudentHubHelp' : 'Not currently verified';
}
function freshnessLabel(r){
  const status=String(r.status||'').toLowerCase();
  if(status.includes('inactive') || status.includes('closed')) return 'Needs confirmation';
  return 'Information available';
}
function facilityItems(r){
  const source = r.facilities || [];
  const arr = Array.isArray(source) ? source : String(source).split(',').map(x=>x.trim()).filter(Boolean);
  return arr;
}

function hasValue(v){
  if(v===null||v===undefined||v==='') return false;
  if(Array.isArray(v)) return v.length>0;
  return true;
}

async function load(){
 if(!slug){
   return fail('Property not found','This property URL is missing its identifier.');
 }

 app.setAttribute('aria-busy','true');
 const lookupField=qs.get('slug') ? 'slug' : 'id';
 const lookupValue=qs.get(lookupField);

 try{
   const {data,error}=await db
     .from(cfg.table)
     .select('*')
     .eq(lookupField,lookupValue)
     .maybeSingle();

   if(error) return fail('Unable to load property',error.message);
   if(!data) return fail('Property not found','This listing may have been removed or its URL is incorrect.');

   render(data);
   app.setAttribute('aria-busy','false');
 }catch(err){
   console.error('Property load exception:',err);
   fail('Unable to load property','Something went wrong while loading this listing. Please try again.');
 }
}
function fail(title,msg){app.innerHTML=`<div class="card notice"><h1>${esc(title)}</h1><p class="muted">${esc(msg)}</p><br><button class="back" onclick="history.back()">← Go Back</button></div>`}
async function loadPropertyReviews(propertyId, propertyType) {
  const reviewsContent = document.getElementById("reviewsContent");
  if (!reviewsContent) return;

  // Property ID UUID/text hai — Number() nahi karna
  if (
    propertyId === null ||
    propertyId === undefined ||
    String(propertyId).trim() === ""
  ) {
    reviewsContent.innerHTML =
      '<p class="muted">No reviews available yet.</p>';
    console.warn("Reviews skipped: invalid property ID:", propertyId);
    return;
  }

  const propertyIdText = String(propertyId);

  try {
    const { data, error } = await db
      .from("reviews")
      .select(`
        id,
        property_id,
        property_type,
        user_id,
        student_id,
        user_name,
        rating,
        review_text,
        published_review_text,
        status,
        created_at
      `)
      .eq("property_id", propertyIdText)
      .eq("property_type", propertyType)
      .eq("status", "published")
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Reviews load error:", error);
      reviewsContent.innerHTML =
        '<p class="muted">Reviews could not be loaded right now.</p>';
      return;
    }

    if (!data || data.length === 0) {
      reviewsContent.innerHTML =
        '<p class="muted">No reviews available yet.</p>';
      return;
    }

    reviewsContent.innerHTML = data.map(review => {
      const rating = Math.max(
        0,
        Math.min(5, Math.round(Number(review.rating) || 0))
      );

      const stars =
        "★".repeat(rating) +
        "☆".repeat(5 - rating);

      const reviewer = esc(review.user_name || "Student");

      const reviewDate = review.created_at
        ? new Date(review.created_at).toLocaleDateString("en-IN")
        : "";

      const reviewText = esc(
        review.published_review_text ||
        review.review_text ||
        ""
      );

      return `
        <div class="review" style="
          padding:16px 0;
          border-bottom:1px solid #edf0f4;
        ">
          <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
            flex-wrap:wrap;
          ">
            <strong>${reviewer}</strong>

            <span style="
              color:#f5a623;
              font-size:18px;
              letter-spacing:2px;
            ">
              ${stars}
            </span>
          </div>

          ${
            reviewDate
              ? `<div class="muted" style="font-size:13px;margin-top:4px;">
                   ${esc(reviewDate)}
                 </div>`
              : ""
          }

          <div class="review-text" style="
            margin-top:10px;
            white-space:pre-wrap;
            overflow-wrap:anywhere;
            word-break:break-word;
            line-height:1.7;
            font-size:16px;
          ">${reviewText}</div>
        </div>
      `;
    }).join("");

  } catch (err) {
    console.error("Reviews load exception:", err);
    reviewsContent.innerHTML =
      '<p class="muted">Reviews could not be loaded right now.</p>';
  }
}

function openClaimModal(){

  if(!currentProperty){
    alert('Property information is not available.');
    return;
  }

  db.auth.getUser().then(({data,error})=>{

    if(error || !data?.user){

      localStorage.setItem(
        'studenthub_claim_return',
        location.href
      );

      alert(
        'Please login first. After login, return to this listing and submit your ownership claim.'
      );

      location.href='auth.html';

      return;
    }

    const existingModal=document.getElementById('claimModal');

    if(existingModal){
      existingModal.classList.add('show');
      return;
    }

    document.body.insertAdjacentHTML(
      'beforeend',
      claimModalHTML()
    );

    document
      .getElementById('claimModal')
      .classList.add('show');

    document
      .getElementById('claimForm')
      .addEventListener('submit',submitClaim);

  });
}


function closeClaimModal(){

  const modal=document.getElementById('claimModal');

  if(modal){
    modal.classList.remove('show');

    setTimeout(()=>{
      modal.remove();
    },180);
  }
}


async function submitClaim(event){

  event.preventDefault();

  if(!currentProperty){
    return;
  }

  const btn=document.getElementById('claimSubmitBtn');
  const message=document.getElementById('claimMessageBox');

  const ownerName=
    document.getElementById('claimOwnerName').value.trim();

  const ownerPhone=
    document.getElementById('claimOwnerPhone').value.trim();

  const claimMessage=
    document.getElementById('claimMessage').value.trim();

  message.className='claim-message';
  message.textContent='';

  if(!ownerName || !ownerPhone){

    message.className='claim-message error';
    message.textContent='Name and phone number are required.';
    return;
  }

  btn.disabled=true;
  btn.innerHTML=
    '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

  try{

    const {
      data:{
        user
      }
    }=await db.auth.getUser();

    if(!user){

      throw new Error('Please login before submitting a claim.');
    }

    const propertyType=getClaimPropertyType();

    const propertyId=getClaimPropertyId(currentProperty);

    const {
      error
    }=await db
      .from('claim_requests')
      .insert({
        property_id:propertyId,
        property_type:propertyType,
        owner_id:user.id,
        owner_name:ownerName,
        owner_phone:ownerPhone,
        message:claimMessage || null,
        status:'pending'
      });

    if(error){

      if(
        error.code==='23505' ||
        String(error.message||'')
          .toLowerCase()
          .includes('duplicate')
      ){

        throw new Error(
          'A pending ownership request already exists for this listing.'
        );
      }

      throw error;
    }

    message.className='claim-message success';

    message.textContent=
      'Ownership request submitted successfully. Admin approval is required.';

    btn.innerHTML=
      '<i class="fa-solid fa-check"></i> Request Submitted';

    setTimeout(()=>{

      closeClaimModal();

    },1800);

  }catch(error){

    console.error('Claim submission error:',error);

    message.className='claim-message error';
    message.textContent=
      error.message ||
      'Unable to submit ownership request. Please try again.';

    btn.disabled=false;

    btn.innerHTML=
      '<i class="fa-solid fa-paper-plane"></i> Submit Ownership Request';
  }
}

<script>
(function() {
    const isBlockingVerification = (el) => {
        if (!el || el.nodeType !== 1) return false;
        const key = ((el.id || '') + ' ' + (el.className && typeof el.className === 'string' ? el.className : '')).toLowerCase();
        if ((/verification|verify/.test(key)) && /(modal|popup|dialog|overlay)/.test(key)) return true;
        if (el.getAttribute('role') === 'dialog' && /verification|verify/.test((el.textContent || '').slice(0, 1000).toLowerCase())) return true;
        return false;
    };
    const remove = () => document.querySelectorAll('*').forEach(el => { if (isBlockingVerification(el)) el.remove(); });
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', remove, {once: true}); else remove();
    new MutationObserver(remove).observe(document.documentElement, {childList: true, subtree: true});
})();
</script>
