<div class="wrap"><div class="top"><button class="back" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back</button><button class="share" id="shareBtn"><i class="fa-solid fa-share-nodes"></i> Share</button></div>
<section class="hero"><div class="gallery"><img class="mainimg" src="${esc(img)}" alt="${esc(show(r.name,cfg.label))}" loading="eager"><div class="side"><img src="${esc(img)}" alt="${esc(show(r.name,cfg.label))} interior" loading="lazy"><img src="${esc(img)}" alt="${esc(show(r.name,cfg.label))} photo" loading="lazy"></div></div>
<div class="info"><div class="eyebrow">${esc(cfg.label)}</div><div class="title-row"><div><h1 class="title">${esc(show(r.name,cfg.label))}</h1><div class="rating-box"><span class="stars">${stars(r)}</span><span class="rating-big">${esc(rating(r))}</span><span class="small">${r.rating?'rating':'new listing'}</span></div><div class="location"><i class="fa-solid fa-location-dot"></i><span>${esc(area)}${city?' • '+esc(city):''}</span></div></div><span class="verified ${ver==='Verified'?'':'not-verified'}"><i class="fa-solid ${ver==='Verified'?'fa-circle-check':'fa-clock'}"></i>${esc(ver)}</span></div>
<div class="trust-strip"><div><strong><i class="fa-solid fa-user-check"></i> Student-focused</strong><span>Useful information for student discovery</span></div><div><strong><i class="fa-solid fa-location-crosshairs"></i> Location listed</strong><span>${esc(city||area)}</span></div><div><strong><i class="fa-solid fa-shield-halved"></i> Transparent status</strong><span>${esc(ver)}</span></div></div>
<div class="price-card"><div><div class="price-label">Listed price / rent</div><div class="price-value">${rent||'Contact for price'}</div><div class="price-note">Confirm latest pricing, availability and terms directly.</div></div></div>
<div class="actions">${phone?`<a class="btn primary" href="tel:${esc(phone)}"><i class="fa-solid fa-phone"></i> Call Now</a>`:''}${phone?`<a class="btn green" href="https://wa.me/${String(phone).replace(/[^0-9]/g,'')}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>`:''}<button class="btn light" id="directionsBtn"><i class="fa-solid fa-location-arrow"></i> Directions</button><button class="btn primary" id="bookBtn"><i class="fa-solid fa-calendar-check"></i> Book Now</button></div>
</div></section>
<div class="content"><main>
<section class="card"><div class="card-head"><div><div class="section-kicker">At a glance</div><h2>Quick Facts</h2></div></div><div class="grid"><div class="item"><div class="label">Category</div><div class="value">${esc(cfg.label)}</div></div><div class="item"><div class="label">Area</div><div class="value">${esc(area)}</div></div><div class="item"><div class="label">City</div><div class="value">${esc(city||'Not specified')}</div></div><div class="item"><div class="label">Rating</div><div class="value">${esc(rating(r))}</div></div></div></section>
<section class="card"><div class="section-kicker">For students</div><h2>Student Highlights</h2><div class="highlight-grid">${studentHighlights(r).map(x=>`<div class="highlight"><div class="highlight-icon"><i class="fa-solid ${x[0]}"></i></div><div><strong>${esc(x[1])}</strong><span>${esc(x[2])}</span></div></div>`).join('')}</div></section>
<section class="card"><div class="section-kicker">Options</div><h2>Room / Rent Options</h2>${roomOptions(r).length?`<div class="grid">${roomOptions(r).map(x=>`<div class="item"><div class="label">${esc(x[0])}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div>`:'<div class="empty-state">Room or pricing options are not separately listed. Please confirm available options directly.</div>'}</section>
<section class="card"><div class="section-kicker">Overview</div><h2>Property Details</h2><p class="desc">${esc(show(r.description,r.about,`${show(r.name,cfg.label)} is listed on StudentHubHelp for student-focused discovery. Please confirm important details directly with the property.`))}</p>${categorySections(r).length?`<div class="grid" style="margin-top:15px">${categorySections(r).slice(0,18).map(x=>`<div class="item"><div class="label">${esc(x[0].replaceAll('_',' '))}</div><div class="value">${esc(x[1])}</div></div>`).join('')}</div>`:''}</section>
<section class="card"><div class="section-kicker">Facilities</div><h2>Amenities</h2><div class="facilities">${facilityItems(r).length?facilityItems(r).map(x=>`<span class="pill"><i class="fa-solid fa-check yes"></i> ${esc(x)}</span>`).join(''):'<div class="empty-state" style="width:100%">Amenities have not been separately listed.</div>'}</div></section>
<section class="card"><div class="section-kicker">Student commute</div><h2>Nearby Coaching</h2><div class="desc">${esc(show(r.nearby_coaching,'Nearby coaching information is not currently listed.'))}</div></section>
<section class="card"><div class="section-kicker">Local context</div><h2>Nearby Student Ecosystem</h2><div class="grid"><div class="item"><div class="label">Nearby landmark</div><div class="value">${esc(show(r.nearby_landmark,'Not listed'))}</div></div><div class="item"><div class="label">Area</div><div class="value">${esc(area)}</div></div><div class="item"><div class="label">City</div><div class="value">${esc(city||'Not listed')}</div></div><div class="item"><div class="label">Student context</div><div class="value">Coaching, study and local services can be explored through StudentHubHelp.</div></div></div></section>
<section class="card"><div class="section-kicker">Location</div><h2>Location / Map</h2><iframe class="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(show(r.address,area+' '+city))}&output=embed"></iframe></section>
<section class="card"><div class="section-kicker">Gallery</div><h2>Photos</h2><div class="grid"><img src="${esc(img)}" alt="${esc(show(r.name,cfg.label))} photo" loading="lazy" style="width:100%;height:220px;object-fit:cover;border-radius:15px"><img src="${esc(img)}" alt="${esc(show(r.name,cfg.label))} additional photo" loading="lazy" style="width:100%;height:220px;object-fit:cover;border-radius:15px"></div></section>
<section class="card trust-card"><div class="section-kicker">Trust</div><h2>Verification &amp; Trust</h2><div class="status-badge ${ver==='Verified'?'status-good':'status-neutral'}"><i class="fa-solid ${ver==='Verified'?'fa-circle-check':'fa-clock'}"></i>${esc(ver)}</div><div class="verification-grid"><div class="verify-item"><div class="vicon">✓</div><div><strong>Listing status</strong><small>${esc(ver)}</small></div></div><div class="verify-item"><div class="vicon">✓</div><div><strong>Direct confirmation</strong><small>Confirm important details before booking.</small></div></div></div><div class="trust-note"><strong>Important:</strong> Verification status is an information signal, not a guarantee of safety, availability, ownership or accuracy.</div></section>
<section class="card"><div class="section-kicker">Data quality</div><h2>Information Completeness</h2><div class="progress-head"><b>Listing information</b><span>Based on fields currently available</span></div><div class="progress"><span style="width:${Math.min(100,Math.max(20,Math.round(Object.values(r).filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='').length/Math.max(1,Object.keys(r).length)*100)))}%"></span></div><div class="quality-grid"><div class="quality-item"><b>✓</b> Basic details</div><div class="quality-item"><b>✓</b> Location context</div><div class="quality-item"><b>✓</b> Student information</div></div></section>
<section class="card"><div class="card-head"><div><div class="section-kicker">Community</div><h2>Reviews</h2></div></div><div id="reviewsBox"><div class="small">Loading reviews…</div></div><div class="report-options"><button class="report-chip" data-report="Incorrect information">Report incorrect information</button><button class="report-chip" data-report="Duplicate listing">Report duplicate</button><button class="report-chip" data-report="Other">Other issue</button></div><div id="reportMsg" class="report-message"></div></section>
<section class="card owner-claim-card"><div class="section-kicker">Ownership</div><h2>Owner / Claim</h2><div id="claimArea"></div></section>
<section class="card"><div class="section-kicker">Questions</div><h2>Frequently Asked Questions</h2><div class="faq-list">${faqItems(r).map(x=>`<details><summary>${esc(x[0])}</summary><div class="faq-answer">${esc(x[1])}</div></details>`).join('')}</div></section>
<section class="card"><div class="card-head"><div><div class="section-kicker">Discover more</div><h2>Similar Properties</h2><div class="small">Real listings from the same category and city, prioritising the same area and similar rent.</div></div><div class="carousel-controls"><button class="carousel-btn" id="similarPrev" aria-label="Previous">‹</button><button class="carousel-btn" id="similarNext" aria-label="Next">›</button></div></div><div class="similar-wrap"><div class="similar-track" id="similarTrack"><div class="empty-state" style="min-width:100%">Loading similar listings…</div></div></div></section>
</main><aside><div class="card sticky"><div class="section-kicker">Quick action</div><h2>Need more information?</h2><p class="small">Confirm availability, price, rules and exact location directly before making any payment or booking decision.</p><div class="actions" style="display:grid">${phone?`<a class="btn primary" href="tel:${esc(phone)}">Call Property</a>`:''}${phone?`<a class="btn green" href="https://wa.me/${String(phone).replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">WhatsApp</a>`:''}<button class="btn light" id="sideClaimBtn">Claim / Correct</button></div></div></aside></div></div>`;
setup(r);}
async function loadPropertyReviews(id,table){const box=document.getElementById('reviewsBox');try{const {data,error}=await db.from('property_reviews').select('*').eq('property_id',id).eq('property_type',table).order('created_at',{ascending:false}).limit(10);if(error)throw error;if(!data?.length){box.innerHTML='<div class="empty-state">No reviews yet. Be the first to share your experience.</div>';return}box.innerHTML=data.map(x=>`<div class="review"><div class="rating-box"><span class="stars">${'★'.repeat(Math.max(0,Math.min(5,Math.round(Number(x.rating)||0))) )}</span><b>${esc(x.rating||'')}</b></div><div class="review-text">${esc(x.review||x.comment||'')}</div></div>`).join('')}catch(e){box.innerHTML='<div class="empty-state">Reviews are currently unavailable.</div>'}}
function claimPropertyHTML(r){const claimed=String(show(r.owner_claimed,r.claimed,r.owner_status)).toLowerCase();if(claimed==='true'||claimed==='claimed'||claimed==='approved')return '<div class="owner-claimed"><i class="fa-solid fa-circle-check"></i> Owner claim recorded</div>';return `<div class="owner-claim-box"><div class="owner-claim-info"><div class="owner-claim-title">Are you the owner or authorized representative?</div><div class="owner-claim-text">Claim this listing to request review, corrections or updates. Ownership claim and listing verification are separate processes.</div></div><button class="owner-claim-btn" id="claimBtn">Claim this listing</button></div>`}
function setup(r){document.getElementById('backBtn').addEventListener('click',()=>history.length>1?history.back():(location.href='index.html'));document.getElementById('shareBtn').addEventListener('click',share);document.getElementById('directionsBtn').addEventListener('click',()=>{const q=encodeURIComponent(show(r.address,r.area+' '+r.city));window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener')});document.getElementById('bookBtn').addEventListener('click',()=>{alert('Please contact the property directly to confirm current availability and booking terms.')});document.getElementById('claimArea').innerHTML=claimPropertyHTML(r);document.getElementById('claimBtn')?.addEventListener('click',()=>openClaim(r));document.getElementById('sideClaimBtn').addEventListener('click',()=>openClaim(r));document.querySelectorAll('.report-chip').forEach(b=>b.addEventListener('click',()=>document.getElementById('reportMsg').textContent='Thanks. Please contact StudentHubHelp with the property link and the specific issue so it can be reviewed.'));loadPropertyReviews(r.id,cfg.table);loadSimilarProperties(r)}
async function loadSimilarProperties(r){const track=document.getElementById('similarTrack');try{const city=String(r.city||'').trim();const area=String(r.area||'').trim().toLowerCase();const currentId=r.id;const {data,error}=await db.from(cfg.table).select('id,slug,name,image,area,city,price,monthly_fee,rating,verified,status').limit(80);if(error)throw error;const rows=(data||[]).filter(x=>String(x.id)!==String(currentId)&&(!city||String(x.city||'').toLowerCase()===city.toLowerCase())).map(x=>{const sameArea=area&&String(x.area||'').toLowerCase()===area;const p=Number(x.price||x.monthly_fee||0),rp=Number(r.price||r.monthly_fee||0);const diff=rp&&p?Math.abs(p-rp)/Math.max(rp,1):1;return {...x,score:(sameArea?50:0)+(diff<.25?30:diff<.5?15:0)+(Number(x.verified)?10:0)+(Number(x.rating)||0)}}).sort((a,b)=>b.score-a.score).slice(0,10);if(!rows.length){track.innerHTML='<div class="empty-state" style="min-width:100%">Similar listings are unavailable right now.</div>';return}track.innerHTML=rows.map(x=>{const image=firstImage(x);const href='property-details.html?type='+encodeURIComponent(type)+'&slug='+encodeURIComponent(x.slug||x.id);return `<a class="similar-card" href="${href}"><img class="similar-img" src="${esc(image)}" alt="${esc(x.name||cfg.label)}" loading="lazy"><div class="similar-body"><div class="similar-name">${esc(x.name||cfg.label)}</div><div class="similar-meta">${esc(x.area||'')} ${x.city?'• '+esc(x.city):''}</div><div class="similar-price">${money(x.price||x.monthly_fee)||'Contact for price'}</div><span class="similar-match">${String(x.area||'').toLowerCase()===area?'Same area':'Same city'}</span></div></a>`}).join('');const prev=document.getElementById('similarPrev');const next=document.getElementById('similarNext');prev?.addEventListener('click',()=>track?.scrollBy({left:-280,behavior:'smooth'}));next?.addEventListener('click',()=>track?.scrollBy({left:280,behavior:'smooth'}));if(track&&rows.length>1){const cards=[...track.children];cards.forEach(card=>track.appendChild(card.cloneNode(true)));let paused=false;const getStep=()=>{const card=track.querySelector('.similar-card');if(!card)return 280;const gap=parseFloat(getComputedStyle(track).gap)||13;return card.getBoundingClientRect().width+gap};const loopWidth=()=>track.scrollWidth/2;const tick=()=>{if(paused)return;const target=track.scrollLeft+getStep();const half=loopWidth();if(target>=half){track.scrollTo({left:target-half,behavior:'auto'});requestAnimationFrame(()=>track.scrollBy({left:getStep(),behavior:'smooth'}))}else{track.scrollBy({left:getStep(),behavior:'smooth'})}};track.addEventListener('mouseenter',()=>paused=true);track.addEventListener('mouseleave',()=>paused=false);track.addEventListener('touchstart',()=>paused=true,{passive:true});track.addEventListener('touchend',()=>paused=false,{passive:true});window.addEventListener('resize',()=>{if(track.scrollLeft>=loopWidth())track.scrollTo({left:track.scrollLeft-loopWidth(),behavior:'auto'})});setInterval(tick,2600)}}catch(e){console.error('Similar properties load failed:',e);track.innerHTML='<div class="empty-state" style="min-width:100%">Similar listings are unavailable right now.</div>'}}
async function share(){try{await navigator.share({title:document.title,text:'Check this property on StudentHubHelp',url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);alert('Property link copied!')}catch(_){alert(location.href)}}}
function openClaim(r){const modal=document.getElementById('claimModal');const wrap=document.getElementById('claimFormWrap');modal.classList.add('show');wrap.innerHTML=`<form class="claim-form" id="claimForm"><label>Name<input name="name" required></label><label>Role<select name="role"><option>Owner</option><option>Manager</option><option>Authorized Representative</option></select></label><label>Current contact number<input name="phone" required></label><label>Property name<input name="property" value="${esc(r.name||'')}" required></label><label>Connection details<textarea name="proof" placeholder="Non-sensitive information that helps us review your connection to this listing"></textarea></label><div class="claim-msg">Please do not send passwords, OTPs, bank/card details or unnecessary sensitive documents.</div><button class="claim-submit">Submit claim request</button><div id="claimResult"></div></form>`;document.getElementById('claimForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('claimResult').textContent='Claim request noted. Please contact StudentHubHelp to complete the review.'})}
document.getElementById('claimClose').addEventListener('click',()=>document.getElementById('claimModal').classList.remove('show'));document.getElementById('claimModal').addEventListener('click',e=>{if(e.target.id==='claimModal')e.currentTarget.classList.remove('show')});
async function load(){if(!slug){document.getElementById('app').innerHTML='<div class="notice"><h2>Property not found</h2><p class="small">A property slug is required.</p></div>';return}const {data,error}=await db.from(cfg.table).select('*').eq('slug',slug).maybeSingle();if(error||!data){document.getElementById('app').innerHTML='<div class="notice"><h2>Property not found</h2><p class="small">This listing could not be loaded right now.</p></div>';return}render(data)}
load();
</script>

<!-- StudentHubHelp AI Chatbot -->
<script src="/studenthubhelp/ai-chatbot/public/widget.js" defer></script>
</body>
</html>
