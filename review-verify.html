<!doctype html>
<html lang="en-IN">
<head>
<meta property="og:type" content="website">

<meta property="og:description" content="Discover hostels, PGs, tiffin services, libraries, cafes and bookstores with StudentHubHelp.">

<meta property="og:title" content="Verify your review | StudentHubHelp">

<meta name="twitter:card" content="summary_large_image">

<meta property="og:image:alt" content="StudentHubHelp logo and student services">

<meta property="og:image:secure_url" content="https://studenthubhelp.in/share-preview.png">

<meta name="twitter:image" content="https://studenthubhelp.in/share-preview.png">

<meta property="og:image" content="https://studenthubhelp.in/share-preview.png">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f3c2d">
<title>Verify your review | StudentHubHelp</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#edf4ee,#fff7ef);font-family:Arial,sans-serif;color:#173d2c}.verify-card{width:min(100%,510px);padding:38px;border:1px solid #e1ebe3;border-radius:24px;background:#fff;box-shadow:0 22px 70px rgba(15,60,45,.12);text-align:center}.logo{width:58px;height:58px;object-fit:contain}.eyebrow{margin:22px 0 8px;color:#e87528;font-size:11px;font-weight:800;letter-spacing:1.5px}.verify-card h1{margin:0;font-size:28px;letter-spacing:-.8px}.verify-card p{color:#6c7c72;font-size:14px;line-height:1.7}.verify-card button{width:100%;min-height:48px;margin-top:14px;border:0;border-radius:12px;background:#0f3c2d;color:#fff;font-size:14px;font-weight:800;cursor:pointer}.verify-card button:disabled{opacity:.6;cursor:wait}#status{min-height:28px;margin-top:18px;font-size:13px}.home{display:inline-block;margin-top:12px;color:#0f6944;font-size:13px;font-weight:700;text-decoration:none}
</style>
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
<main class="verify-card">
<img class="logo" src="/logo.png" alt="StudentHubHelp">
<div class="eyebrow">STUDENTHUBHELP COMMUNITY</div>
<h1>Verify your review</h1>
<p>Confirm your Gmail address to publish your review. Your email address will remain private and will never appear with your review.</p>
<button id="verifyButton" type="button">Verify email & publish review</button>
<div id="status" role="status" aria-live="polite">This secure link can be used once and expires after 30 minutes.</div>
<a class="home" href="/">Return to StudentHubHelp</a>
</main>
<script>
(function(){
  const params=new URLSearchParams(location.search),token=params.get('token')||'',scope=params.get('scope')==='property'?'property':'platform';
  const button=document.getElementById('verifyButton'),status=document.getElementById('status');
  if(!/^[a-f0-9]{64}$/i.test(token)){button.disabled=true;status.textContent='This verification link is invalid or incomplete. Please submit your review again.';return;}
  button.addEventListener('click',async function(){
    button.disabled=true;button.textContent='Verifying…';status.textContent='Verifying your email securely…';
    try{
      const response=await fetch('https://idurlccrarznnnqixxsd.supabase.co/functions/v1/studenthubhelp-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:scope==='property'?'verify_property':'verify',token})});
      const result=await response.json().catch(()=>({}));
      if(!response.ok||!result.ok)throw new Error(result.error||'Verification could not be completed.');
      status.textContent=scope==='property'?'Your email is verified. Your property review is now awaiting admin approval. Thank you!':'Your email is verified and your review is now published. Thank you!';
      button.textContent=scope==='property'?'Submitted for approval ✓':'Review published ✓';
    }catch(error){status.textContent=error.message||'This link could not be verified.';button.disabled=false;button.textContent='Try verification again';}
  });
})();
</script>
</body></html>
