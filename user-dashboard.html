<!DOCTYPE html><html lang="en" class="scroll-smooth"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Dashboard | StudentHubHelp</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/studenthub-core.js"></script><link rel="stylesheet" href="css/premium.css"><meta name="robots" content="noindex, nofollow, noarchive">
</head><body class="bg-navy-950 text-slate-100 min-h-screen font-sans"><nav data-sh-nav></nav><main class="max-w-6xl mx-auto px-4 py-8 space-y-6"><section class="glass rounded-3xl p-6 flex flex-col sm:flex-row justify-between gap-5"><div><span id="role" class="text-[10px] uppercase font-bold px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-300">Member</span><h1 id="name" class="text-3xl font-display font-bold mt-3">User</h1><p id="contact" class="text-sm text-slate-400 mt-1">—</p></div><div class="flex gap-2"><button id="editBtn" class="px-4 py-2.5 rounded-xl bg-navy-800 border border-gold-500/30 text-gold-300 font-bold text-xs">Edit Profile</button><a id="addBtn" href="add-listing.html" class="px-4 py-2.5 rounded-xl gold-gradient-bg text-navy-950 font-bold text-xs hidden">+ Add Property</a><button id="logout" class="px-4 py-2.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 font-bold text-xs">Logout</button></div></section><section id="ownerSection" class="hidden space-y-4"><div class="flex items-center justify-between"><div><h2 class="text-xl font-bold">My Properties</h2><p class="text-xs text-slate-500">Live listings linked to your owner account.</p></div><span id="propertyCount" class="text-xs text-gold-300"></span></div><div id="properties" class="grid md:grid-cols-2 gap-4"></div></section><section id="studentHint" class="glass rounded-3xl p-6 hidden"><h2 class="text-xl font-bold">Find student essentials</h2><p class="text-sm text-slate-400 mt-2">Explore hostels, tiffins, libraries and cafes across India from the main site.</p><a href="./" class="inline-block mt-4 px-4 py-2.5 rounded-xl gold-gradient-bg text-navy-950 text-xs font-bold">Explore Listings</a></section></main><div id="editModal" class="fixed inset-0 hidden items-center justify-center bg-black/70 p-4 z-50"><div class="glass rounded-3xl p-6 w-full max-w-lg"><h2 class="text-xl font-bold">Edit Profile</h2><label class="block text-xs font-bold mt-4">Name</label><input id="editName" class="premium-input w-full rounded-xl px-4 py-3 mt-1"><label class="block text-xs font-bold mt-4">Address</label><textarea id="editAddress" rows="3" class="premium-input w-full rounded-xl px-4 py-3 mt-1"></textarea><div class="flex gap-3 mt-5"><button id="cancelEdit" class="flex-1 py-3 rounded-xl bg-navy-800">Cancel</button><button id="saveEdit" class="flex-1 py-3 rounded-xl gold-gradient-bg text-navy-950 font-bold">Save Live</button></div><p id="editMsg" class="text-xs mt-3"></p></div></div><script>
const SUPABASE_URL='https://idurlccrarznnnqixxsd.supabase.co';const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdXJsY2NyYXJ6bm5ucWl4eHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODY3NTgsImV4cCI6MjEwMzU2Mjc1OH0.pq_rza98twL-SETqm_6TGNzsPCkVJxwjocFUeLB1yMA';const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);const esc=StudentHub.esc,clean=StudentHub.clean;let user,profile;
StudentHub.injectNav('');
function norm(v){const d=clean(v).replace(/\D/g,'');return d.length>=10?d.slice(-10):d}
async function boot(){const {data,error}=await db.auth.getSession();if(error||!data.session){location.href='auth.html';return}user=data.session.user;if((user.email||'').toLowerCase()==='satpalswami22742@gmail.com'){location.href='admin-dashboard.html';return}const {data:p}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p;if(!p){location.href='auth.html';return}if(String(p.role).toLowerCase()==='admin'){location.href='admin-dashboard.html';return}$('name').textContent=p.full_name||'User';$('contact').textContent=[p.email||user.email,p.phone].filter(Boolean).join(' • ')||'—';$('role').textContent=p.role||'Member';$('editName').value=p.full_name||'';$('editAddress').value=p.address||'';if(String(p.role).toLowerCase()==='owner'){ $('ownerSection').classList.remove('hidden');$('addBtn').classList.remove('hidden');await loadOwnerProperties()}else $('studentHint').classList.remove('hidden')}
async function loadOwnerProperties(){const tables=['hostels','tiffins','libraries','cafes'];const results=await Promise.all(tables.map(async t=>{const {data}=await db.from(t).select('*').order('created_at',{ascending:false});return (data||[]).map(x=>({...x,_table:t})).filter(x=>String(x.owner_id||'')===String(user.id)||norm(x.phone)===norm(profile.phone))}));const rows=results.flat();$('propertyCount').textContent=rows.length+' listing(s)';if(!rows.length){$('properties').innerHTML='<div class="md:col-span-2 p-6 rounded-2xl bg-navy-900 border border-navy-800 text-sm text-slate-500">No property linked to this owner yet.</div>';return}const reviewSets=await Promise.all(rows.map(x=>StudentHub.getReviews(db,x.id)));$('properties').innerHTML=rows.map((x,i)=>{const rr=reviewSets[i].data||[];const agg=StudentHub.aggregateReviews(rr,x.rating);return `<article class="glass rounded-3xl overflow-hidden"><div class="relative h-44 bg-navy-900"><img src="${esc(StudentHub.imageUrl(x.image,({hostels:'hostel-banner.png',tiffins:'tiffin-banner.png',libraries:'library-banner.png',cafes:'cafe-banner.png'})[x._table]))}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='${x._table==='hostels'?'hostel-banner.png':x._table==='tiffins'?'tiffin-banner.png':x._table==='libraries'?'library-banner.png':'cafe-banner.png'}'"><div class="absolute inset-0 bg-gradient-to-t from-navy-950 to-transparent"></div><span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-400/20 text-[10px] font-bold">YOUR PROPERTY</span></div><div class="p-5"><h3 class="font-bold text-lg">${esc(x.name||'Property')}</h3><p class="text-xs text-gold-300 mt-1">${esc(x.area||'—')}</p><p class="text-xs text-slate-400 mt-2">${esc(x.address||'—')}</p><div class="mt-4 flex items-center justify-between"><span class="text-sm">⭐ ${agg.rating!=null?agg.rating.toFixed(1):'—'} <span class="text-xs text-slate-500">(${agg.count} reviews)</span></span><span class="text-[10px] uppercase text-slate-500">${esc(x._table)}</span></div><div class="mt-4 space-y-2">${rr.slice(0,3).map(r=>`<div class="p-3 rounded-xl bg-navy-950 border border-navy-800"><div class="text-gold-400 text-xs">${StudentHub.stars(r.rating)}</div><p class="text-xs text-slate-300 mt-1">${esc(r.review)}</p></div>`).join('')||'<p class="text-xs text-slate-500">No reviews yet.</p>'}</div></div></article>`}).join('')}
$('editBtn').onclick=()=>{$('editModal').classList.remove('hidden');$('editModal').classList.add('flex')};$('cancelEdit').onclick=()=>{$('editModal').classList.add('hidden');$('editModal').classList.remove('flex')};$('saveEdit').onclick=async()=>{const {error}=await db.from('profiles').update({full_name:clean($('editName').value)||null,address:clean($('editAddress').value)||null}).eq('id',user.id);if(error){$('editMsg').textContent=error.message;$('editMsg').className='text-xs mt-3 text-red-300';return}profile.full_name=clean($('editName').value);profile.address=clean($('editAddress').value);$('name').textContent=profile.full_name||'User';$('editModal').classList.add('hidden');$('editModal').classList.remove('flex')};$('logout').onclick=async()=>{await db.auth.signOut();location.href='auth.html'};
['hostels','tiffins','libraries','cafes','profiles','reviews'].forEach(table=>db.channel('user-live-'+table).on('postgres_changes',{event:'*',schema:'public',table},()=>{if(user)boot()}).subscribe());boot();
</script></body></html>
