<script>
/* =========================================================
   STUDENTHUB AUTH — SUPABASE ONLY
   ========================================================= */

const SUPABASE_URL = "https://idurlccrarznnnqixxsd.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdXJsY2NyYXJ6bm5ucWl4eHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODY3NTgsImV4cCI6MjEwMzU2Mjc1OH0.pq_rza98twL-SETqm_6TGNzsPCkVJxwjocFUeLB1yMA";

const DIRECTOR_EMAIL = "satpalswami22742@gmail.com";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================================================
   IMPORTANT:
   OLD LOCAL ADMIN FLAGS MUST NOT CONTROL LOGIN
   ========================================================= */

try {
    sessionStorage.removeItem("studenthub_admin_logged");
} catch (e) {}

try {
    localStorage.removeItem("studenthub_admin_logged");
    localStorage.removeItem("studenthub_admin_pwd");
} catch (e) {}


/* =========================================================
   HELPERS
   ========================================================= */

function normalizeRole(role) {
    return String(role || "")
        .trim()
        .toLowerCase();
}


function showLoading(button, text) {
    if (!button) return;

    button.disabled = true;
    button.dataset.originalText = button.innerHTML;

    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin mr-2"></i>' + text;
}


function hideLoading(button) {
    if (!button) return;

    button.disabled = false;

    if (button.dataset.originalText) {
        button.innerHTML = button.dataset.originalText;
    }
}


/* =========================================================
   ROLE-BASED REDIRECT
   ========================================================= */

async function redirectAfterLogin(user) {

    if (!user || !user.id) {
        throw new Error("Supabase user session not found.");
    }

    const authEmail =
        String(user.email || "").trim().toLowerCase();

    /*
       IMPORTANT:
       Role is read from profiles using AUTH USER ID.
       Never trust localStorage or user-entered role.
    */

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("id, full_name, phone, role")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {
        console.error("Profile verification error:", error);
        throw new Error(
            "Unable to verify your account role from Supabase."
        );
    }

    if (!profile) {
        throw new Error(
            "Your Supabase profile was not found. Please contact support."
        );
    }

    const role = normalizeRole(profile.role);


    /* =====================================================
       ADMIN SECURITY CHECK
       BOTH conditions are mandatory:
       1. profiles.role = admin
       2. Auth email = Director email
       ===================================================== */

    if (role === "admin") {

        if (authEmail !== DIRECTOR_EMAIL) {

            await supabaseClient.auth.signOut();

            throw new Error(
                "Admin access is restricted to the authorized Director account."
            );
        }

        /*
           ONLY verified Director can reach admin dashboard.
        */

        window.location.replace("admin-dashboard.html");
        return;
    }


    /* =====================================================
       STUDENT
       ===================================================== */

    if (role === "student") {

        window.location.replace("user-dashboard.html");
        return;
    }


    /* =====================================================
       OWNER
       ===================================================== */

    if (role === "owner") {

        window.location.replace("user-dashboard.html");
        return;
    }


    /* =====================================================
       UNKNOWN / INVALID ROLE
       ===================================================== */

    await supabaseClient.auth.signOut();

    throw new Error(
        "Your account role is invalid or not configured. Please contact support."
    );
}


/* =========================================================
   SIGN IN
   ========================================================= */

const signInForm = document.getElementById("signInForm");

if (signInForm) {

    signInForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        const emailInput =
            document.getElementById("loginEmail");

        const passwordInput =
            document.getElementById("loginPassword");

        const button =
            document.getElementById("signInSubmitBtn");

        const email =
            String(emailInput?.value || "")
                .trim()
                .toLowerCase();

        const password =
            String(passwordInput?.value || "");

        if (!email || !password) {
            alert("Please enter email and password.");
            return;
        }

        showLoading(button, "Verifying...");

        try {

            /*
               IMPORTANT:
               No hardcoded admin password.
               No localStorage password.
               No admin shortcut.
            */

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error("Supabase login error:", error);

                throw new Error(
                    "Invalid email or password."
                );
            }


            if (!data || !data.user) {

                throw new Error(
                    "Supabase did not return a valid user session."
                );
            }


            /*
               Role verification happens AFTER
               successful Supabase Auth login.
            */

            await redirectAfterLogin(data.user);

        } catch (error) {

            console.error(error);

            alert(
                error.message ||
                "Login failed. Please try again."
            );

        } finally {

            hideLoading(button);
        }
    });
}


/* =========================================================
   SIGN UP
   ========================================================= */

const signUpForm = document.getElementById("signUpForm");

if (signUpForm) {

    signUpForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        const roleElement =
            document.querySelector(
                'input[name="regRole"]:checked'
            );

        const name =
            document.getElementById("regName")?.value.trim();

        const phone =
            document.getElementById("regPhone")?.value.trim();

        const email =
            document.getElementById("regEmail")?.value
                .trim()
                .toLowerCase();

        const password =
            document.getElementById("regPassword")?.value || "";

        const button =
            document.getElementById("signUpSubmitBtn");

        const role =
            normalizeRole(roleElement?.value);


        if (!["student", "owner"].includes(role)) {

            alert("Only Student or Owner accounts can be created.");
            return;
        }


        if (!name || !phone || !email || !password) {

            alert("Please fill all required fields.");
            return;
        }


        if (password.length < 6) {

            alert("Password must be at least 6 characters.");
            return;
        }


        showLoading(button, "Creating Account...");


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {
                        data: {
                            full_name: name,
                            phone: phone,
                            role: role
                        }
                    }
                });


            if (error) {
                throw error;
            }


            if (!data?.user) {
                throw new Error(
                    "Account creation failed."
                );
            }


            /*
               Profile is connected to the same
               Supabase Auth user ID.
            */

            const { error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .upsert(
                        {
                            id: data.user.id,
                            full_name: name,
                            phone: phone,
                            role: role
                        },
                        {
                            onConflict: "id"
                        }
                    );


            if (profileError) {

                console.error(
                    "Profile save error:",
                    profileError
                );

                /*
                   Do not silently pretend everything
                   is fine if profile creation failed.
                */

                throw new Error(
                    "Account created, but profile setup failed. Please contact support."
                );
            }


            /*
               If email confirmation is enabled,
               Supabase may return no active session.
            */

            if (!data.session) {

                alert(
                    "Account created successfully. Please verify your email and then sign in."
                );

                showSignInTab();

                return;
            }


            await redirectAfterLogin(data.user);

        } catch (error) {

            console.error(error);

            alert(
                error.message ||
                "Registration failed."
            );

        } finally {

            hideLoading(button);
        }
    });
}


/* =========================================================
   FORGOT PASSWORD
   ========================================================= */

window.openForgotPasswordModal = function () {

    const modal =
        document.getElementById("forgotPasswordModal");

    if (modal) {
        modal.classList.remove("hidden");
    }
};


window.closeForgotPasswordModal = function () {

    const modal =
        document.getElementById("forgotPasswordModal");

    if (modal) {
        modal.classList.add("hidden");
    }
};


const forgotPasswordForm =
    document.getElementById("forgotPasswordForm");

if (forgotPasswordForm) {

    forgotPasswordForm.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();

            const email =
                document.getElementById(
                    "resetTargetEmail"
                )?.value
                    .trim()
                    .toLowerCase();

            const button =
                document.getElementById(
                    "sendResetBtn"
                );


            if (!email) {

                alert("Please enter your email.");
                return;
            }


            showLoading(button, "Sending...");


            try {

                const { error } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    "https://studenthubhelp.github.io/studenthubhelp/auth.html"
                            }
                        );


                if (error) {
                    throw error;
                }


                alert(
                    "Password reset link has been sent to your email."
                );

                closeForgotPasswordModal();

            } catch (error) {

                console.error(error);

                alert(
                    error.message ||
                    "Unable to send reset link."
                );

            } finally {

                hideLoading(button);
            }
        }
    );
}


/* =========================================================
   PASSWORD RECOVERY / NEW PASSWORD
   ========================================================= */

function showSetNewPasswordView() {

    const signIn =
        document.getElementById(
            "signInContainer"
        );

    const signUp =
        document.getElementById(
            "signUpContainer"
        );

    const tabs =
        document.getElementById(
            "authTabsHeader"
        );

    const reset =
        document.getElementById(
            "setNewPasswordContainer"
        );


    if (signIn) signIn.style.display = "none";

    if (signUp) signUp.style.display = "none";

    if (tabs) tabs.style.display = "none";

    if (reset) reset.style.display = "block";
}


const setNewPasswordForm =
    document.getElementById(
        "setNewPasswordForm"
    );

if (setNewPasswordForm) {

    setNewPasswordForm.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();

            const password =
                document.getElementById(
                    "newPasswordInput"
                )?.value || "";

            const confirmPassword =
                document.getElementById(
                    "confirmNewPasswordInput"
                )?.value || "";

            const button =
                document.getElementById(
                    "saveNewPassBtn"
                );


            if (password.length < 6) {

                alert(
                    "Password must be at least 6 characters."
                );

                return;
            }


            if (password !== confirmPassword) {

                alert(
                    "Passwords do not match."
                );

                return;
            }


            showLoading(button, "Updating Password...");


            try {

                const { error } =
                    await supabaseClient.auth
                        .updateUser({
                            password: password
                        });


                if (error) {
                    throw error;
                }


                alert(
                    "Password updated successfully."
                );


                /*
                   After password reset, verify the
                   Supabase session and role again.
                */

                const {
                    data: sessionData
                } =
                    await supabaseClient.auth
                        .getSession();


                if (
                    sessionData?.session?.user
                ) {

                    await redirectAfterLogin(
                        sessionData.session.user
                    );

                } else {

                    window.location.replace(
                        "auth.html"
                    );
                }

            } catch (error) {

                console.error(error);

                alert(
                    error.message ||
                    "Unable to update password."
                );

            } finally {

                hideLoading(button);
            }
        }
    );
}


/* =========================================================
   AUTH STATE
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
    function (event, session) {

        /*
           IMPORTANT:
           DO NOT automatically redirect on
           INITIAL_SESSION.

           This prevents opening auth.html and
           immediately jumping to admin dashboard.
        */

        if (event === "PASSWORD_RECOVERY") {

            showSetNewPasswordView();
        }
    }
);


/* =========================================================
   RECOVERY URL CHECK
   ========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    function () {

        const hash =
            window.location.hash || "";

        const search =
            window.location.search || "";


        if (
            hash.includes("type=recovery") ||
            search.includes("type=recovery") ||
            hash.includes("access_token=")
        ) {

            showSetNewPasswordView();
        }

        /*
           IMPORTANT:
           No automatic dashboard redirect here.
           Login button must perform authentication first.
        */
    }
);


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

window.togglePassword = function (inputId, iconId) {

    const input =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);

    if (!input) return;


    if (input.type === "password") {

        input.type = "text";

        if (icon) {
            icon.classList.remove(
                "fa-eye"
            );

            icon.classList.add(
                "fa-eye-slash"
            );
        }

    } else {

        input.type = "password";

        if (icon) {
            icon.classList.remove(
                "fa-eye-slash"
            );

            icon.classList.add(
                "fa-eye"
            );
        }
    }
};


/* =========================================================
   TAB FUNCTIONS
   ========================================================= */

window.showSignInTab = function () {

    const signIn =
        document.getElementById(
            "signInContainer"
        );

    const signUp =
        document.getElementById(

        );

    const signInTab =
        document.getElementById(
            "signInTabBtn"
        );

    const signUpTab =
        document.getElementById(
            "signUpTabBtn"
        );


    if (signIn) signIn.style.display = "block";

    if (signUp) signUp.style.display = "none";


    if (signInTab) {

        signInTab.className =
            "flex-1 py-2.5 rounded-lg text-xs font-bold gold-gradient-bg text-navy-950 shadow-md transition";
    }


    if (signUpTab) {

        signUpTab.className =
            "flex-1 py-2.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition";
    }
};


window.showSignUpTab = function () {

    const signIn =
        document.getElementById(
            "signInContainer"
        );

    const signUp =
        document.getElementById(
            "signUpContainer"
        );

    const signInTab =
        document.getElementById(
            "signInTabBtn"
        );

    const signUpTab =
        document.getElementById(
            "signUpTabBtn"
        );


    if (signIn) signIn.style.display = "none";

    if (signUp) signUp.style.display = "block";


    if (signUpTab) {

        signUpTab.className =
            "flex-1 py-2.5 rounded-lg text-xs font-bold gold-gradient-bg text-navy-950 shadow-md transition";
    }


    if (signInTab) {

        signInTab.className =
            "flex-1 py-2.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition";
    }
};
</script>
