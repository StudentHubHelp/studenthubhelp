<script>
const SUPABASE_URL = "https://idurlccrarznnnqixxsd.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODY3NTgsImV4cCI6MjEwMzU2Mjc1OH0.pq_rza98twL-SETqm_6TGNzsPCkVJxwjoFUeLB1yMA";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

let allCafes = [];
let activeCafe = null;
let liveChannel = null;

/* =========================
   SAFE TEXT
========================= */
function esc(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================
   LOAD CAFES FROM SUPABASE
========================= */
async function loadCafes() {
    try {
        const { data, error } = await supabaseClient
            .from("cafes")
            .select("*");

        if (error) throw error;

        allCafes = data || [];

        renderCafes(allCafes);

        console.log("✅ Cafes loaded:", allCafes.length);

    } catch (error) {

        console.error("Cafe Supabase Error:", error);

        document.getElementById("cafesGridContainer").innerHTML = `
            <div class="col-span-full py-16 text-center text-red-400">
                <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i>
                <p class="text-sm font-bold">Unable to load cafes</p>
                <p class="text-xs text-slate-500 mt-1">
                    Please check Supabase table/RLS settings.
                </p>
            </div>
        `;
    }
}

/* =========================
   NORMALIZE DATABASE DATA
   Supports both old + new columns
========================= */
function cafeValue(c, newKey, oldKey, fallback = "") {
    return c?.[newKey] ??
           c?.[oldKey] ??
           fallback;
}

/* =========================
   RENDER CAFES
========================= */
function renderCafes(list) {

    const container =
        document.getElementById("cafesGridContainer");

    document.getElementById("cafeCountBadge").textContent =
        list.length;

    if (!list.length) {

        container.innerHTML = `
            <div class="col-span-full py-16 text-center text-slate-400">
                <i class="fa-solid fa-mug-hot text-3xl text-gold-500 mb-3"></i>
                <p class="text-sm">No cafes found.</p>
            </div>
        `;

        return;
    }

    container.innerHTML = list.map((c, index) => {

        const name = cafeValue(
            c, "name", "Name", "Cafe"
        );

        const address = cafeValue(
            c, "address", "Public/Exact Address",
            "Sikar, Rajasthan"
        );

        const area = cafeValue(
            c, "area", "Area", ""
        );

        const phone = cafeValue(
            c, "phone", "Contact", ""
        );

        const timing = cafeValue(
            c, "timing", "Opening Hours",
            "09:00 AM - 09:00 PM"
        );

        const facilities = cafeValue(
            c, "facilities", "Facilities",
            "Seating & refreshments"
        );

        const rating = cafeValue(
            c, "rating", "Google Rating",
            "4.5"
        );

        const food = cafeValue(
            c, "food_details", "Food Details",
            facilities
        );

        const image = cafeValue(
            c, "image", "Image",
            "cafe-banner.png"
        );

        const reviews = cafeValue(
            c, "review_count", "Review Count",
            "—"
        );

        return `
        <article
            onclick="openCafeModal(${index})"
            class="bg-navy-900 border border-navy-800 rounded-3xl
                   overflow-hidden gold-border-glow cursor-pointer
                   transition hover:border-gold-500/60">

            <div class="relative w-full h-40 bg-navy-950 overflow-hidden">

                <img
                    src="${esc(image)}"
                    onerror="this.src='cafe-banner.png'"
                    class="w-full h-full object-cover"
                    alt="${esc(name)}">

                <div class="absolute inset-0
                            bg-gradient-to-t
                            from-navy-900 via-transparent">
                </div>

                <span
                    class="absolute top-3 right-3
                           text-[11px] font-bold px-2.5 py-1
                           rounded-xl bg-navy-950/80
                           text-gold-300
                           border border-gold-500/30">

                    <i class="fa-solid fa-star text-[10px]"></i>
                    ${esc(rating)}
                    ${reviews !== "—" ? `(${esc(reviews)})` : ""}
                </span>

            </div>

            <div class="px-6 py-5 space-y-3">

                <h3 class="text-base font-bold text-white">
                    ${esc(name)}
                </h3>

                ${
                    area
                    ? `<p class="text-[11px] text-gold-400">
                         <i class="fa-solid fa-location-dot mr-1"></i>
                         ${esc(area)}
                       </p>`
                    : ""
                }

                <p class="text-xs text-slate-300">
                    <i class="fa-solid fa-location-dot
                              text-gold-500 mr-1"></i>
                    ${esc(address)}
                </p>

                <div class="p-3 bg-navy-850 rounded-2xl
                            border border-navy-700/60">

                    <span class="text-[10px] text-gold-400
                                 font-bold uppercase">
                        Food / Speciality
                    </span>

                    <p class="text-xs text-slate-200 mt-1">
                        ${esc(food)}
                    </p>

                </div>

            </div>

            <div class="px-6 pb-6 pt-3
                        border-t border-navy-800
                        flex items-center
                        justify-between gap-3">

                <span class="text-[11px] text-slate-400">
                    <i class="fa-solid fa-clock text-gold-400 mr-1"></i>
                    ${esc(timing)}
                </span>

                ${
                    phone
                    ? `<a
                        href="tel:${esc(phone)}"
                        onclick="event.stopPropagation()"
                        class="px-3.5 py-2 rounded-xl
                               gold-gradient-bg text-navy-950
                               font-bold text-xs">

                        <i class="fa-solid fa-phone"></i>
                        Call
                       </a>`
                    : ""
                }

            </div>

        </article>
        `;

    }).join("");
}

/* =========================
   OPEN MODAL
========================= */
function openCafeModal(index) {

    activeCafe = allCafes[index];

    if (!activeCafe) return;

    const c = activeCafe;

    const name = cafeValue(c, "name", "Name", "Cafe");
    const address = cafeValue(
        c, "address",
        "Public/Exact Address",
        "Sikar"
    );

    const phone = cafeValue(
        c, "phone",
        "Contact",
        ""
    );

    const image = cafeValue(
        c, "image",
        "Image",
        "cafe-banner.png"
    );

    document.getElementById("modalCafeTitle").textContent =
        name;

    document.getElementById("modalCafeAddress").innerHTML =
        `<i class="fa-solid fa-location-dot text-gold-500"></i>
         ${esc(address)}`;

    document.getElementById("modalCafeImg").src =
        image || "cafe-banner.png";

    document.getElementById("modalCafeCallBtn").href =
        phone ? `tel:${phone}` : "#";

    const cleanPhone =
        String(phone).replace(/[^0-9]/g, "");

    document.getElementById(
        "modalCafeWhatsAppBtn"
    ).href = cleanPhone
        ? `https://wa.me/${cleanPhone}?text=${encodeURIComponent(
            "Hi, I want to know more about " + name
        )}`
        : "#";

    switchCafeTab("overview");

    document
        .getElementById("cafeDetailModal")
        .classList.remove("hidden");
}

/* =========================
   CLOSE MODAL
========================= */
function closeCafeModal() {

    document
        .getElementById("cafeDetailModal")
        .classList.add("hidden");

    activeCafe = null;
}

/* =========================
   TABS
========================= */
function switchCafeTab(tabName) {

    document.querySelectorAll(".cafe-tab-btn").forEach(btn => {

        btn.className =
            "cafe-tab-btn px-3 py-1.5 rounded-xl " +
            "text-slate-300 hover:bg-navy-800 transition";

    });

    const activeBtn =
        document.getElementById(`tabBtn-${tabName}`);

    if (activeBtn) {

        activeBtn.className =
            "cafe-tab-btn px-3 py-1.5 rounded-xl " +
            "bg-gold-500 text-navy-950 transition " +
            "font-bold shadow-md";
    }

    if (!activeCafe) return;

    const c = activeCafe;

    const name =
        cafeValue(c, "name", "Name", "Cafe");

    const rating =
        cafeValue(c, "rating", "Google Rating", "4.5");

    const reviews =
        cafeValue(c, "review_count", "Review Count", "—");

    const food =
        cafeValue(
            c,
            "food_details",
            "Food Details",
            "Coffee, Tea, Snacks & Fast Food"
        );

    const facilities =
        cafeValue(
            c,
            "facilities",
            "Facilities",
            "Seating space & refreshments"
        );

    const timing =
        cafeValue(
            c,
            "timing",
            "Opening Hours",
            "09:00 AM - 09:00 PM"
        );

    const address =
        cafeValue(
            c,
            "address",
            "Public/Exact Address",
            "Sikar"
        );

    const content =
        document.getElementById("cafeTabContent");

    if (tabName === "overview") {

        content.innerHTML = `
            <div class="p-4 bg-navy-850 rounded-2xl
                        border border-navy-700 space-y-2">

                <strong class="text-gold-300 block">
                    About ${esc(name)}
                </strong>

                <p class="text-slate-200">
                    ${esc(name)} is listed on
                    StudentHubHelp as a student-friendly
                    cafe/food spot in Sikar.
                </p>

            </div>

            <div class="p-4 bg-navy-850 rounded-2xl
                        border border-navy-700">

                <strong class="text-gold-300 block">
                    Rating
                </strong>

                <p class="text-slate-200 mt-1">
                    ⭐ ${esc(rating)} / 5
                    ${reviews !== "—" ? `(${esc(reviews)} Reviews)` : ""}
                </p>

            </div>
        `;

    } else if (tabName === "food") {

        content.innerHTML = `
            <div class="p-4 bg-navy-850 rounded-2xl
                        border border-navy-700">

                <strong class="text-gold-300 block">
                    Food & Menu
                </strong>

                <p class="text-slate-200 mt-2">
                    ${esc(food)}
                </p>

            </div>
        `;

    } else if (tabName === "facilities") {

        content.innerHTML = `
            <div class="p-4 bg-navy-850 rounded-2xl
                        border border-navy-700">

                <strong class="text-gold-300 block">
                    Facilities
                </strong>

                <p class="text-slate-200 mt-2">
                    ${esc(facilities)}
                </p>

            </div>
        `;

    } else if (tabName === "timing") {

        content.innerHTML = `
            <div class="p-4 bg-navy-850 rounded-2xl
                        border border-navy-700">

                <strong class="text-gold-300 block">
                    Opening Hours
                </strong>

                <p class="text-slate-200 mt-2">
                    🕒 ${esc(timing)}
                </p>

            </div>
        `;

    } else if (tabName === "reviews") {

        content.innerHTML = `
            <div class="p-4 bg-navy-850 rounded-2xl
                        border border-navy-700">

                <strong class="text-gold-300 block">
                    Reviews
                </strong>

                <p class="text-slate-200 mt-2">
                    ${
                        reviews !== "—"
                        ? `${esc(reviews)} reviews`
                        : "Review information not available."
                    }
                </p>

            </div>
        `;

    } else if (tabName === "location") {

        content.innerHTML = `
            <div class="p-4 bg-navy-850 rounded-2xl
                        border border-navy-700">

                <strong class="text-gold-300 block">
                    Exact Address
                </strong>

                <p class="text-slate-200 mt-2">
                    📍 ${esc(address)}
                </p>

            </div>
        `;
    }
}

/* =========================
   SEARCH
========================= */
document
    .getElementById("cafeSearchInput")
    .addEventListener("input", function () {

        const query =
            this.value.toLowerCase().trim();

        const filtered = allCafes.filter(c => {

            const values = [
                cafeValue(c, "name", "Name"),
                cafeValue(c, "area", "Area"),
                cafeValue(c, "address", "Public/Exact Address"),
                cafeValue(c, "food_details", "Food Details"),
                cafeValue(c, "facilities", "Facilities")
            ];

            return values.some(value =>
                String(value || "")
                    .toLowerCase()
                    .includes(query)
            );
        });

        renderCafes(filtered);
    });

/* =========================
   SUPABASE REALTIME
========================= */
function startRealtime() {

    if (liveChannel) {
        supabaseClient.removeChannel(liveChannel);
    }

    liveChannel = supabaseClient
        .channel("studenthubhelp-cafes-live")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "cafes"
            },
            async payload => {

                console.log(
                    "🔴 LIVE CAFE CHANGE:",
                    payload.eventType
                );

                await loadCafes();
            }
        )
        .subscribe(status => {

            console.log(
                "Cafe realtime status:",
                status
            );

        });
}

/* =========================
   START
========================= */
window.addEventListener(
    "DOMContentLoaded",
    async () => {

        await loadCafes();

        startRealtime();
    }
);

/* =========================
   ESC CLOSE MODAL
========================= */
document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            !document
                .getElementById("cafeDetailModal")
                .classList.contains("hidden")
        ) {
            closeCafeModal();
        }

    }
);
</script>
