<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Hostels & PGs in Sikar | StudentHubHelp</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 950: '#040814', 900: '#081026', 850: '#0D1838', 800: '#14224D', 700: '#1F316B' },
                        gold: { 100: '#FFF7D6', 200: '#FDECB2', 300: '#F5DE88', 400: '#E6C65E', 500: '#D4AF37', 600: '#B89020', 700: '#8C6B10' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">
    <nav class="bg-navy-900 border-b border-gold-500/15 px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-40">
        <a href="./" class="flex items-center gap-3">
            <div class='w-10 h-10 rounded-xl bg-gold-500 text-navy-950 font-bold flex items-center justify-center'>SH</div>
            <div>
                <span class="text-lg font-display font-bold text-gold-400">StudentHubHelp</span>
                <span class="block text-[10px] text-slate-400 uppercase">Sikar Student Platform</span>
            </div>
        </a>
        <a href="./" class="px-4 py-2 rounded-xl bg-navy-850 border border-gold-500/30 text-gold-300 text-xs font-bold"><i class="fa-solid fa-home"></i> Home</a>
    </nav>
    <header class="bg-navy-900 py-12 px-4 text-center border-b border-navy-800">
        <h1 class="text-3xl font-display font-bold text-white mb-2">Verified Hostels & PGs in Sikar</h1>
        <div class="max-w-xl mx-auto mt-4 relative">
            <input type="text" id="hostelSearchInput" placeholder="Search hostel by name, area or facilities..." class="w-full bg-navy-850 border border-navy-700 rounded-2xl px-4 py-3 text-xs text-white">
        </div>
    </header>
    <main class="max-w-7xl w-full mx-auto px-4 py-10 flex-1">
        <h2 class="text-base font-bold text-white mb-6">All Verified Hostels (<span id="hostelCountBadge">0</span>)</h2>
        <div id="hostelsGridContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-16 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-3xl text-gold-500 mb-2"></i><p class="text-xs">Loading live hostels...</p></div>
        </div>
    </main>
    <footer class="bg-navy-900 py-6 text-slate-500 text-xs text-center border-t border-navy-800">© 2026 StudentHubHelp • Director: Satpal Swami</footer>
    <script>
        const supabaseClient = supabase.createClient("https://idurlccrarznnnqixxsd.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdXJsY2NyYXJ6bm5ucWl4eHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODY3NTgsImV4cCI6MjEwMzU2Mjc1OH0.pq_rza98twL-SETqm_6TGNzsPCkVJxwjocFUeLB1yMA");
        let allHostels = [];
        async function loadHostels() {
            const { data } = await supabaseClient.from('hostels').select('*').order('id', { ascending: true });
            allHostels = data || [];
            renderHostels(allHostels);
        }
        function renderHostels(list) {
            const container = document.getElementById('hostelsGridContainer');
            document.getElementById('hostelCountBadge').textContent = list.length;
            if(!list.length) { container.innerHTML = '<div class="col-span-full text-center text-slate-400">No hostels found.</div>'; return; }
            container.innerHTML = list.map(h => `
                <div class="bg-navy-900 border border-navy-800 rounded-3xl p-5 space-y-3">
                    <h3 class="text-base font-bold text-white">${h["Hostel Name (Supplied)"] || h.name || 'Hostel'}</h3>
                    <p class="text-xs text-slate-300"><i class="fa-solid fa-location-dot text-gold-500 mr-1"></i>${h["Verified / Live Address"] || h.address || 'Sikar'}</p>
                    <div class="p-2.5 bg-navy-850 rounded-xl text-xs text-slate-200">Facilities: ${h["Facilities"] || h.facilities || 'Standard'}</div>
                    <a href="tel:${h["Contact (Verified)"] || h.phone || '9929718264'}" class="block text-center py-2.5 rounded-xl bg-gold-500 text-navy-950 font-bold text-xs"><i class="fa-solid fa-phone"></i> Call Warden</a>
                </div>
            `).join('');
        }
        document.getElementById('hostelSearchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            renderHostels(allHostels.filter(h => (h["Hostel Name (Supplied)"] || '').toLowerCase().includes(q)));
        });
        window.addEventListener('DOMContentLoaded', loadHostels);
    </script>
</body>
</html>
