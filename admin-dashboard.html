<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudentHubHelp | Master Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f8fafc;color:#0f172a}.side{scrollbar-width:thin}.view{display:none}.view.on{display:block}.chip{border:1px solid #e2e8f0;border-radius:999px;padding:.3rem .65rem;font-size:.72rem;font-weight:700}.modal{display:none}.modal.open{display:flex}.toast{animation:in .2s ease}@keyframes in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}@media(max-width:900px){#sidebar{position:fixed;z-index:30;transform:translateX(-100%);transition:.2s}#sidebar.open{transform:translateX(0)}#main{margin-left:0!important}.mobile-table{display:block;overflow:auto}}</style></head>
<body><div id="shell" class="min-h-screen"><aside id="sidebar" class="side fixed inset-y-0 left-0 w-72 overflow-y-auto bg-slate-950 p-5 text-slate-300"><div class="mb-8"><div class="text-xl font-black text-white">StudentHubHelp</div><div class="mt-1 text-xs font-bold tracking-widest text-sky-400">MASTER ADMIN</div></div><nav id="nav" class="space-y-1"></nav></aside>
<main id="main" class="ml-72 min-h-screen"><header class="sticky top-0 z-20 flex gap-3 border-b bg-white/95 p-4 backdrop-blur"><button onclick="sidebarToggle()" class="rounded-lg border px-3 lg:hidden">☰</button><div class="relative flex-1"><input id="globalSearch" oninput="debounceSearch()" class="w-full rounded-xl border px-4 py-2.5" placeholder="Search property, phone, owner, student, ID…"><div id="searchResults" class="absolute z-40 mt-1 hidden w-full overflow-hidden rounded-xl border bg-white shadow-xl"></div></div><button onclick="openNotifications()" class="relative rounded-xl border px-3">🔔<span id="bell" class="ml-1 text-xs font-bold"></span></button><span id="sync" class="hidden rounded-xl bg-emerald-50 px-3 py-2 text-xs font-bold text-emerald-700 sm:block">● LIVE</span></header>
<div class="mx-auto max-w-7xl p-4 md:p-7"><div class="mb-6 flex items-start justify-between gap-4"><div><h1 id="title" class="text-2xl font-black"></h1><p id="subtitle" class="mt-1 text-sm text-slate-500"></p></div><button onclick="refresh()" class="rounded-xl border px-3 py-2 text-sm font-bold">Refresh</button></div><div id="failure" class="mb-5 hidden rounded-xl border border-red-200 bg-red-50 p-4 text-red-800"></div><div id="views"></div></div></main></div>
<div id="modal" class="modal fixed inset-0 z-50 items-center justify-center bg-slate-950/50 p-3"><div class="max-h-[92vh] w-full max-w-4xl overflow-y-auto rounded-2xl bg-white"><div class="sticky top-0 flex items-center justify-between border-b bg-white p-5"><h2 id="modalTitle" class="text-lg font-black"></h2><button onclick="closeModal()" class="rounded-lg px-3 py-1 text-xl">×</button></div><div id="modalBody" class="p-5"></div></div></div><div id="toasts" class="fixed bottom-4 right-4 z-[60] space-y-2"></div>
<script>
/* Same Supabase project and anon-key pattern as the existing StudentHubHelp pages. */
const SUPABASE_URL='https://idurlccrarznnnqixxsd.supabase.co', SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdXJsY2NyYXJ6bm5ucWl4eHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5ODY3NTgsImV4cCI6MjEwMzU2Mjc1OH0.pq_rza98twL-SETqm_6TGNzsPCkVJxwjocFUeLB1yMA';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); const CATS=['hostels','tiffins','cafes','libraries','bookstores'];
const S={profile:null,properties:[],profiles:[],bookings:[],reviews:[],listings:[],claims:[],verifications:[],reports:[],media:[],areas:[],notifications:[],logs:[],settings:[],view:'overview',loading:new Set(),errors:{}};
const routes={overview:['Dashboard overview','Live platform, attention queues and top performance'],properties:['Property management','All categories, status, verification, filters, bulk actions and export'],students:['Student management','Profiles, bookings, reviews, reports and account state'],owners:['Owner management','Ownership, listings, claims and activity'],listings:['Listing requests','Approve, reject or request correction'],claims:['Claim requests','Review and safely connect ownership'],verification:['Verification center','Pending, approved, rejected and re-verification'],bookings:['Bookings','Hostel, tiffin and library booking operations'],reviews:['Reviews','Moderation queue and property feedback'],reports:['Reports & complaints','Investigation and resolution workflow'],media:['Media & gallery','Supabase Storage: property-images'],featured:['Featured properties','Priority and visibility controls'],analytics:['Analytics','Views, bookings, category and area performance'],areas:['Areas','Standardized location management'],notifications:['Notifications','Realtime operational inbox'],activity:['Activity & change history','Audited security trail'],settings:['System & category settings','Platform switches and field configurations']};
const nav=[['overview','⌂','Dashboard'],['properties','▦','Properties'],['students','♙','Students'],['owners','♜','Owners'],['listings','✉','Listing requests'],['claims','⌁','Claim requests'],['verification','✓','Verification'],['bookings','▣','Bookings'],['reviews','★','Reviews'],['reports','⚑','Reports'],['media','▧','Media / Gallery'],['featured','✦','Featured'],['analytics','◔','Analytics'],['areas','⌖','Areas'],['notifications','🔔','Notifications'],['activity','☷','Activity logs'],['settings','⚙','Settings']];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const date=v=>v?new Intl.DateTimeFormat('en-IN',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';
const status=v=>`<span class="chip ${String(v).match(/active|approved|published|resolved|verified/) ? 'bg-emerald-50 text-emerald-700':String(v).match(/reject|suspend|flag|disabled/) ? 'bg-red-50 text-red-700':'bg-amber-50 text-amber-700'}">${esc(v||'pending')}</span>`;
function toast(m,bad=false){const e=document.createElement('div');e.className=`toast rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-lg ${bad?'bg-red-600':'bg-slate-900'}`;e.textContent=m;toasts.append(e);setTimeout(()=>e.remove(),4000)}
function sidebarToggle(){sidebar.classList.toggle('open')} function closeModal(){modal.classList.remove('open')} function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modal.classList.add('open')} function showError(where,e){console.error(where,e);S.errors[where]=e.message||String(e);failure.innerHTML=`<b>Unable to load ${esc(where)}.</b> ${esc(S.errors[where])} <button class="ml-3 underline" onclick="refresh()">Retry</button>`;failure.classList.remove('hidden')}
function setView(v){S.view=v;title.textContent=routes[v][0];subtitle.textContent=routes[v][1];navRender();render();sidebar.classList.remove('open')}
function navRender(){nav.innerHTML=nav.map(([id,icon,label])=>`<button onclick="setView('${id}')" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-bold ${S.view===id?'bg-sky-500 text-white':'hover:bg-slate-800'}"><span>${icon}</span>${label}${badge(id)}</button>`).join('')}
function badge(id){const n=id==='listings'?S.listings.filter(x=>x.status==='pending').length:id==='claims'?S.claims.filter(x=>x.status==='pending').length:id==='verification'?S.verifications.filter(x=>/pending|reverification/.test(x.status)).length:id==='reports'?S.reports.filter(x=>/open|investigating/.test(x.status)).length:0;return n?`<span class="ml-auto rounded-full bg-white/20 px-2 py-.5 text-xs">${n}</span>`:''}
async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='auth.html?role=admin';return false}const {data,error}=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||String(data?.role).toLowerCase()!=='admin'){await db.auth.signOut();location.href='auth.html?role=admin';return false}S.profile=data;return true}
async function optional(table,target){try{const {data,error}=await db.from(table).select('*');if(error)throw error;S[target]=data||[]}catch(e){console.warn('Optional admin module unavailable:',table,e.message);S[target]=[]}}
async function loadProperties(){
  const unified=await db.from('admin_properties').select('*');
  if(!unified.error){return {data:unified.data||[],error:null}}
  /* The read-only fallback keeps the existing site usable before the optional
     admin_properties view migration has been run. It uses only known legacy tables. */
  if(unified.error.code!=='PGRST205'){return unified}
  const legacy=await Promise.all(CATS.map(category=>db.from(category).select('*')));
  const failed=legacy.find(result=>result.error);
  if(failed)return {data:[],error:failed.error};
  return {data:legacy.flatMap((result,index)=>(result.data||[]).map(row=>({
    ...row, category:CATS[index], id:String(row.id),
    status:row.status||'active', verified:Boolean(row.verified), featured:Boolean(row.featured),
    details:row
  }))),error:null};
}
async function refresh(){failure.classList.add('hidden');const core=await Promise.allSettled([loadProperties(),db.from('profiles').select('*'),db.from('student_bookings').select('*'),db.from('reviews').select('*'),db.from('listing_requests').select('*'),db.from('claim_requests').select('*')]); const names=['properties','profiles','bookings','reviews','listings','claims'];core.forEach((r,i)=>{if(r.status==='fulfilled'&&!r.value.error)S[names[i]]=r.value.data||[];else showError(names[i],r.reason||r.value.error)});await Promise.all([optional('verification_requests','verifications'),optional('reports','reports'),optional('property_media','media'),optional('areas','areas'),optional('notifications','notifications'),optional('admin_activity_log','logs'),optional('platform_settings','settings')]);bell.textContent=S.notifications.filter(n=>!n.read_at).length||'';navRender();render()}
function card(label,value,action,sub=''){return `<button onclick="setView('${action}')" class="rounded-2xl border bg-white p-5 text-left shadow-sm transition hover:-translate-y-0.5"><div class="text-sm font-semibold text-slate-500">${label}</div><div class="mt-2 text-3xl font-black">${value}</div><div class="mt-1 text-xs text-slate-400">${sub}</div></button>`}
function overview(){const total=S.properties.length, by=c=>S.properties.filter(x=>x.category===c).length, role=r=>S.profiles.filter(x=>String(x.role).toLowerCase()===r).length;const pending=[['Listings',S.listings.filter(x=>x.status==='pending').length,'listings'],['Claims',S.claims.filter(x=>x.status==='pending').length,'claims'],['Verification',S.verifications.filter(x=>/pending|reverification/.test(x.status)).length,'verification'],['Bookings',S.bookings.filter(x=>x.status==='pending').length,'bookings'],['Reviews',S.reviews.filter(x=>x.status==='pending').length,'reviews'],['Open reports',S.reports.filter(x=>/open|investigating/.test(x.status)).length,'reports']];const top=[...S.properties].sort((a,b)=>(b.view_count||0)-(a.view_count||0))[0];return `<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">${card('Total properties',total,'properties','All active and pending records')}${CATS.map(c=>card(c[0].toUpperCase()+c.slice(1),by(c),'properties','Open filtered property control')).join('')}${card('Students',role('student'),'students')}${card('Owners',role('owner'),'owners')}</div><h2 class="mt-8 text-lg font-black">Needs attention</h2><div class="mt-3 grid gap-3 sm:grid-cols-2 xl:grid-cols-3">${pending.map(x=>card(x[0]+' pending',x[1],x[2],'Open queue')).join('')}</div><div class="mt-8 grid gap-4 lg:grid-cols-2"><section class="rounded-2xl border bg-white p-5"><h2 class="font-black">Top performing</h2><p class="mt-3 text-sm">Most viewed: <b>${esc(top?.name||'No view data yet')}</b></p><p class="mt-2 text-sm">Featured: <b>${S.properties.filter(x=>x.featured).length}</b> properties</p></section><section class="rounded-2xl border bg-white p-5"><h2 class="font-black">Live overview</h2><p class="mt-3 text-sm text-slate-600">New data is synchronized through Supabase Realtime. Counts are never replaced by fake zeroes if a query fails.</p></section></div>`}
function toolbar(extra=''){return `<div class="mb-4 flex flex-col gap-3 rounded-2xl border bg-white p-3 md:flex-row"><input id="filter" oninput="render()" class="min-w-0 flex-1 rounded-xl border px-3 py-2" placeholder="Search this section…">${extra}<button onclick="exportRows()" class="rounded-xl border px-3 py-2 text-sm font-bold">Export CSV</button></div>`}
function table(headers,rows){return rows.length?`<div class="mobile-table rounded-2xl border bg-white"><table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs uppercase text-slate-500"><tr>${headers.map(x=>`<th class="px-4 py-3">${x}</th>`).join('')}</tr></thead><tbody class="divide-y">${rows.join('')}</tbody></table></div>`:`<div class="rounded-2xl border bg-white p-10 text-center text-slate-500">Nothing here yet. Everything is up to date.</div>`}
function q(rows,keys){const f=(filter?.value||'').toLowerCase();return f?rows.filter(r=>keys.some(k=>String(r[k]??'').toLowerCase().includes(f))):rows}
function properties(){const rows=q(S.properties,['name','id','area','phone','slug','owner_id','category','status']).map(x=>`<tr class="hover:bg-slate-50"><td class="px-4 py-3"><button onclick="propertyDetail('${x.category}','${esc(x.id)}')" class="font-bold text-sky-700">${esc(x.name)}</button><div class="text-xs text-slate-400">${esc(x.id)} · ${esc(x.slug||'no slug')}</div></td><td class="px-4 py-3">${esc(x.category)}</td><td class="px-4 py-3">${esc(x.area||'—')}</td><td class="px-4 py-3">${status(x.status)} ${x.verified?'<span class="chip bg-sky-50 text-sky-700">verified</span>':''}</td><td class="px-4 py-3">${x.rating??'—'}</td><td class="px-4 py-3"><button onclick="propertyDetail('${x.category}','${esc(x.id)}')" class="font-bold text-sky-700">Open</button></td></tr>`);return toolbar(`<select id="category" onchange="render()" class="rounded-xl border px-3"><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select>`)+table(['Property','Category','Area','State','Rating',''],q(S.properties.filter(x=>!category?.value||x.category===category.value),['name','id','area','phone','slug','owner_id','category','status']).map(x=>`<tr class="hover:bg-slate-50"><td class="px-4 py-3"><button onclick="propertyDetail('${x.category}','${esc(x.id)}')" class="font-bold text-sky-700">${esc(x.name)}</button><div class="text-xs text-slate-400">${esc(x.id)}</div></td><td class="px-4 py-3">${esc(x.category)}</td><td class="px-4 py-3">${esc(x.area||'—')}</td><td class="px-4 py-3">${status(x.status)} ${x.verified?'✓':''}</td><td class="px-4 py-3">${x.rating??'—'}</td><td class="px-4 py-3"><button onclick="propertyDetail('${x.category}','${esc(x.id)}')" class="font-bold text-sky-700">Open</button></td></tr>`))}
async function propertyDetail(category,id){const p=S.properties.find(x=>x.category===category&&String(x.id)===String(id));if(!p)return;const linked={bookings:S.bookings.filter(x=>String(x.property_id)===String(id)),reviews:S.reviews.filter(x=>String(x.property_id)===String(id)),reports:S.reports.filter(x=>String(x.property_id)===String(id)),media:S.media.filter(x=>x.property_category===category&&String(x.property_id)===String(id))};openModal(p.name,`<div class="flex flex-wrap gap-2">${status(p.status)}<span class="chip">${p.verified?'✓ Verified':'Not verified'}</span>${p.featured?'<span class="chip">★ Featured</span>':''}</div><dl class="mt-5 grid gap-3 sm:grid-cols-2"><div><dt class="text-xs font-bold text-slate-400">Property ID</dt><dd>${esc(id)}</dd></div><div><dt class="text-xs font-bold text-slate-400">Category</dt><dd>${esc(category)}</dd></div><div><dt class="text-xs font-bold text-slate-400">Owner ID</dt><dd>${esc(p.owner_id||'Unlinked')}</dd></div><div><dt class="text-xs font-bold text-slate-400">Contact</dt><dd>${esc(p.phone||'—')}</dd></div><div><dt class="text-xs font-bold text-slate-400">Address</dt><dd>${esc(p.address||'—')}</dd></div><div><dt class="text-xs font-bold text-slate-400">Area</dt><dd>${esc(p.area||'—')}</dd></div></dl><div class="mt-5 rounded-xl bg-slate-50 p-4 text-sm"><b>Category-specific data</b><pre class="mt-2 overflow-auto text-xs">${esc(JSON.stringify(p.details||{},null,2))}</pre></div><div class="mt-5 flex flex-wrap gap-2"><button onclick="propertyState('${category}','${esc(id)}',{verified:true})" class="rounded-xl bg-sky-600 px-3 py-2 text-sm font-bold text-white">Verify</button><button onclick="propertyState('${category}','${esc(id)}',{verified:false})" class="rounded-xl border px-3 py-2 text-sm font-bold">Unverify</button><button onclick="propertyState('${category}','${esc(id)}',{status:'active'})" class="rounded-xl border px-3 py-2 text-sm font-bold">Activate</button><button onclick="suspend('${category}','${esc(id)}')" class="rounded-xl border border-red-200 px-3 py-2 text-sm font-bold text-red-700">Suspend</button><button onclick="propertyState('${category}','${esc(id)}',{featured:${!p.featured}})" class="rounded-xl border px-3 py-2 text-sm font-bold">${p.featured?'Unfeature':'Feature'}</button>${p.slug?`<a class="rounded-xl border px-3 py-2 text-sm font-bold" target="_blank" href="property-details.html?type=${encodeURIComponent(category)}&slug=${encodeURIComponent(p.slug)}">Public preview ↗</a>`:''}</div><div class="mt-6 grid gap-3 sm:grid-cols-4">${Object.entries(linked).map(([k,v])=>`<button onclick="setView('${k==='media'?'media':k}')" class="rounded-xl border p-3 text-left"><b>${v.length}</b><div class="text-xs text-slate-500">${k}</div></button>`).join('')}</div>`)}
async function propertyState(category,id,patch,reason=null){try{const {error}=await db.rpc('admin_set_property_state',{p_category:category,p_id:String(id),p_patch:patch,p_reason:reason});if(error)throw error;toast('Property updated and audit logged.');closeModal();await refresh()}catch(e){toast(e.message,true)}} async function suspend(c,id){const reason=prompt('Why are you suspending this property? This reason will be logged.');if(reason!==null)propertyState(c,id,{status:'suspended'},reason)}
function people(role){const rows=q(S.profiles.filter(x=>String(x.role).toLowerCase()===role),['full_name','email','phone','id','status']).map(x=>`<tr><td class="px-4 py-3"><button class="font-bold text-sky-700" onclick="personDetail('${esc(x.id)}')">${esc(x.full_name||'Unnamed')}</button><div class="text-xs text-slate-400">${esc(x.id)}</div></td><td class="px-4 py-3">${esc(x.email||'—')}<div class="text-xs">${esc(x.phone||'')}</div></td><td class="px-4 py-3">${status(x.status||'active')}</td><td class="px-4 py-3">${date(x.created_at)}</td></tr>`);return toolbar()+table([role,'Contact','Status','Joined'],rows)}
function personDetail(id){const p=S.profiles.find(x=>String(x.id)===String(id));const props=S.properties.filter(x=>String(x.owner_id)===String(id));openModal(p.full_name||p.email,`<p>${esc(p.email||'—')} · ${esc(p.phone||'—')}</p><div class="mt-5 grid grid-cols-3 gap-3"><div class="rounded-xl border p-3"><b>${props.length}</b><br><span class="text-xs">Properties</span></div><div class="rounded-xl border p-3"><b>${S.bookings.filter(x=>String(x.student_id||x.user_id)===id).length}</b><br><span class="text-xs">Bookings</span></div><div class="rounded-xl border p-3"><b>${S.reviews.filter(x=>String(x.user_id)===id).length}</b><br><span class="text-xs">Reviews</span></div></div><button onclick="toggleAccount('${esc(id)}','${esc(p.status||'active')}')" class="mt-5 rounded-xl border px-3 py-2 font-bold">${p.status==='disabled'?'Enable':'Disable'} account</button>`)}
async function toggleAccount(id,current){if(!confirm(`Change this account to ${current==='disabled'?'active':'disabled'}?`))return;const {error}=await db.from('profiles').update({status:current==='disabled'?'active':'disabled'}).eq('id',id);if(error)toast(error.message,true);else{toast('Account status changed.');closeModal();refresh()}}
function genericRows(key,cols,actions=''){return toolbar()+table(cols.map(x=>x[1]),q(S[key],cols.map(x=>x[0])).map(x=>`<tr>${cols.map(([k])=>`<td class="px-4 py-3">${k==='status'?status(x[k]):esc(x[k]??'—')}</td>`).join('')}<td class="px-4 py-3">${actions?`<button onclick="recordDetail('${key}','${esc(x.id)}')" class="font-bold text-sky-700">Open</button>`:''}</td></tr>`))}
function recordDetail(key,id){const x=S[key].find(v=>String(v.id)===String(id));openModal(`${key} #${id}`,`<pre class="overflow-auto rounded-xl bg-slate-50 p-4 text-xs">${esc(JSON.stringify(x,null,2))}</pre><div class="mt-4 flex gap-2">${x?.status?`<select id="newStatus" class="rounded-xl border p-2"><option>pending</option><option>approved</option><option>active</option><option>published</option><option>hidden</option><option>investigating</option><option>resolved</option><option>rejected</option></select><button onclick="setRecordStatus('${key}','${esc(id)}')" class="rounded-xl bg-slate-900 px-3 py-2 font-bold text-white">Save status</button>`:''}</div>`)}
async function setRecordStatus(key,id){const table={listings:'listing_requests',claims:'claim_requests',bookings:'student_bookings',reviews:'reviews',reports:'reports',verifications:'verification_requests'}[key];const {error}=await db.from(table).update({status:newStatus.value}).eq('id',id);if(error)toast(error.message,true);else{toast('Status updated.');closeModal();refresh()}}
function mediaView(){return `<div class="rounded-2xl border bg-white p-5"><h2 class="font-black">Upload property image</h2><p class="mt-1 text-sm text-slate-500">Uploads are restricted by the SQL Storage policy to master admins.</p><form onsubmit="uploadMedia(event)" class="mt-4 grid gap-3 md:grid-cols-4"><select id="mediaCategory" class="rounded-xl border p-2">${CATS.map(x=>`<option>${x}</option>`)}</select><input id="mediaPropertyId" class="rounded-xl border p-2" required placeholder="Property ID"><select id="mediaType" class="rounded-xl border p-2"><option>main</option><option>room</option><option>bathroom</option><option>building</option><option>mess</option><option>other</option></select><input id="mediaFile" class="rounded-xl border p-2" type="file" accept="image/png,image/jpeg,image/webp" required><button class="rounded-xl bg-slate-900 px-3 py-2 font-bold text-white">Upload</button></form></div><div class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${S.media.map(x=>`<article class="overflow-hidden rounded-2xl border bg-white"><img class="h-40 w-full object-cover" src="${SUPABASE_URL}/storage/v1/object/public/property-images/${encodeURIComponent(x.storage_path).replace(/%2F/g,'/')}" alt="${esc(x.alt_text||'Property image')}"><div class="p-3 text-sm"><b>${esc(x.property_category)} / ${esc(x.property_id)}</b><div>${esc(x.media_type)}</div><button onclick="deleteMedia('${esc(x.id)}','${esc(x.storage_path)}')" class="mt-2 text-xs font-bold text-red-700">Delete</button></div></article>`).join('')||'<p class="text-slate-500">No media records yet.</p>'}</div>`}
async function uploadMedia(e){e.preventDefault();const f=mediaFile.files[0],path=`${mediaCategory.value}/${mediaPropertyId.value}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let r=await db.storage.from('property-images').upload(path,f,{upsert:false});if(r.error)return toast(r.error.message,true);r=await db.from('property_media').insert({property_category:mediaCategory.value,property_id:mediaPropertyId.value,storage_path:path,media_type:mediaType.value,is_main:mediaType.value==='main'});if(r.error)toast(r.error.message,true);else{toast('Image uploaded.');refresh()}}async function deleteMedia(id,path){if(!confirm('Delete this image permanently from Storage and gallery metadata?'))return;const r=await db.storage.from('property-images').remove([path]);if(r.error)return toast(r.error.message,true);const {error}=await db.from('property_media').delete().eq('id',id);if(error)toast(error.message,true);else{toast('Image deleted.');refresh()}}
function analytics(){const cat=CATS.map(c=>[c,S.properties.filter(x=>x.category===c).length]);const area={};S.properties.forEach(x=>area[x.area||'Unspecified']=(area[x.area||'Unspecified']||0)+1);return `<div class="grid gap-4 md:grid-cols-3">${card('Total views',S.properties.reduce((n,x)=>n+Number(x.view_count||0),0),'properties')}${card('Bookings',S.bookings.length,'bookings')}${card('Average rating',(S.properties.reduce((n,x)=>n+Number(x.rating||0),0)/Math.max(S.properties.filter(x=>x.rating).length,1)).toFixed(1),'properties')}</div><div class="mt-5 grid gap-4 lg:grid-cols-2"><section class="rounded-2xl border bg-white p-5"><h2 class="font-black">Category coverage</h2>${cat.map(([n,v])=>`<div class="mt-3 flex justify-between"><span>${esc(n)}</span><b>${v}</b></div>`).join('')}</section><section class="rounded-2xl border bg-white p-5"><h2 class="font-black">Areas by property count</h2>${Object.entries(area).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n,v])=>`<div class="mt-3 flex justify-between"><span>${esc(n)}</span><b>${v}</b></div>`).join('')}</section></div>`}
function areasView(){return `<form onsubmit="addArea(event)" class="mb-4 flex flex-wrap gap-2 rounded-2xl border bg-white p-3"><input id="areaName" required class="rounded-xl border p-2" placeholder="Area name"><input id="areaCity" class="rounded-xl border p-2" placeholder="City"><button class="rounded-xl bg-slate-900 px-3 py-2 font-bold text-white">Add area</button></form>`+genericRows('areas',[['name','Area'],['city','City'],['state','State'],['active','Active']],true)}async function addArea(e){e.preventDefault();const {error}=await db.from('areas').insert({name:areaName.value,city:areaCity.value||null});if(error)toast(error.message,true);else{toast('Area added.');refresh()}}
function settingsView(){return `<div class="rounded-2xl border bg-white p-5"><h2 class="font-black">Platform settings</h2><p class="mt-1 text-sm text-slate-500">Key/value settings are deliberately JSON-backed so future flags do not require unsafe frontend schema guesses.</p><form onsubmit="saveSetting(event)" class="mt-4 grid gap-3 md:grid-cols-3"><input id="settingKey" class="rounded-xl border p-2" required placeholder="e.g. booking_enabled"><textarea id="settingValue" class="rounded-xl border p-2" required placeholder='true or {"contact":"…"}'></textarea><button class="rounded-xl bg-slate-900 px-3 py-2 font-bold text-white">Save setting</button></form><div class="mt-5">${S.settings.map(x=>`<div class="border-b py-3"><b>${esc(x.key)}</b><pre class="text-xs">${esc(JSON.stringify(x.value))}</pre></div>`).join('')||'<span class="text-slate-500">No settings yet.</span>'}</div></div>`}async function saveSetting(e){e.preventDefault();let value;try{value=JSON.parse(settingValue.value)}catch{value=settingValue.value}const {error}=await db.from('platform_settings').upsert({key:settingKey.value,value,updated_by:S.profile.id});if(error)toast(error.message,true);else{toast('Setting saved.');refresh()}}
function exportRows(){const data=S[S.view==='properties'?'properties':S.view]||[];if(!data.length)return toast('There is no data to export.',true);const keys=[...new Set(data.flatMap(Object.keys))];const csv=[keys.join(','),...data.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`studenthubhelp-${S.view}.csv`;a.click();URL.revokeObjectURL(a.href)}
let searchTimer;function debounceSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(search,200)}function search(){const v=globalSearch.value.trim().toLowerCase();if(!v){searchResults.classList.add('hidden');return}const found=[...S.properties.map(x=>({type:'Property',label:x.name,id:x.id,go:()=>propertyDetail(x.category,x.id)})),...S.profiles.map(x=>({type:String(x.role||'User'),label:x.full_name||x.email,id:x.id,go:()=>personDetail(x.id)}))].filter(x=>`${x.label} ${x.id}`.toLowerCase().includes(v)).slice(0,10);searchResults.innerHTML=found.length?found.map((x,i)=>`<button onclick="searchPick(${i})" class="block w-full border-b px-4 py-3 text-left hover:bg-slate-50"><b>${esc(x.label)}</b><span class="ml-2 text-xs text-slate-500">${esc(x.type)} · ${esc(x.id)}</span></button>`).join(''):'<div class="p-4 text-sm text-slate-500">No matching accessible records.</div>';window._results=found;searchResults.classList.remove('hidden')}function searchPick(i){searchResults.classList.add('hidden');globalSearch.value='';window._results[i].go()}
function openNotifications(){setView('notifications')} function subscribe(){['notifications','reports','verification_requests','listing_requests','claim_requests','student_bookings','reviews'].forEach(t=>db.channel('admin-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>refresh()).subscribe())}
function render(){const v={overview,properties,students:()=>people('student'),owners:()=>people('owner'),listings:()=>genericRows('listings',[['id','ID'],['name','Property'],['owner_id','Owner'],['status','Status'],['created_at','Submitted']],true),claims:()=>genericRows('claims',[['id','ID'],['property_id','Property'],['claimant_id','Claimant'],['status','Status'],['created_at','Submitted']],true),verification:()=>genericRows('verifications',[['id','ID'],['property_category','Category'],['property_id','Property'],['status','Status'],['created_at','Submitted']],true),bookings:()=>genericRows('bookings',[['id','Booking ID'],['property_id','Property'],['student_id','Student'],['status','Status'],['created_at','Date']],true),reviews:()=>genericRows('reviews',[['id','ID'],['property_id','Property'],['rating','Rating'],['status','Status'],['created_at','Date']],true),reports:()=>genericRows('reports',[['id','ID'],['property_id','Property'],['reason','Reason'],['status','Status'],['created_at','Date']],true),media:mediaView,featured:()=>{const old=S.properties;S.properties=S.properties.filter(x=>x.featured);const html=properties();S.properties=old;return html},analytics,areas:areasView,notifications:()=>genericRows('notifications',[['title','Notification'],['type','Type'],['body','Message'],['created_at','Date']],true),activity:()=>genericRows('logs',[['action','Action'],['entity_type','Entity'],['entity_id','ID'],['created_at','When']],true),settings:settingsView};views.innerHTML=(v[S.view]||overview)()}
async function init(){if(await guard()){await refresh();subscribe();setView('overview')}}init();
</script></body></html>
